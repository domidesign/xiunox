<script>
// Tab 切换：纯 JS 实现，无 Bootstrap Tab 组件（避免 href 被当 CSS 选择器）
// 点击 tab 链接：拦截默认跳转，切换 active + pushState 更新 path，不全页刷新
(function(){
	var tabs = document.querySelectorAll('[data-banned-tab]');
	if(!tabs.length) return;

	tabs.forEach(function(tab) {
		tab.addEventListener('click', function(e){
			// Ctrl/Cmd+点击或中键：新标签页打开，不拦截
			if(e.ctrlKey || e.metaKey || e.button !== 0) return;

			e.preventDefault();
			var tabName = this.getAttribute('data-banned-tab');
			var targetPane = document.getElementById('banned-' + tabName);
			if(!targetPane) return;

			// 切换 nav-link active
			tabs.forEach(function(t){ t.classList.remove('active'); });
			this.classList.add('active');

			// 切换 tab-pane active show
			document.querySelectorAll('.tab-pane').forEach(function(p){
				p.classList.remove('show', 'active');
			});
			targetPane.classList.add('show', 'active');

			// 更新 URL，刷新时根据 path 还原 active 状态
			history.pushState({ bannedTab: tabName }, '', this.href);
		});
	});

	// 浏览器前进/后退：根据 state 还原 tab（不需要重新请求数据，DOM 已存在）
	window.addEventListener('popstate', function(e){
		var state = e.state || {};
		var tabName = state.bannedTab || 'current';
		var targetLink = document.querySelector('[data-banned-tab="' + tabName + '"]');
		if(targetLink) targetLink.click();
	});
})();
</script>
