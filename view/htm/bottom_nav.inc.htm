<script>
(function() {
	var tabbar = document.getElementById('mobileTabbar');
	if (!tabbar) return;

	var items = tabbar.querySelectorAll('.bottom-nav-item');
	var path = window.location.pathname + window.location.search;

	// 图标映射：普通 → 填充
	var iconMap = {
		'ti-home': 'ti-home-filled',
		'ti-category': 'ti-category-filled',
		'ti-circle-plus': 'ti-circle-plus-filled',
		'ti-compass': 'ti-compass-filled',
		'ti-user': 'ti-user-filled'
	};

	function setActive(item) {
		item.classList.add('active');
		// 替换为填充图标
		var icon = item.querySelector('i');
		if (icon) {
			for (var normal in iconMap) {
				if (icon.classList.contains(normal)) {
					icon.classList.remove(normal);
					icon.classList.add(iconMap[normal]);
					break;
				}
			}
		}
	}

	var matched = false;
	items.forEach(function(item) {
		var nav = item.getAttribute('data-nav');
		if (!nav) return;

		var isHome = (nav === 'home') && (path === '/' || path === '/index.php' || path.indexOf('index') > -1 || path === './');
		var isForum = (nav === 'forum') && /forums/i.test(path);
		var isCreate = (nav === 'create') && /thread-create/i.test(path);
		var isDiscover = (nav === 'discover') && /more/i.test(path);
		var isMe = (nav === 'me') && (/my/i.test(path) && !/my-notice/i.test(path));

		if (isHome || isForum || isCreate || isDiscover || isMe) {
			setActive(item);
			matched = true;
		}
	});

	if (!matched) {
		setActive(items[0]);
	}
})();
</script>
