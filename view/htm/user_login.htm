<script>
// 登录表单：htmx 统一处理提交和响应
(function() {
	var form = document.getElementById('form');
	if(!form) return;

	// htmx 请求完成后：刷新验证码 + 处理特殊错误（锁定等）
	form.addEventListener('htmx:after:request', function(event) {
		// 每次提交后刷新验证码
		if(typeof captchaRefresh === 'function') captchaRefresh('login');

		var response = event.detail && event.detail.ctx && event.detail.ctx.response;
		if(!response || !response.ok) return;

		// 检查 target 中是否有错误消息（htmx 已 swap 进去）
		setTimeout(function() {
			var msgEl = document.getElementById('login-msg');
			if(!msgEl) return;
			var errDiv = msgEl.querySelector('[data-code]') || msgEl;
			var errCode = parseInt(errDiv.getAttribute('data-code')) || 0;
			// 验证码错误 (code -1001)：显示在验证码行内
			if(errCode === -1001) {
				var captchaErr = document.getElementById('captcha-error-login');
				if(captchaErr) captchaErr.textContent = msgEl.textContent || '';
			}
			// 账号锁定/频率限制 (code -1002/-1003)：禁用按钮并倒计时
			if(errCode === -1002 || errCode === -1003) {
				var submitBtn = document.getElementById('submit');
				var inputs = form.querySelectorAll('input:not([type=hidden])');
				if(submitBtn) {
					submitBtn.disabled = true;
					inputs.forEach(function(inp) { inp.disabled = true; });
					var seconds = parseInt(errDiv.getAttribute('data-wait')) || 300;
					var originalText = submitBtn.textContent.trim();
					var timer = setInterval(function() {
						seconds--;
						if(seconds <= 0) {
							clearInterval(timer);
							submitBtn.disabled = false;
							submitBtn.textContent = originalText;
							inputs.forEach(function(inp) { inp.disabled = false; });
						} else {
							var m = Math.floor(seconds / 60);
							var s = seconds % 60;
							submitBtn.textContent = originalText + ' (' + m + ':' + (s < 10 ? '0' : '') + s + ')';
						}
					}, 1000);
				}
			}
		}, 50);
	});
})();
</script>
