<script src="<?php echo $conf['view_url'];?>vendor/animejs/anime.umd.min.js"></script>
<script>
(function() {
	var { animate, stagger } = anime;
	// 排行列表项淡入动画
	var items = document.querySelectorAll('#rank-content .thread-list-item');
	if (items.length) {
		animate(items, {
			opacity: [0, 1],
			translateY: [20, 0],
			delay: stagger(50),
			duration: 300,
			ease: 'outQuad'
		});
	}
	// htmx 切换 tab/周期时也触发动画
	document.addEventListener('htmx:afterSettle', function(e) {
		if (!e.detail.elt || !e.detail.elt.closest('#rank-content') && e.detail.target !== document.getElementById('rank-content')) return;
		var newItems = document.querySelectorAll('#rank-content .thread-list-item:not([data-animated])');
		if (newItems.length) {
			newItems.forEach(function(el) { el.dataset.animated = '1'; });
			animate(newItems, {
				opacity: [0, 1],
				translateY: [20, 0],
				delay: stagger(50),
				duration: 300,
				ease: 'outQuad'
			});
		}
	});
})();
</script>
