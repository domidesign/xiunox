<script>
// 基本资料表单提交
var profileForm = document.getElementById('profile_form');
var profileSubmit = document.getElementById('profile_submit');
var profileSubmitOriginal = profileSubmit.innerHTML;

// 提交前禁用按钮，防止重复提交
profileForm.addEventListener('htmx:beforeRequest', function(e) {
	profileSubmit.disabled = true;
	profileSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';
});

// 请求完成后处理响应
profileForm.addEventListener('htmx:afterRequest', function(e) {
	var response = e.detail && e.detail.xhr;
	if(!response || response.status !== 200) {
		// 失败时恢复按钮
		profileSubmit.disabled = false;
		profileSubmit.innerHTML = profileSubmitOriginal;
		return;
	}
	try {
		var res = JSON.parse(response.responseText);
		if(parseInt(res.code) === 0) {
			// 成功：更新签名展示
			var sigDisplay = this.querySelector('.user-signature-display');
			var sigInput = this.querySelector('[name="signature"]');
			if(sigDisplay && sigInput) {
				var newSig = sigInput.value.trim();
				if(newSig) {
					sigDisplay.innerHTML = '<i class="ti ti-quote me-1"></i>' + XN.escapeHtml(newSig);
					sigDisplay.style.display = '';
				} else {
					sigDisplay.style.display = 'none';
				}
			}
			// 判断是否需要审核（消息包含"审核"字样）
			var needAudit = res.message && res.message.indexOf('审核') >= 0;
			if(needAudit) {
				// 需要审核：禁用表单字段，显示审核状态，刷新页面
				profileSubmit.innerHTML = '<i class="ti ti-clock-hour-4 me-1"></i>' + res.message;
				profileSubmit.classList.remove('btn-primary');
				profileSubmit.classList.add('btn-warning');
				// 刷新页面以显示审核状态
				setTimeout(function() {
					window.location.reload();
				}, 1500);
			} else {
				// 直接成功：显示成功后恢复按钮
				profileSubmit.innerHTML = '<i class="ti ti-check me-1"></i>' + res.message;
				profileSubmit.classList.remove('btn-primary');
				profileSubmit.classList.add('btn-success');
				setTimeout(function() {
					profileSubmit.disabled = false;
					profileSubmit.innerHTML = profileSubmitOriginal;
					profileSubmit.classList.remove('btn-success');
					profileSubmit.classList.add('btn-primary');
				}, 1500);
			}
		} else {
			// 错误：恢复按钮
			profileSubmit.disabled = false;
			profileSubmit.innerHTML = profileSubmitOriginal;
		}
	} catch(ex) {
		profileSubmit.disabled = false;
		profileSubmit.innerHTML = profileSubmitOriginal;
	}
});
</script>
