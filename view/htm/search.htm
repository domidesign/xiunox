		<div class="x-card card mt-3" id="searchHistoryCard">
			<div class="card-body">
				<div class="d-flex justify-content-between align-items-center mb-2">
					<h6 class="mb-0"><i class="ti ti-history me-1"></i><?php echo lang('search_history');?></h6>
					<button type="button" class="btn btn-sm btn-link text-muted p-0" id="clearHistoryBtn"><i class="ti ti-trash me-1"></i><?php echo lang('clear');?></button>
				</div>
				<div id="searchHistoryList" class="d-flex flex-wrap gap-2"></div>
				<div id="searchHistoryEmpty" class="text-center text-muted py-3" style="display:none"><?php echo lang('no_search_history');?></div>
			</div>
		</div>
		<script>
		(function(){
			var SEARCH_KEY = 'search_history';
			var MAX_HISTORY = 10;
			var searchUrl = '<?php echo search_url();?>';

			function getHistory() {
				try { return JSON.parse(localStorage.getItem(SEARCH_KEY) || '[]'); } catch(e) { return []; }
			}
			function saveHistory(keyword) {
				keyword = (keyword || '').trim();
				if(!keyword) return;
				var history = getHistory();
				history = history.filter(function(item) { return item !== keyword; });
				history.unshift(keyword);
				if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
				try { localStorage.setItem(SEARCH_KEY, JSON.stringify(history)); } catch(e) {}
			}
			function escapeHtml(s) {
				return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
			}
			function renderHistory() {
				var history = getHistory();
				var list = document.getElementById('searchHistoryList');
				var empty = document.getElementById('searchHistoryEmpty');
				if(!list) return;
				if(history.length === 0) {
					list.innerHTML = '';
					if(empty) empty.style.display = '';
					return;
				}
				if(empty) empty.style.display = 'none';
				list.innerHTML = history.map(function(item) {
					var href = searchUrl + '?keyword=' + encodeURIComponent(item);
					return '<a href="' + href + '" class="badge bg-light text-decoration-none border text-body" style="font-size:0.85em;padding:0.4em 0.8em" hx-get="' + href + '" hx-target="#searchResults" hx-select="#searchResults" hx-swap="innerHTML" hx-push-url="true">' + escapeHtml(item) + '</a>';
				}).join('');
			}

			// 搜索提交时保存关键词
			var form = document.getElementById('searchForm');
			if(form) {
				form.addEventListener('htmx:before:request', function(e) {
					var input = form.querySelector('input[name="keyword"]');
					if(input && input.value.trim()) saveHistory(input.value);
				});
				// 非 htmx 提交兜底
				form.addEventListener('submit', function() {
					var input = form.querySelector('input[name="keyword"]');
					if(input && input.value.trim()) saveHistory(input.value);
				});
			}
			// 清空历史
			var clearBtn = document.getElementById('clearHistoryBtn');
			if(clearBtn) {
				clearBtn.addEventListener('click', function() {
					try { localStorage.removeItem(SEARCH_KEY); } catch(e) {}
					renderHistory();
				});
			}
			// 初始渲染
			renderHistory();
		})();
		</script>
		<?php } ?>

<script>
document.getElementById('searchForm').addEventListener('htmx:after:request', function(event) {
	var response = event.detail.ctx && event.detail.ctx.response;
	if(!response || !response.ok) return;
	response.text().then(function(text) {
		try {
			var json = JSON.parse(text);
			if(parseInt(json.code) !== 0) {
				if(typeof XN.toast === 'function') XN.toast(json.message || '<?php echo lang('search_failed');?>', 'danger');
				var resultsEl = document.getElementById('searchResults');
				if(resultsEl) {
					resultsEl.innerHTML = '<div class="x-card card mt-3"><div class="card-body text-center py-5 text-body-secondary"><i class="ti ti-alert-circle fs-1 mb-3 d-block opacity-25"></i><p class="fs-5 fw-semibold">' + (json.message || '<?php echo lang('search_failed');?>') + '</p></div></div>';
				}
			}
		} catch(e) {
			// 非 JSON 响应是正常的 HTML，htmx 会自动处理
		}
	});
});
</script>
