<script>
// 表单提交防重：capture 阶段同步拦截快速双击，请求期间禁用按钮显示 loading，
// 网络错误/超时/请求结束后恢复（与 post.htm 发帖防重模式一致的精简版）
// ponytail: 30s 超时后仅恢复按钮不 abort 请求——改邮箱验证码一次性消费、改密码成功后 token
// 失效并跳转，重复提交由后端幂等兜底，无需 htmx:abort
function xnx_form_guard(formId, btnId) {
	var form = document.getElementById(formId);
	var btn = document.getElementById(btnId);
	if(!form || !btn) return;
	var loadingText = btn.getAttribute('data-loading-text') || '';
	var originalText = btn.textContent;
	var timer = null;
	var busy = false;
	// capture 阶段：htmx:before:request 是异步的，无法拦截快速双击产生的两次 submit 事件，
	// 必须在 submit 阶段同步置位（同 post.htm/thread_js.inc.htm 的 isSubmitting 模式）
	form.addEventListener('submit', function(evt) {
		if(busy) {
			evt.preventDefault();
			evt.stopPropagation();
			return;
		}
		busy = true;
		btn.disabled = true;
		if(loadingText) btn.textContent = loadingText;
	}, true);
	function restore() {
		if(timer) { clearTimeout(timer); timer = null; }
		busy = false;
		btn.disabled = false;
		btn.textContent = originalText;
	}
	// 请求前启动超时兜底：服务器卡死/网络无响应时按钮不永久卡在 loading
	form.addEventListener('htmx:before:request', function() {
		if(timer) clearTimeout(timer);
		timer = setTimeout(function() {
			restore();
			if(typeof XN.toast === 'function') XN.toast('<?php echo lang('request_timeout');?>', 'danger');
		}, 30000);
	});
	// htmx 4 冒号事件名；网络层错误（DNS/连接失败）早于 after:request 触发，立即恢复
	form.addEventListener('htmx:response:error', function() {
		restore();
		if(typeof XN.toast === 'function') XN.toast('<?php echo lang('network_request_failed');?>', 'danger');
	});
	// 一定触发（即使 swap 失败），成功/失败统一恢复按钮
	form.addEventListener('htmx:after:request', restore);
}
xnx_form_guard('email_form', 'email_submit');
xnx_form_guard('password_form', 'password_submit');
var jsend_code_btn = document.getElementById('send_code_btn');
var send_code_timer = 0;
jsend_code_btn.addEventListener('click', function() {
	var emailInput = document.getElementById('email_new');
	var email = emailInput.value;
	if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
		emailInput.focus();
		return;
	}
	jsend_code_btn.disabled = true;
	// 同步发送期间显示 loading 文本，SMTP 握手需 1-5 秒
	var originalText = jsend_code_btn.textContent;
	jsend_code_btn.textContent = <?php echo json_encode(lang('sending'));?>;
	var body = new URLSearchParams();
	body.append('email', email);
	var csrfMeta = document.querySelector('meta[name="csrf-token"]');
	if (csrfMeta) body.append('csrf_token', csrfMeta.getAttribute('content'));
	fetch('<?php echo my_send_email_code_url();?>', {
		method: 'POST',
		body: body,
		headers: {
			'X-Requested-With': 'XMLHttpRequest',
			'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
		},
		credentials: 'same-origin'
	}).then(function(r) { return r.json(); }).then(function(res) {
		var code = res.code || 0;
		var msg = res.message || '';
		if(code == 0) {
			if(typeof XN.toast === 'function') XN.toast(msg, 'success');
			send_code_timer = (res && res.wait) ? parseInt(res.wait) : 60;
			if(isNaN(send_code_timer) || send_code_timer < 1) send_code_timer = 60;
			jsend_code_btn.textContent = send_code_timer + 's';
			var interval = setInterval(function() {
				send_code_timer--;
				if(send_code_timer <= 0) {
					clearInterval(interval);
					jsend_code_btn.textContent = '<?php echo lang('send_verify_code');?>';
					jsend_code_btn.disabled = false;
				} else {
					jsend_code_btn.textContent = send_code_timer + 's';
				}
			}, 1000);
		} else {
			if(typeof XN.toast === 'function') XN.toast(msg || '<?php echo lang('error_label'); ?>', 'danger');
			jsend_code_btn.disabled = false;
			jsend_code_btn.textContent = originalText;
		}
	}).catch(function() {
		if(typeof XN.toast === 'function') XN.toast('<?php echo lang('error_label'); ?>', 'danger');
		jsend_code_btn.disabled = false;
		jsend_code_btn.textContent = originalText;
	});
});
</script>
