<!-- both 模式开关 JS：use_default 勾选时隐藏自定义配置区 -->
<script>
document.querySelectorAll('input[name$="_use_default"]').forEach(function(cb) {
	cb.addEventListener('change', function() {
		var fields = this.closest('.card-body').querySelector('.feat-custom-fields');
		if (fields) fields.style.display = this.checked ? 'none' : 'block';
	});
});
</script>
