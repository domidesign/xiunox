<script>
// 注册表单：htmx 统一处理提交和响应
// - 成功+跳转：后端返回 HX-Trigger → 全局 htmxSuccessRedirect 事件 → toast + 延迟跳转
// - 失败：后端返回 HTML 错误片段 → htmx swap 到 #create-msg
(function() {
	var form = document.getElementById('form');
	if(!form) return;

	// htmx 请求完成后：刷新验证码 + 处理特殊错误
	form.addEventListener('htmx:after:request', function(event) {
		// 每次提交后刷新验证码
		if(typeof captchaRefresh === 'function') captchaRefresh('register');

		var response = event.detail && event.detail.ctx && event.detail.ctx.response;
		if(!response || !response.ok) return;

		// 检查 target 中是否有错误消息（htmx 已 swap 进去）
		setTimeout(function() {
			var msgEl = document.getElementById('create-msg');
			if(!msgEl) return;
			var errDiv = msgEl.querySelector('[data-code]') || msgEl;
			var errCode = parseInt(errDiv.getAttribute('data-code')) || 0;
			// 验证码错误 (code -1001)
			if(errCode === -1001) {
				var captchaErr = document.getElementById('captcha-error-register');
				if(captchaErr) captchaErr.textContent = msgEl.textContent || '';
			}
		}, 50);
	});

	<?php if($conf['user_create_email_on']) { ?>
	// 验证码发送成功后启用提交按钮
	var sendBtn = document.getElementById('sendcode');
	if(sendBtn) {
		sendBtn.addEventListener('click', function() {
			setTimeout(function() {
				var submitBtn = document.getElementById('submit');
				if(submitBtn && submitBtn.disabled) {
					submitBtn.disabled = false;
				}
			}, 500);
		});
	}
	<?php } ?>
})();
</script>
