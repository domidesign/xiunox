<script>
document.addEventListener('DOMContentLoaded', function() {
	var providerSelect = document.getElementById('ai_provider');
	var endpointInput = document.getElementById('ai_endpoint');
	var modelInput = document.getElementById('ai_model');
	
	var endpointMap = {
		'openai': 'https://api.openai.com',
		'deepseek': 'https://api.deepseek.com',
		'gitee': 'https://ai.gitee.com/api/inference/serverless/',
		'spark': '',
		'wenxin': '',
		'custom': ''
	};
	var modelMap = {
		'openai': 'gpt-4o-mini',
		'deepseek': 'deepseek-chat',
		'gitee': '',
		'spark': 'v3.5',
		'wenxin': '',
		'custom': ''
	};
	
	providerSelect.addEventListener('change', function() {
		var v = this.value;
		if(!endpointInput.value && endpointMap[v]) {
			endpointInput.value = endpointMap[v];
		}
		if(!modelInput.value && modelMap[v]) {
			modelInput.value = modelMap[v];
		}
	});
	
	document.querySelector('a[data-active="user-ai"]').classList.add('active');
});
</script>
