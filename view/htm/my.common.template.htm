<script>

// 基本资料表单提交后：更新签名展示
document.getElementById('profile_form').addEventListener('htmx:after:request', function(e) {
	var response = e.detail && e.detail.xhr;
	if(!response || response.status !== 200) return;
	try {
		var res = JSON.parse(response.responseText);
		if(parseInt(res.code) === 0) {
			// 更新签名展示区域
			var sigDisplay = this.querySelector('.user-signature-display');
			var sigInput = this.querySelector('[name="signature"]');
			if(sigDisplay && sigInput) {
				var newSig = sigInput.value.trim();
				if(newSig) {
					sigDisplay.innerHTML = '<i class="ti ti-quote me-1"></i>' + XN.escapeHtml(newSig);
					sigDisplay.style.display = '';
				} else {
					sigDisplay.style.display = 'none';
				}
			}
		}
	} catch(ex) {}
});

document.getElementById('password_form').addEventListener('htmx:config:request', function(e) {
	// 密码明文直接提交，服务端 bcrypt 处理
});
var jsend_code_btn = $('#send_code_btn');
var send_code_timer = 0;
jsend_code_btn.on('click', function() {
	var email = $('#email_new').val();
	if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
		$('#email_new').focus();
		return;
	}
	jsend_code_btn.prop('disabled', true);
	XN.post('<?php echo my_send_email_code_url();?>', {email: email}, function(code, msg) {
		if(code == 0) {
			if(typeof XN.toast === 'function') XN.toast(msg, 'success');
			send_code_timer = (this && this.wait) ? parseInt(this.wait) : 60;
			if(isNaN(send_code_timer) || send_code_timer < 1) send_code_timer = 60;
			jsend_code_btn.text(send_code_timer + 's');
			var interval = setInterval(function() {
				send_code_timer--;
				if(send_code_timer <= 0) {
					clearInterval(interval);
					jsend_code_btn.text('<?php echo lang('send_verify_code');?>').prop('disabled', false);
				} else {
					jsend_code_btn.text(send_code_timer + 's');
				}
			}, 1000);
		} else {
			if(typeof XN.toast === 'function') XN.toast(msg || 'Error', 'danger');
			jsend_code_btn.prop('disabled', false);
		}
	});
});

// ========== 头像设置（原生 JS，表单提交 + 页面刷新） ==========
(function(){
	var fileInput = document.getElementById('avatar_file_input');
	var previewWrap = document.getElementById('avatar_preview_wrap');
	var previewImg = document.getElementById('avatar_preview_img');
	var selectHint = document.getElementById('avatar_select_hint');
	var uploadBtn = document.getElementById('avatar_upload_btn');
	var dropzone = document.getElementById('avatar_dropzone');

	function handleFileSelect(file) {
		if(!file || !file.type.match(/^image\//)) return;
		if(file.size > 5242880) {
			if(typeof showToast === 'function') showToast('<?php echo lang('image_size_limit');?>', 'error');
			return;
		}
		var reader = new FileReader();
		reader.onload = function(e) {
			previewImg.src = e.target.result;
			previewWrap.style.display = 'block';
			selectHint.style.display = 'none';
			uploadBtn.disabled = false;
		};
		reader.readAsDataURL(file);
	}

	fileInput.addEventListener('change', function() {
		if(this.files && this.files[0]) handleFileSelect(this.files[0]);
	});

	dropzone.addEventListener('click', function(e) {
		if(e.target.tagName !== 'INPUT') fileInput.click();
	});

	dropzone.addEventListener('dragover', function(e) { e.preventDefault(); this.style.borderColor = 'var(--bs-primary)'; });
	dropzone.addEventListener('dragleave', function(e) { e.preventDefault(); this.style.borderColor = ''; });
	dropzone.addEventListener('drop', function(e) {
		e.preventDefault();
		this.style.borderColor = '';
		if(e.dataTransfer.files && e.dataTransfer.files[0]) {
			fileInput.files = e.dataTransfer.files;
			handleFileSelect(e.dataTransfer.files[0]);
		}
	});

	var presetContainer = document.getElementById('preset_avatars');
	var presetIndexInput = document.getElementById('preset_index_input');
	var presetForm = document.getElementById('preset_form');

	if(presetContainer && presetForm) {
		presetContainer.addEventListener('click', function(e) {
			var img = e.target.closest('.preset-avatar');
			if(!img) return;
			var idx = img.getAttribute('data-index');
			if(!idx) return;
			XN.confirm('<?php echo lang('confirm_use_avatar');?>', function() {
				presetIndexInput.value = idx;
				var btn = document.createElement('button');
				btn.type = 'submit';
				btn.name = 'submit';
				presetForm.appendChild(btn);
				btn.click();
				btn.remove();
			});
		});
	}

	var resetBtn = document.getElementById('avatar_reset_btn');
	var resetForm = document.getElementById('reset_form');
	if(resetBtn && resetForm) {
		resetBtn.addEventListener('click', function() {
			XN.confirm('<?php echo lang('confirm_reset_avatar');?>', function() {
				var btn = document.createElement('button');
				btn.type = 'submit';
				btn.name = 'submit';
				resetForm.appendChild(btn);
				btn.click();
				btn.remove();
			});
		});
	}
})();

// ========== Tab 切换函数（my 页面内 tab 切换） ==========
function switchMyTab(tabName) {
	document.querySelectorAll('#myTabContent > .tab-pane').forEach(function(pane) {
		pane.classList.remove('show', 'active');
	});
	var target = document.getElementById('tab-' + tabName);
	if(target) {
		target.classList.add('show', 'active');
	}
	document.querySelectorAll('.side-nav-item').forEach(function(item) {
		item.classList.remove('active');
	});
	var activeItem = document.querySelector('.side-nav-item[data-tab="' + tabName + '"]');
	if(activeItem) activeItem.classList.add('active');
	document.querySelectorAll('#settingsTabMobile .nav-link').forEach(function(btn) {
		btn.classList.remove('active');
		if(btn.getAttribute('data-tab') === tabName) btn.classList.add('active');
	});
	if(history.replaceState) {
		history.replaceState(null, '', '#' + tabName);
	}
}

// 侧边栏 nav 点击处理
document.querySelectorAll('.side-nav-item[data-tab]').forEach(function(item) {
	item.addEventListener('click', function(e) {
		e.preventDefault();
		var tabName = this.getAttribute('data-tab');
		if(tabName) switchMyTab(tabName);
	});
});

// 移动端 tab 点击处理
document.querySelectorAll('#settingsTabMobile .nav-link[data-tab]').forEach(function(link) {
	link.addEventListener('click', function(e) {
		e.preventDefault();
		var tabName = this.getAttribute('data-tab');
		if(tabName) switchMyTab(tabName);
	});
});

// 页面加载时根据 URL hash 恢复 tab
(function() {
	var validTabs = ['profile', 'security', 'avatar', 'ai', 'credits'];
	var hash = location.hash.replace('#', '');
	if(hash && validTabs.indexOf(hash) !== -1) {
		switchMyTab(hash);
	}
	// 监听 hash 变化，点击侧边栏链接后切换 tab
	window.addEventListener('hashchange', function() {
		var h = location.hash.replace('#', '');
		if(h && validTabs.indexOf(h) !== -1) {
			switchMyTab(h);
		}
	});
})();
