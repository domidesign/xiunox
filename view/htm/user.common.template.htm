<script>
	document.querySelectorAll('a[data-tab]').forEach(function(link) {
		link.addEventListener('click', function() {
			var tabName = this.dataset.tab;
			var tabBtn = document.querySelector('#userTab button[data-bs-target="#tab-' + tabName + '"]');
			if (tabBtn) tabBtn.click();
		});
	});

	// Tab hash 路由
	(function() {
		var validTabs = ['thread', 'post', 'following', 'followers', 'favorite', 'like'];
		var tabEl = document.getElementById('userTab');
		if (!tabEl) return;

		// 页面加载时根据 hash 切换 tab
		var hash = location.hash.replace('#', '');
		if (hash && validTabs.indexOf(hash) !== -1) {
			var tabBtn = tabEl.querySelector('button[data-tab-name="' + hash + '"]');
			if (tabBtn) {
				tabBtn.click();
			}
		}

		// tab 切换时更新 hash
		tabEl.addEventListener('shown.bs.tab', function(e) {
			var tabName = e.target.getAttribute('data-tab-name');
			if (tabName && history.replaceState) {
				history.replaceState(null, '', '#' + tabName);
			}
		});

		// 监听 hash 变化
		window.addEventListener('hashchange', function() {
			var h = location.hash.replace('#', '');
			if (h && validTabs.indexOf(h) !== -1) {
				var tabBtn = tabEl.querySelector('button[data-tab-name="' + h + '"]');
				if (tabBtn) tabBtn.click();
			}
		});
	})();

	// 帖子/关注/粉丝列表淡入动画
	(function(){
		if(typeof anime === 'undefined') return;
		var animate = anime.animate;
		var stagger = anime.stagger;

		function animateUserList() {
			var items = document.querySelectorAll('#userTab + .tab-content .thread-list-item:not([data-animated]), #userTab + .tab-content .list-group-item:not([data-animated]), #userTab + .tab-content .d-flex.align-items-center.gap-3:not([data-animated])');
			if(!items.length) return;

			items.forEach(function(item) {
				item.style.opacity = '0';
				item.style.transform = 'translateY(15px)';
			});

			animate(items, {
				opacity: 1,
				translateY: 0,
				duration: 300,
				delay: stagger(40),
				ease: 'outQuad',
				onComplete: function() {
					items.forEach(function(item) {
						item.setAttribute('data-animated', '1');
					});
				}
			});
		}

		animateUserList();

		// tab 切换后执行动画
		var userTab = document.getElementById('userTab');
		if(userTab) {
			userTab.addEventListener('shown.bs.tab', function() {
				setTimeout(animateUserList, 100);
			});
		}
	})();
</script>
