<script>
document.getElementById('form').addEventListener('htmx:after:request', function(event) {
	var response = event.detail.ctx && event.detail.ctx.response;
	if(!response || !response.ok) return;
	response.text().then(function(text) {
		try {
			var json = JSON.parse(text);
			var code = parseInt(json.code);
			if(code !== 0 || json.code === 'password' || json.code === 'email') {
				var msg = json.message || '<?php echo lang('operation_failed');?>';
				if(typeof XN.toast === 'function') XN.toast(msg, 'danger');
				var msgEl = document.getElementById('resetpw-msg');
				if(msgEl) {
					msgEl.innerHTML = '<div class="alert alert-danger py-2 small mb-2" data-code="' + code + '">' + msg + '</div>';
				}
				// 验证码错误 (code -1001)
				if(code === -1001) {
					var captchaErr = document.getElementById('captcha-error-resetpw');
					if(captchaErr) captchaErr.textContent = msg;
				}
			}
			// 每次提交后刷新验证码
			if(typeof captchaRefresh === 'function') captchaRefresh('resetpw');
		} catch(e) {}
	});
});
</script>
