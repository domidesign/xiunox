<script>
function selectTheme(theme) {
	document.documentElement.setAttribute('data-bs-theme', theme);
	localStorage.setItem('theme', theme);

	document.querySelectorAll('[data-theme-name]').forEach(function(card) {
		card.classList.remove('border-primary');
		card.classList.add('border-secondary');
		var badge = card.querySelector('.badge');
		if(badge) badge.parentElement.remove();
	});

	var activecard= document.querySelector('[data-theme-name="' + theme + '"]');
	if(activeCard) {
		activeCard.classList.remove('border-secondary');
		activeCard.classList.add('border-primary');
		var inner = activeCard.querySelector('[data-bs-theme]');
		if(inner && !activeCard.querySelector('.badge')) {
			var div = document.createElement('div');
			div.className = 'position-absolute top-0 end-0 m-2';
			div.innerHTML = '<span class="badge bg-primary "><i class="ti ti-check" style="font-size:.75rem"></i></span>';
			activeCard.appendChild(div);
		}
	}

	var iconLight = document.getElementById('theme-icon-light');
	var iconDark = document.getElementById('theme-icon-dark');
	if(iconLight && iconDark) {
		if(theme === 'dark') {
			iconLight.classList.add('d-none');
			iconDark.classList.remove('d-none');
		} else {
			iconLight.classList.remove('d-none');
			iconDark.classList.add('d-none');
		}
	}

	$.xpost('<?php echo theme_url();?>', {theme: theme}, function(code, msg) {});
}
</script>
