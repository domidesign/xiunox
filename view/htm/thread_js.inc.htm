<link href="<?php echo $conf['view_url'];?>vendor/highlightjs/styles/atom-one-dark.min.css<?php echo $conf['static_version'];?>" rel="stylesheet">
<script src="<?php echo $conf['view_url'];?>vendor/highlightjs/highlight.min.js<?php echo $conf['static_version'];?>"></script>
<link href="<?php echo $conf['view_url'];?>js/aieditor/style.css<?php echo $conf['static_version'];?>" rel="stylesheet">
<script>
    (function () {
        // 代码高亮：highlight.js 11.x 内部用 data-highlighted="yes" 标记，重复调用自动跳过
        function doHighlight(container) {
            if (typeof hljs === 'undefined') return;
            (container || document).querySelectorAll('pre code:not([data-highlighted])').forEach(function (el) {
                hljs.highlightElement(el);
            });
        }

        // 主题切换：正文 .message 同步 aie-theme-dark class
        function syncThemeClass() {
            var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            document.querySelectorAll('div.message.aie-content').forEach(function (el) {
                el.classList.toggle('aie-theme-dark', isDark);
            });
        }

        // 首次加载
        doHighlight(document);
        syncThemeClass();

        // 监听主题属性变化
        new MutationObserver(syncThemeClass).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-bs-theme'] }
        );

        // htmx 局部刷新后：高亮 + 同步主题
        document.addEventListener('htmx:after:swap', function (evt) {
            doHighlight(evt.target);
            syncThemeClass();
        });
    })();
</script>

<script>
    function resize_image() {
        var jmessagelist = $('div.message');
        var first_width = jmessagelist.width();
        jmessagelist.each(function () {
            var jdiv = $(this);
            var maxwidth = jdiv.attr('isfirst') ? first_width : jdiv.width();
            var jmessage_width = Math.min(jdiv.width(), maxwidth);
            jdiv.find('img, embed, iframe, video').each(function () {
                var jimg = $(this);
                var img_width = this.org_width;
                var img_height = this.org_height;
                if (!img_width) {
                    var img_width = jimg.attr('width');
                    var img_height = jimg.attr('height');
                    this.org_width = img_width;
                    this.org_height = img_height;
                }
                if (img_width > jmessage_width) {
                    if (this.tagName == 'IMG') {
                        jimg.width(jmessage_width);
                        jimg.css('height', 'auto');
                        jimg.css('cursor', 'pointer');
                    } else {
                        jimg.width(jmessage_width);
                        var height = (img_height / img_width) * jimg.width();
                        jimg.height(height);
                    }
                }
            });
        });
    }

    // 图片灯箱：原生 JS 实现，支持 htmx 局部刷新后重绑定（参考 bindCopyCode 模式）
    var lightboxImages = [];
    var lightboxIndex = 0;
    function bindLightbox(container) {
        var root = container || document;
        if (!root.querySelectorAll) return;
        var nodes = root.querySelectorAll('.message img');
        for (var i = 0; i < nodes.length; i++) {
            (function (img) {
                if (img.dataset.lightboxBound === '1') return;  // 避免重复绑定
                var src = img.getAttribute('src');
                if (!src || img.closest('a')) return;  // 裸图才绑定，被 <a> 包裹的保留跳转行为
                img.dataset.lightboxBound = '1';
                if (lightboxImages.indexOf(src) === -1) lightboxImages.push(src);
                img.style.cursor = 'pointer';
                img.addEventListener('click', function () {
                    lightboxIndex = lightboxImages.indexOf(src);
                    $('#lightboxImage').attr('src', src);
                    new bootstrap.Modal(document.getElementById('imageLightbox')).show();
                });
            })(nodes[i]);
        }
    }
    bindLightbox(document);
    document.addEventListener('htmx:after:swap', function (evt) {
        bindLightbox(evt.target);
    });
    $('#lightboxPrev').on('click', function () {
        if (lightboxImages.length === 0) return;
        lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
        $('#lightboxImage').attr('src', lightboxImages[lightboxIndex]);
    });
    $('#lightboxNext').on('click', function () {
        if (lightboxImages.length === 0) return;
        lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
        $('#lightboxImage').attr('src', lightboxImages[lightboxIndex]);
    });

    // 代码块复制按钮：原生 JS 实现，支持 htmx 局部刷新后重绑定
    function bindCopyCode(container) {
        var root = container || document;
        if (!root.querySelectorAll) return;
        var nodes = root.querySelectorAll('.message pre code');
        for (var i = 0; i < nodes.length; i++) {
            (function (codeEl) {
                var pre = codeEl.parentNode;
                if (!pre || pre.querySelector('.copy-code')) return;
                pre.style.position = 'relative';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'btn btn-sm btn-outline-primary position-absolute top-0 end-0 m-1 copy-code';
                btn.title = '<?php echo lang('copy');?>';
                btn.innerHTML = '<i class="ti ti-clipboard"></i>';
                pre.insertBefore(btn, codeEl);
            })(nodes[i]);
        }
    }
    // 复制到剪贴板：优先 Clipboard API（需 HTTPS/localhost 安全上下文），不可用或失败时回退 execCommand
    function copyCodeToClipboard(text) {
        return new Promise(function (resolve, reject) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(resolve, function (err) {
                    fallbackCopy(text) ? resolve() : reject(err);
                });
            } else {
                fallbackCopy(text) ? resolve() : reject(new Error('clipboard API unavailable'));
            }
        });
    }
    function fallbackCopy(text) {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand('copy');
            document.body.removeChild(ta);
            return ok;
        } catch (e) {
            console.error('fallback copy error:', e);
            return false;
        }
    }
    bindCopyCode(document);
    document.addEventListener('htmx:after:swap', function (evt) {
        bindCopyCode(evt.target);
    });
    document.addEventListener('click', function (e) {
        var btn = e.target.closest ? e.target.closest('.copy-code') : null;
        if (!btn) return;
        var codeEl = btn.parentNode.querySelector('code');
        if (!codeEl) return;
        copyCodeToClipboard(codeEl.textContent).then(function () {
            if (typeof showToast === 'function') {
                showToast('<?php echo lang('copied_to_clipboard');?>', 'success');
            }
        }, function (err) {
            console.error('copy failed:', err);
            if (typeof showToast === 'function') {
                showToast('<?php echo lang('copy_failed');?>', 'error');
            }
        });
    });
</script>

<!-- 评论排序：localStorage 记忆用户选择 -->
<script>
(function() {
    var sortGroup = document.getElementById('post-sort-group');
    if(!sortGroup) return;
    var currentSort = '<?php echo $sort;?>';
    var STORAGE_KEY = 'thread_post_sort';

    // 记忆当前排序
    try { localStorage.setItem(STORAGE_KEY, currentSort); } catch(e) {}

    // 点击排序按钮时记忆选择（链接会跳转，无需手动处理）
    sortGroup.querySelectorAll('a[data-sort]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var s = this.getAttribute('data-sort');
            try { localStorage.setItem(STORAGE_KEY, s); } catch(e) {}
        });
    });

    // 如果 URL 中没有 sort 参数但有 localStorage 记忆，自动跳转
    var urlParams = new URLSearchParams(window.location.search);
    if(!urlParams.has('sort')) {
        var saved = '';
        try { saved = localStorage.getItem(STORAGE_KEY) || ''; } catch(e) {}
        if(saved && saved !== 'asc' && saved !== currentSort) {
            var newUrl = window.location.pathname + '?sort=' + saved;
            window.location.href = newUrl;
        }
    }
})();
</script>

<!-- 快速回复：submit 同步防抖 + 成功清空表单 + 失败保留内容（htmx 4 事件名带冒号） -->
<script>
(function() {
    var form = document.getElementById('quick_reply_form');
    if (!form) return;

    var replyBtn = document.getElementById('submit');
    var replyOriginalText = replyBtn ? replyBtn.textContent.trim() : '';
    var isSubmitting = false;  // 防抖标志位

    window.resetReplySubmit = function() {
        isSubmitting = false;
        if (replyBtn) {
            replyBtn.disabled = false;
            if (replyOriginalText) replyBtn.textContent = replyOriginalText;
        }
    };

    // 关键：submit 事件 capture 阶段同步防抖，先于 htmx 的冒泡监听器执行
    // htmx:before:request 是异步的，无法拦截快速双击产生的两次 submit 事件
    form.addEventListener('submit', function(e) {
        if (isSubmitting) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
        }
        isSubmitting = true;
        // 同步禁用按钮，防止快速双击
        if (replyBtn) {
            replyBtn.disabled = true;
            var loadingText = replyBtn.getAttribute('data-loading-text');
            if (loadingText) replyBtn.textContent = loadingText;
        }
    }, true);  // capture: true，确保在 htmx 之前拦截

    // htmx 4：htmx:after:swap（swap 成功后处理）
    // 后端响应：成功=回帖HTML+OOB，待审=alert-warning，失败(message)=alert-danger
    // 由于 hx-swap="beforeend"，所有响应都追加到 #postlist 末尾，需检查 lastElementChild 区分
    form.addEventListener('htmx:after:swap', function(event) {
        window.resetReplySubmit();

        var postlist = document.getElementById('postlist');
        if (!postlist) return;

        var lastChild = postlist.lastElementChild;
        // 失败/待审：swap 进来的是 alert 提示，需移除以免破坏评论列表
        if (lastChild && lastChild.classList.contains('alert')) {
            var msg = lastChild.textContent.trim();
            var isDanger = lastChild.classList.contains('alert-danger');
            // 延迟移除提示元素
            setTimeout(function() { lastChild.remove(); }, 50);
            // toast 提示用户
            if (typeof XN !== 'undefined' && XN.toast && msg) {
                XN.toast(msg, isDanger ? 'danger' : 'info');
            }
            // 失败（alert-danger）：保留 form 内容，用户可修改后重试
            if (isDanger) return;
            // 待审（alert-warning）：回复已提交，清空 form
        } else if (lastChild && lastChild.hasAttribute && lastChild.hasAttribute('data-parent-pid')) {
            // Level-2 楼中楼回复：从 #postlist 末尾移除，移动到对应父评论的 .replies-container
            var parentPid = lastChild.getAttribute('data-parent-pid');
            var parentLi = postlist.querySelector('li[data-pid="' + parentPid + '"]');
            if (!parentLi) {
                // 找不到父评论：降级保留在 #postlist 末尾（刷新后由后端重新渲染）
                if (typeof XN !== 'undefined' && XN.toast) {
                    XN.toast('<?php echo lang('create_post_sucessfully');?>', 'success');
                }
            } else {
                var repliesContainer = parentLi.querySelector('.replies-container[data-pid="' + parentPid + '"]');
                // 父评论无 replies-container（这是第一条 Level-2 回复）：创建容器结构
                if (!repliesContainer) {
                    repliesContainer = document.createElement('div');
                    repliesContainer.className = 'replies-container mt-2';
                    repliesContainer.setAttribute('data-pid', parentPid);
                    parentLi.querySelector('.flex-fill').appendChild(repliesContainer);
                }
                // 移动 Level-2 回复到容器末尾
                repliesContainer.appendChild(lastChild);
                // 展开折叠区（如果有 .reply-extra 被隐藏）
                var replyExtra = repliesContainer.querySelector('.reply-extra.d-none');
                if (replyExtra) {
                    replyExtra.classList.remove('d-none');
                    var toggleBtn = repliesContainer.querySelector('.reply-toggle-btn');
                    if (toggleBtn) toggleBtn.remove();
                }
                // 滚动到新回复
                setTimeout(function() {
                    lastChild.scrollIntoView({behavior: 'smooth', block: 'center'});
                }, 50);
            }
        }

        // 成功：清空表单 + 隐藏引用条
        form.reset();
        var quoteBar = document.getElementById('reply-quote-bar');
        if (quoteBar) quoteBar.classList.add('d-none');
    });

    // 兜底：htmx 4 请求出错（网络错误等）时恢复按钮
    form.addEventListener('htmx:response-error', function(e) {
        window.resetReplySubmit();
    });
    form.addEventListener('htmx:send-error', function(e) {
        window.resetReplySubmit();
    });
})();
</script>

    // 渲染表情网格
    emojis.forEach(function(e) {
        var span = document.createElement('span');
        span.textContent = e;
        span.style.cssText = 'cursor:pointer;font-size:20px;padding:2px 4px;border-radius:4px;line-height:1.2;transition:background .15s';
        span.addEventListener('mouseenter', function() { this.style.background = 'var(--bs-gray-200,#e9ecef)'; });
        span.addEventListener('mouseleave', function() { this.style.background = ''; });
        span.addEventListener('click', function() {
            var start = msgInput.selectionStart;
            var end = msgInput.selectionEnd;
            var val = msgInput.value;
            msgInput.value = val.substring(0, start) + e + val.substring(end);
            msgInput.selectionStart = msgInput.selectionEnd = start + e.length;
            msgInput.focus();
        });
        emojiGrid.appendChild(span);
    });

    // 切换面板显示

        e.stopPropagation();
        emojiPanel.classList.toggle('d-none');

            emojiPanel.classList.add('d-none');
        }
    });
})();

                width: 52,

                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        }
        // 复制帖子网址
        var copyBtn = document.getElementById('copyThreadUrlBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', function () {
                var url = this.getAttribute('data-url');
                var okMsg = '<?php echo lang('copied_to_clipboard');?>';
                var failMsg = '<?php echo lang('copy_failed');?>';
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(function () {
                        XN.toast(okMsg, 'success');
                    }).catch(function () {
                        fallbackCopy(url, okMsg, failMsg);
                    });
                } else {
                    fallbackCopy(url, okMsg, failMsg);
                }
            });
        }
        function fallbackCopy(text, okMsg, failMsg) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                XN.toast(okMsg, 'success');
            } catch (e) {
                XN.toast(failMsg, 'error');
            }
            document.body.removeChild(ta);
        }
    })();
</script>

<!-- 帖子目录：从正文标题自动生成 -->
<script>
(function() {
    var content = document.querySelector('.message[isfirst="1"]');
    if (!content) return;

    var headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length < 2) return; // 少于2个标题不显示目录

    var tocEl = document.getElementById('thread-toc');
    var navEl = document.getElementById('thread-toc-nav');
    var sidebarNav = document.getElementById('thread-sidebar-nav');
    if (!tocEl || !navEl) return;

    // 为每个标题添加 id（如果没有的话）
    var tocItems = [];
    headings.forEach(function(h, i) {
        if (!h.id) h.id = 'toc-heading-' + i;
        var level = parseInt(h.tagName.charAt(1));
        tocItems.push({id: h.id, text: h.textContent.trim(), level: level});
    });

    // 计算最小层级，用于缩进基准
    var minLevel = Math.min.apply(null, tocItems.map(function(t) { return t.level; }));

    // 生成目录链接
    var html = '';
    tocItems.forEach(function(item) {
        var indent = (item.level - minLevel) * 12;
        var cls = indent === 0 ? 'fw-medium' : 'text-body-secondary';
        html += '<a href="#' + item.id + '" class="nav-link py-1 text-truncate ' + cls + '" style="padding-left:' + (8 + indent) + 'px;max-width:100%;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + item.text.replace(/"/g, '&quot;') + '">' + item.text + '</a>';
    });

    navEl.innerHTML = html;
    tocEl.classList.remove('d-none');
    if (sidebarNav) sidebarNav.classList.add('d-none');

    // 点击目录项平滑滚动
    navEl.addEventListener('click', function(e) {
        var link = e.target.closest('a[href^="#toc-heading-"]');
        if (!link) return;
        e.preventDefault();
        var target = document.getElementById(link.getAttribute('href').substring(1));
        if (target) {
            target.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
        // 高亮当前目录项
        navEl.querySelectorAll('.nav-link').forEach(function(a) { a.classList.remove('active'); });
        link.classList.add('active');
    });

    // 滚动时高亮当前目录项
    // ponytail: 只调整目录容器的 scrollTop，禁止用 scrollIntoView —— 后者会连带滚动 window，
    // 当文章很长、目录项超出容器可见区时会把页面"弹回"，已知 ceiling: 无平滑动画降级。
    var tocBody = navEl.parentElement;
    function scrollActiveTocItemIntoView(link) {
        if (!tocBody || !link) return;
        var containerRect = tocBody.getBoundingClientRect();
        var linkRect = link.getBoundingClientRect();
        if (linkRect.top < containerRect.top) {
            tocBody.scrollTop -= (containerRect.top - linkRect.top);
        } else if (linkRect.bottom > containerRect.bottom) {
            tocBody.scrollTop += (linkRect.bottom - containerRect.bottom);
        }
    }

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                navEl.querySelectorAll('.nav-link').forEach(function(a) { a.classList.remove('active'); });
                var activeLink = navEl.querySelector('a[href="#' + entry.target.id + '"]');
                if (activeLink) {
                    activeLink.classList.add('active');
                    scrollActiveTocItemIntoView(activeLink);
                }
            }
        });
    }, {rootMargin: '-80px 0px -70% 0px'});

    headings.forEach(function(h) { observer.observe(h); });
})();
</script>

<script>
// ===== 长文章折叠：首楼正文超过 2 屏时自动折叠 =====
(function() {
    var FOLD_HEIGHT = window.innerHeight * 2; // 折叠阈值：2 屏高度
    var EXPAND_TEXT = '<?php echo addslashes(lang('expand_full_text'));?>';
    var COLLAPSE_TEXT = '<?php echo addslashes(lang('collapse_text'));?>';

    function foldLongContent(content) {
        if (!content || content.dataset.foldInit === '1') return;
        content.dataset.foldInit = '1';

        function tryFold() {
            if (content.dataset.foldApplied === '1') return;
            // ponytail: 用 scrollHeight 测量实际内容高度；图片未加载时高度不准，故等待 img load
            if (content.scrollHeight <= FOLD_HEIGHT) return;
            content.dataset.foldApplied = '1';
            content.dataset.folded = '1';

            content.style.maxHeight = FOLD_HEIGHT + 'px';
            content.style.overflow = 'hidden';
            content.style.position = 'relative';

            // 渐变遮罩 + 展开/收起按钮
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:absolute;bottom:0;left:0;right:0;height:140px;background:linear-gradient(to bottom, transparent, var(--bs-body-bg, #fff) 75%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;z-index:5;pointer-events:none';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-sm btn-outline-primary rounded-pill';
            btn.style.pointerEvents = 'auto';
            btn.innerHTML = '<i class="ti ti-chevron-down me-1"></i>' + EXPAND_TEXT;

            btn.addEventListener('click', function() {
                if (content.dataset.expanded === '1') {
                    // 收起
                    content.style.maxHeight = FOLD_HEIGHT + 'px';
                    content.style.overflow = 'hidden';
                    overlay.style.display = 'flex';
                    btn.innerHTML = '<i class="ti ti-chevron-down me-1"></i>' + EXPAND_TEXT;
                    content.dataset.expanded = '0';
                    // 收起后若内容顶部在视口上方，滚回到内容顶部
                    var rect = content.getBoundingClientRect();
                    if (rect.top < 0) {
                        window.scrollTo({top: window.pageYOffset + rect.top - 80, behavior: 'smooth'});
                    }
                } else {
                    // 展开
                    content.style.maxHeight = '';
                    content.style.overflow = '';
                    overlay.style.display = 'none';
                    btn.innerHTML = '<i class="ti ti-chevron-up me-1"></i>' + COLLAPSE_TEXT;
                    content.dataset.expanded = '1';
                }
            });

            overlay.appendChild(btn);
            content.appendChild(overlay);
        }

        // 等待图片加载后测量高度
        var imgs = content.querySelectorAll('img');
        if (imgs.length === 0) {
            tryFold();
        } else {
            var loaded = 0;
            var total = imgs.length;
            function checkLoaded() {
                loaded++;
                if (loaded >= total) tryFold();
            }
            imgs.forEach(function(img) {
                if (img.complete) {
                    checkLoaded();
                } else {
                    img.addEventListener('load', checkLoaded);
                    img.addEventListener('error', checkLoaded);
                }
            });
            // 兜底：3 秒后强制测量（图片加载慢或卡住时）
            setTimeout(tryFold, 3000);
        }
    }

    var firstContent = document.querySelector('.message[isfirst="1"]');
    if (firstContent) {
        foldLongContent(firstContent);
    }

    // htmx 局部刷新后重新初始化
    document.body.addEventListener('htmx:after:swap', function(e) {
        var target = e.detail && e.detail.target;
        if (!target) return;
        var fc = target.querySelector('.message[isfirst="1"]');
        if (fc) foldLongContent(fc);
    });
})();
</script>

<script>
// ===== 手机端postbar快速回复逻辑 =====
(function() {
    var postbarMsg = document.getElementById('postbar-message');
    var postbarSubmit = document.getElementById('postbar-submit');
    var postbarQuoteBar = document.getElementById('postbar-quote-bar');
    var postbarQuoteUser = document.getElementById('postbar-quote-username');
    var postbarQuoteContent = document.getElementById('postbar-quote-content');
    var postbarQuoteClose = document.getElementById('postbar-quote-close');
    var quickForm = document.getElementById('quick_reply_form');
    var quickMsg = document.getElementById('message');
    var quickQuotepid = quickForm ? quickForm.querySelector('input[name="quotepid"]') : null;
    var csrfInput = quickForm ? quickForm.querySelector('input[name="csrf_token"]') : null;
    var postbarQuotepid = 0;
    var postbarSubmitting = false;  // 防抖标志位

    if (!postbarMsg || !postbarSubmit) return;

    // 验证码元素
    var postbarCaptchaRow = document.getElementById('postbar-captcha-row');
    var postbarCaptchaInput = document.getElementById('captcha-input-postbar');
    var postbarCaptchaImg = document.getElementById('captcha-img-postbar');
    var postbarNeedCaptcha = !!postbarCaptchaRow;

    // postbar 验证码刷新：请求 reply scene 但手动设置 postbar 图片
    function postbarCaptchaRefresh() {
        var url;
        if (typeof bbs_captcha_url_template !== 'undefined' && bbs_captcha_url_template) {
            url = bbs_captcha_url_template.replace('__SCENE__', 'reply');
        } else if (typeof url_rewrite_on !== 'undefined' && url_rewrite_on == 1) {
            url = 'captcha-generate-reply.htm';
        } else if (typeof url_rewrite_on !== 'undefined' && url_rewrite_on == 3) {
            url = 'captcha/generate/reply';
        } else if (typeof url_rewrite_on !== 'undefined' && url_rewrite_on == 4) {
            url = 'captcha-generate-reply.html';
        } else {
            url = '?captcha-generate-reply.htm';
        }
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function(r) { return r.ok ? r.text() : null; })
            .then(function(text) {
                if (!text) return;
                try {
                    var res = JSON.parse(text);
                    if (res.code === 0 && res.data && res.data.image && postbarCaptchaImg) {
                        postbarCaptchaImg.src = res.data.image;
                        postbarCaptchaImg.style.display = '';
                    }
                } catch(e) {}
            })
            .catch(function() {});
    }

    // textarea 聚焦时展开验证码行
    if (postbarNeedCaptcha && postbarCaptchaRow) {
        postbarMsg.addEventListener('focus', function() {
            if (postbarCaptchaRow.classList.contains('d-none')) {
                postbarCaptchaRow.classList.remove('d-none');
                postbarCaptchaRefresh();
            }
        });
        // 点击验证码图片刷新
        if (postbarCaptchaImg) {
            postbarCaptchaImg.addEventListener('click', function() {
                postbarCaptchaRefresh();
            });
        }
    }

    // 发送回复
    function sendReply() {
        // 防抖：正在提交中直接拦截（disabled 属性可能因事件队列时序未及时生效）
        if (postbarSubmitting) return;
        var msg = postbarMsg.value.trim();
        if (!msg) {
            XN.toast('请输入回复内容', 'danger');
            return;
        }
        // 验证码检查
        if (postbarNeedCaptcha && postbarCaptchaInput) {
            var captchaVal = postbarCaptchaInput.value.trim();
            if (!captchaVal) {
                // 展开验证码行并聚焦
                if (postbarCaptchaRow) postbarCaptchaRow.classList.remove('d-none');
                postbarCaptchaRefresh();
                postbarCaptchaInput.focus();
                XN.toast('请输入验证码', 'danger');
                return;
            }
        }
        // 用htmx.ajax发送
        var submitUrl = quickForm ? quickForm.getAttribute('hx-post') : '';
        if (!submitUrl) return;
        // 所有验证通过，设置防抖标志位 + 禁用按钮
        postbarSubmitting = true;
        // 构造表单数据
        var formData = new FormData();
        if (csrfInput) formData.append('csrf_token', csrfInput.value);
        formData.append('doctype', '1');
        formData.append('quotepid', postbarQuotepid);
        formData.append('message', msg);
        if (postbarNeedCaptcha && postbarCaptchaInput) {
            formData.append('captcha', postbarCaptchaInput.value.trim());
        }
        // 禁用按钮
        postbarSubmit.disabled = true;
        postbarMsg.disabled = true;
        var originalHtml = postbarSubmit.innerHTML;
        postbarSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        fetch(submitUrl, {
            method: 'POST',
            body: formData,
            headers: {'X-Requested-With': 'XMLHttpRequest', 'HX-Request': 'true', 'HX-Target': '#postlist'}
        }).then(function(res) {
            return res.text();
        }).then(function(html) {
            // 尝试解析JSON响应（错误消息等）
            try {
                var json = JSON.parse(html);
                if (parseInt(json.code) === 0) {
                    postbarMsg.value = '';
                    postbarQuotepid = 0;
                    if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
                    XN.toast(json.message || '回复成功', 'success');
                    // 刷新评论列表
                    if (typeof htmx !== 'undefined') {
                        htmx.trigger('#postlist', 'refresh');
                    }
                } else {
                    XN.toast(json.message || '回复失败', 'danger');
                }
                return;
            } catch(e) {
                // HTML片段响应：后端返回了评论HTML + OOB更新
                var tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;

                // 检查是否有错误提示（alert-danger）
                var errorEl = tempDiv.querySelector('.alert-danger');
                if (errorEl) {
                    XN.toast(errorEl.textContent.trim(), 'danger');
                    return;
                }

                // 检查是否有待审提示（alert-warning）
                var warnEl = tempDiv.querySelector('.alert-warning');
                if (warnEl) {
                    postbarMsg.value = '';
                    postbarQuotepid = 0;
                    if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
                    XN.toast(warnEl.textContent.trim(), 'success');
                    return;
                }

                // 成功：提取评论HTML和OOB更新
                var postlist = document.getElementById('postlist');
                // 提取主内容（非OOB的元素）
                var mainNodes = [];
                var oobNodes = [];
                tempDiv.childNodes.forEach(function(node) {
                    if (node.nodeType !== 1) return;
                    if (node.hasAttribute && node.hasAttribute('hx-swap-oob')) {
                        oobNodes.push(node);
                    } else {
                        mainNodes.push(node);
                    }
                });

                // 移除"暂无回复"占位符
                if (postlist) {
                    var emptyEl = postlist.querySelector('.postlist-empty');
                    if (emptyEl) emptyEl.remove();
                    // 追加新评论到列表末尾
                    mainNodes.forEach(function(node) {
                        postlist.appendChild(node);
                    });
                    // 滚动到新评论
                    postlist.lastElementChild.scrollIntoView({behavior: 'smooth', block: 'center'});
                }

                // 处理OOB更新（评论数、楼层、积分提示）
                oobNodes.forEach(function(node) {
                    var id = node.id;
                    if (!id) return;
                    var target = document.getElementById(id);
                    if (target && node.hasAttribute('hx-swap-oob')) {
                        target.textContent = node.textContent;
                    }
                    // 积分变动提示
                    if (id === 'credits-toast') {
                        var desc = node.getAttribute('data-change-desc');
                        if (desc && typeof XN !== 'undefined' && XN.toast) {
                            XN.toast(desc, 'info');
                        }
                    }
                });

                postbarMsg.value = '';
                postbarQuotepid = 0;
                if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
            }
        }).catch(function(err) {
            XN.toast('网络错误，请重试', 'danger');
        }).finally(function() {
            postbarSubmitting = false;
            postbarSubmit.disabled = false;
            postbarMsg.disabled = false;
            postbarSubmit.innerHTML = originalHtml;
            // 刷新验证码
            if (postbarNeedCaptcha) {
                if (postbarCaptchaInput) postbarCaptchaInput.value = '';
                postbarCaptchaRefresh();
            }
        });
    }

    // 发送按钮点击
    postbarSubmit.addEventListener('click', sendReply);
    // 回车发送
    postbarMsg.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendReply();
        }
    });

    // 取消引用
    if (postbarQuoteClose) {
        postbarQuoteClose.addEventListener('click', function() {
            postbarQuotepid = 0;
            if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
        });
    }

    // 监听评论列表的回复按钮点击，同步到postbar引用条
    var postlist = document.getElementById('postlist');
    if (postlist) {
        postlist.addEventListener('click', function(e) {
            var btn = e.target.closest('.post_reply');
            if (!btn) return;
            var pid = btn.getAttribute('data-pid');
            var username = btn.getAttribute('data-username');
            var content = btn.getAttribute('data-content');
            // 设置postbar引用
            postbarQuotepid = pid;
            if (postbarQuoteUser) postbarQuoteUser.textContent = username + '：';
            if (postbarQuoteContent) postbarQuoteContent.textContent = content;
            if (postbarQuoteBar) postbarQuoteBar.classList.remove('d-none');
            // 聚焦输入框
            postbarMsg.focus();
            // 滚动到postbar
            window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        });
    }

    // 同步quick_reply_form的引用条关闭到postbar
    var quickQuoteClose = document.getElementById('reply-quote-close');
    if (quickQuoteClose) {
        quickQuoteClose.addEventListener('click', function() {
            postbarQuotepid = 0;
            if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
        });
    }
})();
</script>
