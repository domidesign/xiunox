<script>
    (function () {
        // 代码高亮：highlight.js 11.x 内部用 data-highlighted="yes" 标记，重复调用自动跳过
        function doHighlight(container) {
            if (typeof hljs === 'undefined') return;
            (container || document).querySelectorAll('pre code:not([data-highlighted])').forEach(function (el) {
                hljs.highlightElement(el);
            });
        }

        // 主题切换：正文 .message 同步 aie-theme-dark class
        function syncThemeClass() {
            var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            document.querySelectorAll('div.message.aie-content').forEach(function (el) {
                el.classList.toggle('aie-theme-dark', isDark);
            });
        }

        // 首次加载
        doHighlight(document);
        syncThemeClass();

        // 监听主题属性变化
        new MutationObserver(syncThemeClass).observe(
            document.documentElement,
            { attributes: true, attributeFilter: ['data-bs-theme'] }
        );

        // htmx 局部刷新后：高亮 + 同步主题
        document.addEventListener('htmx:afterSwap', function (evt) {
            doHighlight(evt.target);
            syncThemeClass();
        });
    })();
</script>

        var jmessagelist = $('div.message');
        var first_width = jmessagelist.width();
        jmessagelist.each(function () {
            var jdiv = $(this);
            var maxwidth = jdiv.attr('isfirst') ? first_width : jdiv.width();
            var jmessage_width = Math.min(jdiv.width(), maxwidth);
            jdiv.find('img, embed, iframe, video').each(function () {

                var img_width = this.org_width;
                var img_height = this.org_height;
                if (!img_width) {
                    var img_width = jimg.attr('width');
                    var img_height = jimg.attr('height');
                    this.org_width = img_width;
                    this.org_height = img_height;
                }
                if (img_width > jmessage_width) {
                    if (this.tagName == 'IMG') {
                        jimg.width(jmessage_width);
                        jimg.css('height', 'auto');
                        jimg.css('cursor', 'pointer');
                    } else {
                        jimg.width(jmessage_width);

<!-- 评论排序：localStorage 记忆用户选择 -->
<script>
(function() {
    var sortGroup = document.getElementById('post-sort-group');
    if(!sortGroup) return;
    var currentSort = '<?php echo $sort;?>';
    var STORAGE_KEY = 'thread_post_sort';

    // 记忆当前排序
    try { localStorage.setItem(STORAGE_KEY, currentSort); } catch(e) {}

    // 点击排序按钮时记忆选择（链接会跳转，无需手动处理）
    sortGroup.querySelectorAll('a[data-sort]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var s = this.getAttribute('data-sort');
            try { localStorage.setItem(STORAGE_KEY, s); } catch(e) {}
        });
    });

    // 如果 URL 中没有 sort 参数但有 localStorage 记忆，自动跳转
    var urlParams = new URLSearchParams(window.location.search);
    if(!urlParams.has('sort')) {
        var saved = '';
        try { saved = localStorage.getItem(STORAGE_KEY) || ''; } catch(e) {}
        if(saved && saved !== 'asc' && saved !== currentSort) {
            var newUrl = window.location.pathname + '?sort=' + saved;
            window.location.href = newUrl;
        }
    }
})();
</script>

<!-- 快速回复：成功时清空表单，失败时保留内容 -->
<script>
(function() {
    var form = document.getElementById('quick_reply_form');
    if (!form) return;

    var replyBtn = document.getElementById('submit');
    var replyOriginalText = replyBtn ? replyBtn.textContent.trim() : '';
    window.resetReplySubmit = function() {
        if (replyBtn) {
            replyBtn.disabled = false;
            if (replyOriginalText) replyBtn.textContent = replyOriginalText;
        }
    };

    // htmx 校验通过、即将发送请求时才禁用按钮
    form.addEventListener('htmx:beforeRequest', function(e) {
        if (replyBtn) {
            replyBtn.disabled = true;
            var loadingText = replyBtn.getAttribute('data-loading-text');
            if (loadingText) replyBtn.textContent = loadingText;
        }
    });

    // htmx 请求完成后恢复按钮
    form.addEventListener('htmx:afterRequest', function(event) {
        window.resetReplySubmit();
        if (event.detail && event.detail.xhr) {
            var xhr = event.detail.xhr;
            try {
                var resp = JSON.parse(xhr.responseText);
                if (parseInt(resp.code) === 0) {
                    // 成功：清空表单
                    form.reset();
                    // 隐藏引用条
                    var quoteBar = document.getElementById('reply-quote-bar');
                    if(quoteBar) quoteBar.classList.add('d-none');
                    // 积分变动提示
                    if(resp.data && resp.data.change_desc && typeof XN !== 'undefined' && XN.toast) {
                        XN.toast(resp.data.change_desc, 'info');
                    }
                } else {
                    // 失败：保留输入，显示错误
                    var msgEl = document.getElementById('reply-msg');
                    if (msgEl) {
                        msgEl.innerHTML = '<div class="alert alert-warning py-1 small">' + (resp.message || '<?php echo lang('operation_failed');?>') + '</div>';
                    }
                }
            } catch(e) {
                // 非 JSON 响应（可能是 HTML 片段），视为成功
                form.reset();
                var quoteBar2 = document.getElementById('reply-quote-bar');
                if(quoteBar2) quoteBar2.classList.add('d-none');
            }
        }
    });

    // 兜底：htmx 请求出错（网络错误等）时恢复按钮
    form.addEventListener('htmx:responseError', function(e) {
        window.resetReplySubmit();
    });
    form.addEventListener('htmx:sendError', function(e) {
        window.resetReplySubmit();
    });
})();
</script>

<script>
var threadFid = <?php echo intval($fid);?>;
(function() {
    var fid = threadFid;

    document.body.addEventListener('htmx:confirm', function(e) {
        var el = e.target;
        if (!el || !el.classList) return;
        // 仅处理带 hx-confirm 属性的元素（htmx 4 中该事件对所有请求触发）
        if (!el.hasAttribute('hx-confirm')) return;

        var eventName = null;
        if (el.classList.contains('thread-like-btn') || el.classList.contains('thread-like-btn-mobile') || el.classList.contains('post-like-btn')) {
            // 根据 hx-post 的 URL 判断是点赞还是取消点赞
            var hxPost = el.getAttribute('hx-post') || '';
            eventName = hxPost.indexOf('/thread-unlike-') !== -1 ? 'unlike' : 'like';
        } else if (el.classList.contains('thread-favorite-btn') || el.classList.contains('thread-favorite-btn-mobile')) {
            // 判断是收藏还是取消收藏：检查图标是否为已收藏状态
            var favIcon = el.querySelector('i.ti-star-filled');
            eventName = favIcon ? 'unfavorite' : 'favorite';
        } else if (el.id === 'quick_reply_form' || (el.closest && el.closest('#quick_reply_form'))) {
            eventName = 'reply_post';
        }
        if (!eventName) return;

        e.preventDefault();
        // 保存 issueRequest/dropRequest 引用，避免异步回调中 e.detail 失效
        var issueRequest = e.detail.issueRequest;
        var dropRequest = e.detail.dropRequest;
        XN.confirmCreditsDeduct(eventName, fid, function() {
            if (issueRequest) issueRequest();
        }, { onCancel: function() {
            if (dropRequest) dropRequest();
            if (window.resetReplySubmit) window.resetReplySubmit();
        }});
    });
})();

<!-- 帖子目录：从正文标题自动生成 -->
<script>
(function() {
    var content = document.querySelector('.message[isfirst="1"]');
    if (!content) return;

    var headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length < 2) return; // 少于2个标题不显示目录

    var tocEl = document.getElementById('thread-toc');
    var navEl = document.getElementById('thread-toc-nav');
    var sidebarNav = document.getElementById('thread-sidebar-nav');
    if (!tocEl || !navEl) return;

    // 为每个标题添加 id（如果没有的话）
    var tocItems = [];
    headings.forEach(function(h, i) {
        if (!h.id) h.id = 'toc-heading-' + i;
        var level = parseInt(h.tagName.charAt(1));
        tocItems.push({id: h.id, text: h.textContent.trim(), level: level});
    });

    // 计算最小层级，用于缩进基准
    var minLevel = Math.min.apply(null, tocItems.map(function(t) { return t.level; }));

    // 生成目录链接
    var html = '';
    tocItems.forEach(function(item) {
        var indent = (item.level - minLevel) * 12;
        var cls = indent === 0 ? 'fw-medium' : 'text-body-secondary';
        html += '<a href="#' + item.id + '" class="nav-link py-1 text-truncate ' + cls + '" style="padding-left:' + (8 + indent) + 'px;max-width:100%;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + item.text.replace(/"/g, '&quot;') + '">' + item.text + '</a>';
    });

    navEl.innerHTML = html;
    tocEl.classList.remove('d-none');
    if (sidebarNav) sidebarNav.classList.add('d-none');

    // 点击目录项平滑滚动
    navEl.addEventListener('click', function(e) {
        var link = e.target.closest('a[href^="#toc-heading-"]');
        if (!link) return;
        e.preventDefault();
        var target = document.getElementById(link.getAttribute('href').substring(1));
        if (target) {
            target.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
        // 高亮当前目录项
        navEl.querySelectorAll('.nav-link').forEach(function(a) { a.classList.remove('active'); });
        link.classList.add('active');
    });

    // 滚动时高亮当前目录项
    var tocBody = navEl.parentElement;
    function scrollActiveTocItemIntoView(link) {
        if (!tocBody || !link) return;
        var containerRect = tocBody.getBoundingClientRect();
        var linkRect = link.getBoundingClientRect();
        if (linkRect.top < containerRect.top || linkRect.bottom > containerRect.bottom) {
            link.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        }
    }

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                navEl.querySelectorAll('.nav-link').forEach(function(a) { a.classList.remove('active'); });
                var activeLink = navEl.querySelector('a[href="#' + entry.target.id + '"]');
                if (activeLink) {
                    activeLink.classList.add('active');
                    scrollActiveTocItemIntoView(activeLink);
                }
            }
        });
    }, {rootMargin: '-80px 0px -70% 0px'});

    headings.forEach(function(h) { observer.observe(h); });
})();
</script>

<script>
// ===== 手机端postbar快速回复逻辑 =====
(function() {
    var postbarMsg = document.getElementById('postbar-message');
    var postbarSubmit = document.getElementById('postbar-submit');
    var postbarQuoteBar = document.getElementById('postbar-quote-bar');
    var postbarQuoteUser = document.getElementById('postbar-quote-username');
    var postbarQuoteContent = document.getElementById('postbar-quote-content');
    var postbarQuoteClose = document.getElementById('postbar-quote-close');
    var quickForm = document.getElementById('quick_reply_form');
    var quickMsg = document.getElementById('message');
    var quickQuotepid = quickForm ? quickForm.querySelector('input[name="quotepid"]') : null;
    var csrfInput = quickForm ? quickForm.querySelector('input[name="csrf_token"]') : null;
    var postbarQuotepid = 0;

    if (!postbarMsg || !postbarSubmit) return;

    // 发送回复
    function sendReply() {
        var msg = postbarMsg.value.trim();
        if (!msg) {
            XN.toast('请输入回复内容', 'danger');
            return;
        }
        // 检查是否有验证码（如果quick_reply_form中有验证码输入框且可见）
        var captchaInput = quickForm ? quickForm.querySelector('#captcha-reply') : null;
        if (captchaInput && captchaInput.offsetParent !== null) {
            // 需要验证码：显示quick_reply_form并同步数据
            if (quickForm) quickForm.classList.remove('d-none');
            if (quickMsg) quickMsg.value = msg;
            if (quickQuotepid) quickQuotepid.value = postbarQuotepid;
            XN.toast('需要验证码，请在此输入', 'info');
            quickForm.scrollIntoView({behavior:'smooth', block:'center'});
            if (quickMsg) quickMsg.focus();
            return;
        }
        // 用htmx.ajax发送
        var submitUrl = quickForm ? quickForm.getAttribute('hx-post') : '';
        if (!submitUrl) return;
        // 构造表单数据
        var formData = new FormData();
        if (csrfInput) formData.append('csrf_token', csrfInput.value);
        formData.append('doctype', '1');
        formData.append('quotepid', postbarQuotepid);
        formData.append('message', msg);
        // 禁用按钮
        postbarSubmit.disabled = true;
        postbarMsg.disabled = true;
        var originalHtml = postbarSubmit.innerHTML;
        postbarSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

        fetch(submitUrl, {
            method: 'POST',
            body: formData,
            headers: {'X-Requested-With': 'XMLHttpRequest', 'HX-Request': 'true'}
        }).then(function(res) {
            return res.text();
        }).then(function(html) {
            // 尝试解析JSON响应
            try {
                var json = JSON.parse(html);
                if (parseInt(json.code) === 0) {
                    // 成功：清空输入框和引用条
                    postbarMsg.value = '';
                    postbarQuotepid = 0;
                    if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
                    XN.toast(json.message || '回复成功', 'success');
                    // 刷新评论列表
                    if (typeof htmx !== 'undefined') {
                        htmx.trigger('#postlist', 'refresh');
                    }
                    // 如果有待审提示
                    if (json.message && json.message.indexOf('审核') >= 0) {
                        // 不刷新页面
                    }
                } else {
                    XN.toast(json.message || '回复失败', 'danger');
                }
            } catch(e) {
                // HTML响应：可能是错误页面或成功后的重定向
                XN.toast('回复已提交', 'success');
                postbarMsg.value = '';
                postbarQuotepid = 0;
                if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
                // 刷新页面以显示新回复
                setTimeout(function() { window.location.reload(); }, 1000);
            }
        }).catch(function(err) {
            XN.toast('网络错误，请重试', 'danger');
        }).finally(function() {
            postbarSubmit.disabled = false;
            postbarMsg.disabled = false;
            postbarSubmit.innerHTML = originalHtml;
        });
    }

    // 发送按钮点击
    postbarSubmit.addEventListener('click', sendReply);
    // 回车发送
    postbarMsg.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendReply();
        }
    });

    // 取消引用
    if (postbarQuoteClose) {
        postbarQuoteClose.addEventListener('click', function() {
            postbarQuotepid = 0;
            if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
        });
    }

    // 监听评论列表的回复按钮点击，同步到postbar引用条
    var postlist = document.getElementById('postlist');
    if (postlist) {
        postlist.addEventListener('click', function(e) {
            var btn = e.target.closest('.post_reply');
            if (!btn) return;
            var pid = btn.getAttribute('data-pid');
            var username = btn.getAttribute('data-username');
            var content = btn.getAttribute('data-content');
            // 设置postbar引用
            postbarQuotepid = pid;
            if (postbarQuoteUser) postbarQuoteUser.textContent = username + '：';
            if (postbarQuoteContent) postbarQuoteContent.textContent = content;
            if (postbarQuoteBar) postbarQuoteBar.classList.remove('d-none');
            // 聚焦输入框
            postbarMsg.focus();
            // 滚动到postbar
            window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        });
    }

    // 同步quick_reply_form的引用条关闭到postbar
    var quickQuoteClose = document.getElementById('reply-quote-close');
    if (quickQuoteClose) {
        quickQuoteClose.addEventListener('click', function() {
            postbarQuotepid = 0;
            if (postbarQuoteBar) postbarQuoteBar.classList.add('d-none');
        });
    }
})();
</script>
