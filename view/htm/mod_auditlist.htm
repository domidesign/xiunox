<script>
(function() {
	var csrfToken = '';
	var meta = document.querySelector('meta[name="csrf-token"]');
	if(meta) csrfToken = meta.getAttribute('content');
	var auditUrl = <?php echo json_encode(mod_audit_url());?>;
	var auditPostUrl = <?php echo json_encode(mod_audit_post_url());?>;

	function postForm(url, data) {
		return fetch(url, {
			method: 'POST',
			headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
			body: data
		}).then(function(r) {
			return r.text().then(function(txt) {
				var json;
				try { json = JSON.parse(txt); } catch(e) { throw new Error('Non-JSON: ' + txt.substring(0, 120)); }
				if(parseInt(json.code) !== 0) throw new Error(json.message || 'error');
				return json;
			});
		});
	}

	function auditDone() {
		window.location.reload();
	}

	function auditFail(e) {
		if(typeof showToast === 'function') showToast(e.message || '<?php echo lang('operation_failed');?>', 'danger');
	}

	function setBtnsDisabled(list, disabled) {
		list.querySelectorAll('.audit-act-btn').forEach(function(b) { b.disabled = disabled; });
	}

	// 单条操作：主题走 mod-audit（tidarr），回帖走 mod-audit_post（pid）
	document.addEventListener('click', function(e) {
		var btn = e.target.closest('.audit-act-btn');
		if(!btn) return;
		var row = btn.closest('[data-tid], [data-pid]');
		if(!row) return;
		var status = btn.getAttribute('data-status');
		var data;
		var url;
		if(row.getAttribute('data-tid')) {
			url = auditUrl;
			data = 'tidarr[]=' + row.getAttribute('data-tid') + '&audit_status=' + status;
		} else {
			url = auditPostUrl;
			data = 'pid=' + row.getAttribute('data-pid') + '&audit_status=' + status;
		}
		setBtnsDisabled(row, true);
		postForm(url, data + '&csrf_token=' + encodeURIComponent(csrfToken)).then(auditDone).catch(function(e) {
			setBtnsDisabled(row, false);
			auditFail(e);
		});
	});
})();
</script>
