<script>
var jform = $('#protection-form');
var jsubmit = jform.find('button[type="submit"]');
jform.on('submit', function() {
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ window.location.reload(); }, 1000);
		} else if(xn.is_number(code)) {
			showToast(message, 'error');
			jsubmit.button('reset');
		} else {
			jform.find('[name="'+code+'"]').alert(message).focus();
			jsubmit.button('reset');
		}
	});
	return false;
});

// 预设域名按钮交互
document.querySelectorAll('.domain-preset-btn').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var domain = this.getAttribute('data-domain');
		var input = document.querySelector('input[name="security_allowed_email_domains"]');
		var current = input.value ? input.value.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s; }) : [];
		var idx = current.indexOf(domain);
		if(idx > -1) {
			current.splice(idx, 1);
			this.classList.remove('btn-primary');
			this.classList.add('btn-outline-secondary');
		} else {
			current.push(domain);
			this.classList.remove('btn-outline-secondary');
			this.classList.add('btn-primary');
		}
		input.value = current.join(',');
	});
});
</script>
