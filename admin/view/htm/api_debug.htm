<script>
var latestTokens = <?php echo json_encode($tokens ?: []);?>;
var lastResponse = '';

(function() {
	var params = new URLSearchParams(window.location.search);
	var m = params.get('method');
	var e = params.get('endpoint');
	var b = params.get('body');
	var at = params.get('authtoken');
	var ap = params.get('appid');
	if (m) document.getElementById('apiMethod').value = m;
	if (e) document.getElementById('apiEndpoint').value = e;
	if (b) document.getElementById('apiBody').value = JSON.stringify(JSON.parse(b), null, 2);
	if (at && latestTokens.length > 0) {
		// 优先取 access token 用于 API 鉴权
		var at0 = latestTokens.find(function(t) { return (t.type || '') === 'access'; }) || latestTokens[0];
		document.getElementById('apiToken').value = at0.token;
	}
	// ponytail: URL 参数 appid 自动选中下拉框（与 authtoken 同样的预填模式）
	if (ap) {
		var sel = document.getElementById('apiAppId');
		for (var i = 0; i < sel.options.length; i++) {
			if (sel.options[i].value === ap) { sel.selectedIndex = i; break; }
		}
	}
	updateBodyVisibility();
	loadHistory();
})();

function setEndpoint(method, endpoint) {
	document.getElementById('apiMethod').value = method;
	document.getElementById('apiEndpoint').value = endpoint;
	document.getElementById('apiBody').value = '';
	updateBodyVisibility();
}

function updateBodyVisibility() {
	var m = document.getElementById('apiMethod').value;
	document.getElementById('apiBodyGroup').style.display = (m === 'POST' || m === 'PUT') ? 'block' : 'none';
}

function fillOrGenerateToken() {
	// ponytail: DB 中 token 字段是 SHA-256 hash，无法反查明文；
	// 明文 token 只在 generateTokens() 返回时出现一次，所以每次都生成新 token
	var csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
	var btn = document.getElementById('fillTokenBtn');
	btn.disabled = true;
	btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span><?php echo lang('api_debug_generating');?>';
	$.xpost('<?php echo admin_api_debug_url();?>', {op: 'generate_token', uid: 1, csrf_token: csrfToken}, function(code, message) {
		if(code == 0) {
			// generateTokens() 返回 {access_token, refresh_token, expires_in, user}
			document.getElementById('apiToken').value = message.access_token;
			btn.innerHTML = '<i class="ti ti-key"></i><?php echo lang('api_debug_fill_token');?>';
			btn.disabled = false;
			showToast('<?php echo lang('api_debug_token_generated');?>', 'success');
		} else {
			showToast(message, 'error');
			btn.innerHTML = '<i class="ti ti-key"></i><?php echo lang('api_debug_fill_token');?>';
			btn.disabled = false;
		}
	});
}

function formatBody() {
	var el = document.getElementById('apiBody');
	if (!el.value.trim()) return;
	try {
		el.value = JSON.stringify(JSON.parse(el.value), null, 2);
	} catch(e) {
		showToast('<?php echo lang('api_debug_json_error');?>', 'error');
	}
}

function sendApiRequest() {
	var method = document.getElementById('apiMethod').value;
	var endpoint = document.getElementById('apiEndpoint').value;
	var token = document.getElementById('apiToken').value;
	var appId = document.getElementById('apiAppId').value;
	var appSecret = document.getElementById('apiAppSecret').value;
	var body = document.getElementById('apiBody').value;

	// ponytail: bootstrap.php 中间件强制要求 X-App-Id，缺失返回 401
	if(!appId) {
		showToast('<?php echo lang('api_debug_select_app_required');?>', 'error');
		return;
	}

	var url = '../api/v1/' + endpoint;
	var startTime = performance.now();
	var btn = document.getElementById('sendBtn');
	btn.disabled = true;

	var ajaxOpts = {
		url: url,
		type: method,
		dataType: 'text',
		beforeSend: function(xhr) {
			xhr.setRequestHeader('X-App-Id', appId);
			if(appSecret) xhr.setRequestHeader('X-App-Secret', appSecret);
			if(token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
		},
		complete: function() {
			btn.disabled = false;
		},
		success: function(res) {
			var duration = Math.round(performance.now() - startTime);
			var data;
			try { data = JSON.parse(res); } catch(e) { data = res; }
			showResponse(200, data, duration);
			addHistory(method, endpoint, 200, duration);
		},
		error: function(xhr) {
			var duration = Math.round(performance.now() - startTime);
			try {
				showResponse(xhr.status, JSON.parse(xhr.responseText), duration);
			} catch(e) {
				showResponse(xhr.status, {error: xhr.statusText}, duration);
			}
			addHistory(method, endpoint, xhr.status, duration);
		}
	};

	if(method === 'POST' || method === 'PUT') {
		if(body) {
			try {
				ajaxOpts.data = JSON.parse(body);
			} catch(e) {
				showToast('<?php echo lang('api_debug_json_error');?>', 'error');
				btn.disabled = false;
				return;
			}
		}
	} else {
		ajaxOpts.data = {};
	}

	$.ajax(ajaxOpts);
}

function syntaxHighlight(json) {
	if (typeof json !== 'string') {
		json = JSON.stringify(json, null, 2);
	}
	json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
		var cls = 'json-number';
		if (/^"/.test(match)) {
			if (/:$/.test(match)) {
				cls = 'json-key';
			} else {
				cls = 'json-string';
			}
		} else if (/true|false/.test(match)) {
			cls = 'json-bool';
		} else if (/null/.test(match)) {
			cls = 'json-null';
		}
		return '<span class="' + cls + '">' + match + '</span>';
	});
}

function showResponse(code, data, duration) {
	var statusEl = document.getElementById('apiStatusCode');
	statusEl.textContent = code;
	statusEl.className = 'badge ' + (code >= 200 && code < 300 ? 'bg-success' : 'bg-danger');

	var durationEl = document.getElementById('apiDuration');
	durationEl.textContent = duration ? duration + ' ms' : '';

	var resEl = document.getElementById('apiResponse');
	lastResponse = JSON.stringify(data, null, 2);
	resEl.innerHTML = '<pre class="mb-0 fs-6">' + syntaxHighlight(data) + '</pre>';
}

function copyResponse() {
	if (!lastResponse) return;
	navigator.clipboard.writeText(lastResponse).then(function() {
		showToast('<?php echo lang('api_debug_copied_response');?>', 'info');
	});
}

function copyText(text) {
	if (!text) return;
	navigator.clipboard.writeText(text).then(function() {
		showToast('<?php echo lang('api_debug_copied');?>', 'info');
	});
}

function addHistory(method, endpoint, statusCode, duration) {
	var history = JSON.parse(localStorage.getItem('api_debug_history') || '[]');
	history.unshift({
		method: method,
		endpoint: endpoint,
		status: statusCode,
		duration: duration,
		time: new Date().toLocaleTimeString()
	});
	if (history.length > 20) history = history.slice(0, 20);
	localStorage.setItem('api_debug_history', JSON.stringify(history));
	renderHistory();
}

function loadHistory() {
	renderHistory();
}

function renderHistory() {
	var history = JSON.parse(localStorage.getItem('api_debug_history') || '[]');
	var container = document.getElementById('historyList');
	if (history.length === 0) {
		container.innerHTML = '<p class="text-secondary fs-6 p-2 mb-0"><?php echo lang('api_debug_no_history');?></p>';
		return;
	}
	var html = '';
	history.forEach(function(item, idx) {
		var statusClass = item.status >= 200 && item.status < 300 ? 'bg-success' : 'bg-danger';
		html += '<div class="debug-history-item" onclick="loadFromHistory(' + idx + ')">';
		html += '<span class="method-badge method-' + item.method + ' hist-method">' + item.method + '</span>';
		html += '<span class="hist-path">' + item.endpoint + '</span>';
		html += '<span class="badge ' + statusClass + '" style="font-size:0.6rem">' + item.status + '</span>';
		html += '<span class="hist-meta">' + item.duration + 'ms</span>';
		html += '</div>';
	});
	container.innerHTML = html;
}

function loadFromHistory(idx) {
	var history = JSON.parse(localStorage.getItem('api_debug_history') || '[]');
	var item = history[idx];
	if (!item) return;
	document.getElementById('apiMethod').value = item.method;
	document.getElementById('apiEndpoint').value = item.endpoint;
	updateBodyVisibility();
}

function clearHistory() {
	localStorage.removeItem('api_debug_history');
	renderHistory();
}

function revokeToken(tokenId, uid) {
	XN.confirm('<?php echo lang("api_debug_confirm_revoke");?> UID=' + uid + '？', function() {
	var csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
	// ponytail: 后端 revoke_token_by_id op 按 refresh token 主键 id 删除整对 access+refresh
	$.xpost('<?php echo admin_api_debug_url();?>', {op: 'revoke_token_by_id', id: tokenId, csrf_token: csrfToken}, function(code, message) {
		if(code == 0) {
			showToast('<?php echo lang("api_debug_token_revoked");?>', 'success');
			setTimeout(function(){ location.reload(); }, 1000);
		} else {
			showToast(message, 'error');
		}
	});
	});
}

document.getElementById('apiMethod').addEventListener('change', updateBodyVisibility);
</script>
