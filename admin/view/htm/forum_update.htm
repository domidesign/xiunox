<script>

var jform = $("#form");
var jsubmit = $("#submit");
jform.on('submit', function(){
	jsubmit.prop('disabled', true).text('<?php echo lang('admin_submitting')?>');
	var postdata = new FormData(this);
	$.ajax({
		url: jform.attr('action'),
		type: 'POST',
		data: postdata,
		processData: false,
		contentType: false,
		success: function(r) {
			if(r.code == 0) {
				showToast(r.message, 'success');
				setTimeout(function() { window.location = xn.url('forum-list'); }, 1500);
			} else {
				showToast(r.message, 'error');
				jsubmit.prop('disabled', false).text('<?php echo lang('confirm');?>');
			}
		}
	});
	return false;
});

var jfup_row = $('#fup_row');
var jmoduids_row = $('#moduids_row');
var jtype = jform.find('select[name="type"]');
function toggleFupRow() {
	if(jtype.val() == 1) {
		jfup_row.hide();
	} else {
		jfup_row.show();
	}
}
function toggleModRow() {
	if(jtype.val() == '1') { jmoduids_row.hide(); } else { jmoduids_row.show(); }
}
jtype.on('change', function() {
	toggleFupRow();
	toggleModRow();
});
toggleFupRow();
toggleModRow();

var jaccesslist = $('#accesslist_div');
jaccesslist.find('tr').each(function(k, v) {
	var jtr = $(v);
	jtr.find('td').eq(0).find('input[type="checkbox"]').on('click', function() {
		jtr.find('input[type="checkbox"]').prop('checked', $(this).prop('checked'));
	});
});

// 图标文件预览
$('#icon_input').on('change', function() {
	var file = this.files[0];
	if(file) {
		var reader = new FileReader();
		reader.onload = function(e) {
			$('#icon_preview').html('<img src="'+e.target.result+'" style="max-width:56px;max-height:56px" class="rounded" />');
		};
		reader.readAsDataURL(file);
	}
});
</script>
