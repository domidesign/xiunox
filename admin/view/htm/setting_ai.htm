<script>
var jform = $('#form');
var jsubmit = $('#submit');
var aiPresets = {
    openai: {endpoint:'https://api.openai.com', model:'gpt-4o-mini'},
    deepseek: {endpoint:'https://api.deepseek.com', model:'deepseek-chat'},
    gitee: {endpoint:'https://ai.gitee.com/v1', model:'DeepSeek-V3'},
    spark: {endpoint:'https://spark-api-open.xf-yun.com/v1', model:'generalv3.5'},
    wenxin: {endpoint:'https://qianfan.baidubce.com/v2', model:'ernie-4.0-8k'},
    custom: {endpoint:'', model:''}
};
$('#ai_provider').on('change', function(){
    var p = aiPresets[$(this).val()];
    if(p) {
        $('#ai_endpoint').val(p.endpoint);
        $('#ai_model').val(p.model);
    }
});
jform.on('submit', function() {
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			jsubmit.text(message).delay(1000).button('reset');
		} else if(xn.is_number(code)) {
			showToast(message, 'error');
			jsubmit.button('reset');
		} else {
			jform.find('[name="'+code+'"]').alert(message).focus();
			jsubmit.button('reset');
		}
	});
	return false;
});
</script>
