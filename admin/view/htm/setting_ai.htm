<?php include _include(ADMIN_PATH.'view/htm/footer.inc.htm');?>

<script>
(function() {
	// AI 提供商数据
	var providers = <?php echo xn_json_encode($ai_providers);?>;

	function escapeAttr(s) {
		return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	}

	function createProviderRow(item) {
		var tr = document.createElement('tr');
		var nameVal = item.name || '';
		var urlVal = item.url || '';

		tr.innerHTML =
			'<td><input type="text" class="form-control form-control-sm" name="ai_provider_name[]" value="' + escapeAttr(nameVal) + '" placeholder="<?php echo lang('admin_ai_provider_placeholder'); ?>"></td>' +
			'<td><input type="text" class="form-control form-control-sm" name="ai_provider_url[]" value="' + escapeAttr(urlVal) + '" placeholder="https://api.openai.com"></td>' +
			'<td class="text-center"><a role="button" class="text-danger delete-provider" title="<?php echo lang('delete')?>"><i class="ti ti-trash"></i></a></td>';

		// 删除
		var deleteBtn = tr.querySelector('.delete-provider');
		deleteBtn.addEventListener('click', function(e) {
			e.preventDefault();
			tr.remove();
		});

		return tr;
	}

	function renderProviders(items) {
		var tbody = document.getElementById('aiProvidersBody');
		tbody.innerHTML = '';
		items.forEach(function(item) {
			tbody.appendChild(createProviderRow(item));
		});
	}

	renderProviders(providers);

	document.getElementById('addProvider').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('aiProvidersBody').appendChild(createProviderRow({}));
	});

	// 表单提交
	var form = document.getElementById('aiForm');
	var submitBtn = document.getElementById('submitBtn');
	form.addEventListener('submit', function(e) {
		e.preventDefault();

		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			body: formData,
			headers: {
				'X-Requested-With': 'XMLHttpRequest'
			}
		})
		.then(function(res) { return res.json(); })
		.then(function(data) {
			if (parseInt(data.code) === 0) {
				showToast(data.message, 'success');
				submitBtn.innerHTML = '<i class="ti ti-check me-1"></i>' + data.message;
				submitBtn.classList.remove('btn-primary');
				submitBtn.classList.add('btn-success');
				setTimeout(function() {
					submitBtn.disabled = false;
					submitBtn.innerHTML = '<?php echo lang('confirm');?>';
					submitBtn.classList.remove('btn-success');
					submitBtn.classList.add('btn-primary');
				}, 1500);
			} else {
				showToast(data.message, 'error');
				submitBtn.disabled = false;
				submitBtn.innerHTML = '<?php echo lang('confirm');?>';
			}
		})
		.catch(function(err) {
			showToast('<?php echo lang('admin_request_failed_retry')?>', 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<?php echo lang('confirm');?>';
		});
	});
})();
</script>

<!--{hook admin_setting_ai_js.htm}-->
