<script>
// ponytail: 原生 JS 改造，移除对 $/XN. 的依赖
var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
function xpost(url, data, callback) {
	var body = data;
	var headers = {'X-Requested-With': 'XMLHttpRequest', 'X-CSRF-Token': csrfToken};
	if (typeof data === 'object' && !(data instanceof FormData)) {
		var params = new URLSearchParams();
		for (var k in data) { if (Object.prototype.hasOwnProperty.call(data, k)) params.append(k, data[k]); }
		body = params.toString();
	}
	if (typeof body === 'string') headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
	fetch(url, {method: 'POST', headers: headers, body: body, credentials: 'same-origin'})
		.then(function(r) { return r.json(); })
		.then(function(json) { callback(json.code, json.message); })
		.catch(function(err) { callback(-1, err.message || 'Request failed'); });
}
function fieldError(el, message) {
	if (!el) return;
	var parent = el.closest('.form-group');
	if (parent) parent.classList.add('has-danger');
	el.classList.add('form-control-danger');
	el.setAttribute('title', message);
	var tip = el.nextElementSibling;
	if (tip && tip.classList.contains('xn-field-tip')) {
		tip.textContent = message;
		tip.style.display = '';
	} else {
		tip = document.createElement('span');
		tip.className = 'xn-field-tip text-danger small';
		tip.textContent = message;
		el.parentNode.insertBefore(tip, el.nextSibling);
	}
	el.focus();
}
// 清空内容表单：原生 confirm
(function(){
	var f = document.getElementById('form-clear-content');
	if (f) {
		f.addEventListener('submit', function(e) {
			e.preventDefault();
			XN.confirm('<?php echo lang('user_clear_content_confirm');?>', function() {
				HTMLFormElement.prototype.submit.call(f);
			}, {type: 'danger'});
		});
	}
})();
var form = document.getElementById('form');
var submitBtn = document.getElementById('submit');
var langCreditsReasonRequired = <?php echo json_encode(lang('admin_credits_reason_required'));?>;
form.addEventListener('submit', function(e) {
	// ponytail: 显式 preventDefault 双保险，避免 AJAX + 原生 POST 两次请求（积分双倍 bug 根因）
	e.preventDefault();
	setBtnLoading(submitBtn, true);
	// 积分调整时必须填写理由
	var hasCreditsChange = false;
	['credits', 'golds', 'rmbs'].forEach(function(k) {
		var actEl = form.querySelector('[name="'+k+'_action"]');
		var amtEl = form.querySelector('[name="'+k+'_amount"]');
		var act = parseInt(actEl ? actEl.value : '', 10) || 0;
		var amt = parseInt(amtEl ? amtEl.value : '', 10) || 0;
		if(act !== 0 && amt > 0) hasCreditsChange = true;
	});
	var reasonEl = form.querySelector('[name="credits_reason"]');
	if(hasCreditsChange && !(reasonEl && reasonEl.value.trim())) {
		showToast(langCreditsReasonRequired, 'error');
		if (reasonEl) {
			reasonEl.classList.add('is-invalid');
			reasonEl.focus();
		}
		setBtnLoading(submitBtn, false);
		return;
	}
	if (reasonEl) reasonEl.classList.remove('is-invalid');
	var postdata = new URLSearchParams(new FormData(form)).toString();
	xpost(form.getAttribute('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ window.location.reload(); }, 1000);
		} else if(xn.is_number(code)) {
			showToast(message, 'error');
			setBtnLoading(submitBtn, false);
		} else {
			showToast(message, 'error');
			fieldError(form.querySelector('[name="'+code+'"]'), message);
			setBtnLoading(submitBtn, false);
		}
	});
});
</script>

<!--{hook admin_user_update_js.htm}-->
