<script>
// 清空内容表单：confirm 改为 XN.confirm Bootstrap Modal
(function(){
	var f = document.getElementById('form-clear-content');
	if (f) {
		f.addEventListener('submit', function(e) {
			e.preventDefault();
			XN.confirm('<?php echo lang('user_clear_content_confirm');?>', function() {
				HTMLFormElement.prototype.submit.call(f);
			});
		});
	}
})();
var jform = $('#form');
var jsubmit = $('#submit');
var langCreditsReasonRequired = <?php echo json_encode(lang('admin_credits_reason_required'));?>;
jform.on('submit', function(e) {
	// ponytail: jQuery shim 的 on() 底层是 addEventListener，return false 不会阻止默认提交，
	// 必须显式 preventDefault，否则表单会同时发起 AJAX + 原生 POST 两次请求（积分双倍 bug 根因）
	e.preventDefault();
	setBtnLoading(jsubmit, true);
	// 积分调整时必须填写理由
	var hasCreditsChange = false;
	['credits', 'golds', 'rmbs'].forEach(function(k) {
		var act = parseInt(jform.find('[name="'+k+'_action"]').val(), 10) || 0;
		var amt = parseInt(jform.find('[name="'+k+'_amount"]').val(), 10) || 0;
		if(act !== 0 && amt > 0) hasCreditsChange = true;
	});
	if(hasCreditsChange && !jform.find('[name="credits_reason"]').val().trim()) {
		showToast(langCreditsReasonRequired, 'error');
		jform.find('[name="credits_reason"]').addClass('is-invalid').focus();
		setBtnLoading(jsubmit, false);
		return false;
	}
	jform.find('[name="credits_reason"]').removeClass('is-invalid');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ window.location.reload(); }, 1000);
		} else if(xn.is_number(code)) {
			showToast(message, 'error');
			setBtnLoading(jsubmit, false);
		} else {
			showToast(message, 'error');
			jform.find('[name="'+code+'"]').fieldError(message).focus();
			setBtnLoading(jsubmit, false);
		}
	});
	return false;
});
</script>

<!--{hook admin_user_update_js.htm}-->
