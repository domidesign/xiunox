<script>
// ponytail: 后台登录页是关键修复页面，必须独立于 xiuno-modern.js
// （旧版本站点可能没有 xiuno-modern.js，导致 $ is not defined 死循环，连登录都进不去），全程使用原生 JS

// 独立实现 showToast，不依赖 xiuno-modern.js 的 showToast/XN.toast
function showToast(message, type) {
	var container = document.getElementById('toast-container');
	if (!container) { alert(message); return; }
	var toastEl = document.createElement('div');
	toastEl.className = 'toast show align-items-center text-white bg-' + (type === 'success' ? 'success' : (type === 'error' ? 'danger' : 'secondary'));
	toastEl.setAttribute('role', 'alert');
	toastEl.style.minWidth = '200px';
	toastEl.style.boxShadow = '0 8px 24px rgba(0,0,0,0.15)';
	toastEl.style.borderRadius = '0.5rem';
	var body = document.createElement('div');
	body.className = 'd-flex';
	var inner = document.createElement('div');
	inner.className = 'toast-body';
	inner.textContent = message;
	body.appendChild(inner);
	var btn = document.createElement('button');
	btn.type = 'button';
	btn.className = 'btn-close btn-close-white me-2 m-auto';
	btn.setAttribute('data-bs-dismiss', 'toast');
	btn.onclick = function() { toastEl.remove(); };
	body.appendChild(btn);
	toastEl.appendChild(body);
	container.appendChild(toastEl);
	setTimeout(function() { if (toastEl.parentNode) toastEl.remove(); }, 4000);
}

// Flash toast：读取 PRG 重定向时设置的 flash cookie（如令牌失效提示），显示后清除
(function() {
	function getCookie(name) {
		var value = "; " + document.cookie;
		var parts = value.split("; " + name + "=");
		if (parts.length == 2) return parts.pop().split(";").shift();
		return '';
	}
	function deleteCookie(name) {
		document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
	}
	var flashMsg = getCookie('flash_msg');
	var flashType = getCookie('flash_type') || 'error';
	if (flashMsg) {
		try { flashMsg = decodeURIComponent(flashMsg); } catch(e) {}
		deleteCookie('flash_msg');
		deleteCookie('flash_type');
		showToast(flashMsg, flashType);
	}
})();

function buildQuery(data) {
	var parts = [];
	for (var k in data) {
		if (Object.prototype.hasOwnProperty.call(data, k)) {
			parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(data[k]));
		}
	}
	return parts.join('&');
}

function ajax(opts) {
	var url = opts.url;
	var type = (opts.type || 'GET').toUpperCase();
	var data = opts.data || null;
	var dataType = opts.dataType || 'json';

	var fetchOpts = {
		method: type,
		headers: {
			'X-Requested-With': 'XMLHttpRequest'
		},
		credentials: 'same-origin'
	};

	if (type === 'POST' && data) {
		if (data instanceof FormData) {
			fetchOpts.body = data;
		} else {
			fetchOpts.headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
			fetchOpts.body = typeof data === 'object' ? buildQuery(data) : data;
		}
	} else if (data && !(data instanceof FormData)) {
		var sep = url.indexOf('?') === -1 ? '?' : '&';
		url += sep + buildQuery(data);
	}

	fetch(url, fetchOpts).then(function(response) {
		return response.text().then(function(text) {
			var xhrLike = { status: response.status, responseText: text };
			if (!response.ok) throw xhrLike;
			if (dataType === 'json') {
				try { return JSON.parse(text); }
				catch (e) { throw xhrLike; }
			}
			return text;
		});
	}).then(function(res) {
		if (opts.success) opts.success(res);
	}).catch(function(err) {
		var xhr = err && err.responseText !== undefined ? err : { responseText: (err && err.message) ? err.message : String(err || '') };
		if (opts.error) opts.error(xhr);
	});
}

var jform = document.getElementById('form');
var jsubmit = document.getElementById('submit');
var jsubmitText = document.getElementById('submitText');
var jpassword = document.getElementById('password');
if (jpassword) jpassword.focus();

// 验证码过期自动刷新定时器（原生 JS 实现，替代 XN.captchaScheduleExpire）
function captchaScheduleExpire(imgEl, expires_in, refreshFn) {
	if (!imgEl || !expires_in) return;
	if (imgEl._captchaExpireTimer) {
		clearTimeout(imgEl._captchaExpireTimer);
		imgEl._captchaExpireTimer = null;
	}
	imgEl._captchaExpireTimer = setTimeout(function() {
		imgEl._captchaExpireTimer = null;
		if (refreshFn) refreshFn();
	}, expires_in * 1000);
}

// 验证码刷新
function adminCaptchaRefresh() {
	var img = document.getElementById('captcha-img');
	if(!img) return;
	ajax({
		url: '<?php echo admin_login_url();?>?captcha_refresh=1',
		type: 'GET',
		dataType: 'text',
		success: function(r) {
			var s;
			try { s = JSON.parse(r); } catch(e) { s = null; }
			if(s && s.code == 0 && s.image) {
				img.src = s.image;
				// 启动过期定时器
				captchaScheduleExpire(img, s.expires_in || 600, adminCaptchaRefresh);
			}
		}
	});
}

// 初次页面加载（PHP 已输出 captcha_image）时启动过期定时器
(function() {
	var img = document.getElementById('captcha-img');
	if (img && <?php echo intval($captcha_expires_in);?> > 0) {
		captchaScheduleExpire(img, <?php echo intval($captcha_expires_in);?>, adminCaptchaRefresh);
	}
})();

// 账号锁定倒计时
function startCountdown(seconds) {
	var btn = document.getElementById('submit');
	if(!btn) return;
	btn.disabled = true;
	var updateBtn = function() {
		if(seconds > 0) {
			if (jsubmitText) jsubmitText.textContent = '<?php echo lang('submiting');?>... ' + seconds + 's';
			seconds--;
			setTimeout(updateBtn, 1000);
		} else {
			btn.disabled = false;
			if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>';
		}
	};
	updateBtn();
}

// 密码可见性切换
(function() {
	var toggle = document.getElementById('passwordToggle');
	if (toggle) {
		toggle.addEventListener('click', function() {
			var input = document.getElementById('password');
			if (!input) return;
			var show = input.type === 'password';
			input.type = show ? 'text' : 'password';
			var eye = document.getElementById('passwordEye');
			var eyeOff = document.getElementById('passwordEyeOff');
			if (eye) eye.classList.toggle('d-none', show);
			if (eyeOff) eyeOff.classList.toggle('d-none', !show);
		});
	}
})();

// 主题切换（明亮/暗黑）
(function() {
	var btn = document.getElementById('themeToggleBtn');
	if (!btn) return;
	var iconLight = document.getElementById('loginThemeIconLight');
	var iconDark = document.getElementById('loginThemeIconDark');
	function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
	function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
	var darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
	var stored = safeGet('theme') || 'auto';
	function apply(mode) {
		var effective = mode;
		if (mode === 'auto') effective = darkMQ.matches ? 'dark' : 'light';
		document.documentElement.setAttribute('data-bs-theme', effective);
		var isDark = effective === 'dark';
		if (iconLight) iconLight.classList.toggle('d-none', isDark);
		if (iconDark) iconDark.classList.toggle('d-none', !isDark);
	}
	var cycle = function() {
		var modes = ['auto', 'light', 'dark'];
		var cur = modes.indexOf(safeGet('theme') || 'auto');
		var next = modes[(cur + 1) % modes.length];
		safeSet('theme', next);
		apply(next);
	};
	btn.addEventListener('click', cycle);
	apply(stored);
})();

jform.addEventListener('submit', function(e) {
	e.preventDefault();
	jsubmit.disabled = true;
	if (jsubmitText) jsubmitText.textContent = '<?php echo lang('submiting');?>...';
	var postdata = new FormData(jform);
	// 用 ajax 获取完整响应（含 wait 字段用于倒计时）
	ajax({
		type: 'POST',
		url: jform.getAttribute('action'),
		data: postdata,
		dataType: 'text',
		success: function(r) {
			if(!r) { showToast('Server Response Empty!', 'error'); jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>'; return; }
			var s;
			try { s = JSON.parse(r); } catch(e) { s = null; }
			if(!s || s.code === undefined) { showToast('Server Response Not JSON', 'error'); jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>'; return; }
			var code = s.code;
			var message = s.message;
			if(code == 0) {
				showToast(message, 'success');
				var redirect = (s.redirect_url && s.redirect_url != '') ? s.redirect_url : './';
				setTimeout(function() { window.location.assign(redirect); }, 1000);
			} else if(code == -1003) {
				// 账号锁定，启动倒计时
				showToast(message, 'error');
				var wait = parseInt(s.wait) || 0;
				if(wait > 0) { startCountdown(wait); }
				else { jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>'; }
			} else if(code == 'password' || code == 'captcha') {
				showToast(message, 'error');
				if(code == 'captcha') { adminCaptchaRefresh(); }
				else { if (jpassword) jpassword.focus(); }
				jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>';
			} else {
				showToast(message, 'error');
				jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>';
			}
		},
		error: function() {
			showToast('Network error', 'error');
			jsubmit.disabled = false; if (jsubmitText) jsubmitText.textContent = '<?php echo lang('login');?>';
		}
	});
});

</script>
