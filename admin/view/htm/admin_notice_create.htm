<script src="../view/js/tabler-icon-picker.js<?php echo $static_version;?>"></script>
<script>

var navItem = document.querySelector('#nav li.nav-item-notice');
if(navItem) navItem.classList.add('active');

// 初始化图标选择器
var iconInput = document.getElementById('announcement-icon');
var iconPreview = document.querySelector('#tab-send-announcement .icon-preview');
if(iconInput && iconPreview) {
    new TablerIconPicker({
        input: iconInput,
        preview: iconPreview
    });
}

// 发送通知表单提交
var sendNoticeForm = document.getElementById('sendNoticeForm');
if(sendNoticeForm) {
    sendNoticeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var formData = new FormData(sendNoticeForm);
        fetch('<?php echo admin_notice_create_url();?>', {
            method: 'POST',
            body: formData,
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        }).then(function(r) { return r.json(); }).then(function(data) {
            if(parseInt(data.code) === 0) {
                showToast(data.message || '<?php echo lang('admin_send_success');?>', 'success');
                sendNoticeForm.reset();
            } else {
                showToast(data.message || '<?php echo lang('admin_send_failed');?>', 'error');
            }
        }).catch(function() {
            showToast('<?php echo lang('admin_request_failed');?>', 'error');
        });
    });
}

// 发布公告表单提交
var announceForm = document.getElementById('announcementForm');
if(announceForm) {
    announceForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var formData = new FormData(announceForm);
        fetch('<?php echo admin_notice_publish_url();?>', {
            method: 'POST',
            body: formData,
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        }).then(function(r) { return r.json(); }).then(function(data) {
            if(parseInt(data.code) === 0) {
                showToast(data.message || '<?php echo lang('admin_publish_success');?>', 'success');
                announceForm.reset();
                // 重置图标预览
                var preview = document.querySelector('#tab-send-announcement .icon-preview');
                if(preview) preview.innerHTML = '<i class="ti ti-speakerphone"></i>';
                var iconInp = document.getElementById('announcement-icon');
                if(iconInp) iconInp.value = 'ti-speakerphone';
            } else {
                showToast(data.message || '<?php echo lang('admin_publish_failed');?>', 'error');
            }
        }).catch(function() {
            showToast('<?php echo lang('admin_request_failed');?>', 'error');
        });
    });
}

</script>
