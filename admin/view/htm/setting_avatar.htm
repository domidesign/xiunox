<!-- 后台 header.inc.htm 未全局加载 htmx,此处引入(同步加载,确保 submit 时 htmx 已就绪) -->
<script src="../view/vendor/htmx/htmx.min.js<?php echo $static_version;?>"></script>

<script>
(function() {
	var form = document.getElementById('avatarForm');
	var submitBtn = document.getElementById('submitBtn');
	var resultDiv = document.getElementById('avatar_setting_result');
	var timeoutTimer = null;
	var errorToastShown = false;

	// 若 htmx 后于本脚本加载,手动触发扫描确保 hx-* 属性绑定生效
	if (typeof htmx !== 'undefined' && htmx.process) {
		htmx.process(form);
	}

	// 选项卡片点击选中 + 切换高亮
	var optionCards = document.querySelectorAll('.avatar-shape-option');
	optionCards.forEach(function(card) {
		card.addEventListener('click', function() {
			var radio = card.querySelector('input[type="radio"]');
			if (radio) radio.checked = true;
			optionCards.forEach(function(c) { c.classList.remove('border-primary', 'bg-primary-subtle'); });
			card.classList.add('border-primary', 'bg-primary-subtle');
		});
	});

	function resetSubmit() {
		if (timeoutTimer) { clearTimeout(timeoutTimer); timeoutTimer = null; }
		submitBtn.disabled = false;
		submitBtn.innerHTML = '<i class="ti ti-device-floppy me-1"></i><?php echo lang('confirm');?>';
	}

	// htmx 未加载兜底:阻止普通提交(防止跳转到 action URL 显示 message.htm)
	form.addEventListener('submit', function(e) {
		if (typeof htmx === 'undefined') {
			e.preventDefault();
			if (typeof showToast === 'function') {
				showToast('<?php echo lang('network_request_failed');?>', 'error');
			}
			return false;
		}
	}, true); // 捕获阶段,确保先于 htmx 的 submit 处理

	// 超时兜底:30s 后中止请求
	form.addEventListener('htmx:before:request', function() {
		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';
		errorToastShown = false;
		timeoutTimer = setTimeout(function() {
			if (typeof htmx !== 'undefined') htmx.trigger(form, 'htmx:abort');
			if (!errorToastShown && typeof showToast === 'function') {
				showToast('<?php echo lang('request_timeout');?>', 'error');
				errorToastShown = true;
			}
			resetSubmit();
		}, 30000);
	});

	// 网络层错误(fetch reject,早于 after:request)
	form.addEventListener('htmx:response:error', function() {
		if (timeoutTimer) { clearTimeout(timeoutTimer); timeoutTimer = null; }
		if (!errorToastShown && typeof showToast === 'function') {
			showToast('<?php echo lang('network_error_retry');?>', 'error');
			errorToastShown = true;
		}
		resetSubmit();
	});

	// HTTP 4xx/5xx(用 ctx.response.status,禁止用 response.ok - htmx 4 中 ctx.response 无 .ok 属性)
	form.addEventListener('htmx:after:request', function(event) {
		if (timeoutTimer) { clearTimeout(timeoutTimer); timeoutTimer = null; }
		var ctx = event.detail && event.detail.ctx;
		if (ctx && ctx.response && ctx.response.status >= 400) {
			if (!errorToastShown && typeof showToast === 'function') {
				showToast('<?php echo lang('server_response_error');?>', 'error');
				errorToastShown = true;
			}
			resetSubmit();
		}
	});

	// swap 后处理:检查 data-code + 整页 HTML 检测(PHP fatal 返回整页)
	form.addEventListener('htmx:after:swap', function() {
		errorToastShown = false;
		// htmx 4 中 event.detail.target 不存在,直接用缓存的 resultDiv
		var html = resultDiv.innerHTML;
		// 检测整页 HTML(PHP fatal 时返回 <html>/<head>/<!doctype>)
		if (html.indexOf('<html') !== -1 || html.indexOf('<head') !== -1 || html.indexOf('<!doctype') !== -1 || html.indexOf('<!DOCTYPE') !== -1) {
			if (typeof showToast === 'function') showToast('<?php echo lang('server_response_error');?>', 'error');
			resultDiv.innerHTML = '';
			resetSubmit();
			return;
		}
		var codeEl = resultDiv.querySelector('[data-code]');
		if (!codeEl) {
			resetSubmit();
			return;
		}
		var code = parseInt(codeEl.getAttribute('data-code'), 10);
		if (code === 0) {
			// 成功:延迟重载以更新选中态(让用户看到提示)
			setTimeout(function() { window.location.reload(); }, 1500);
		} else {
			if (typeof showToast === 'function') {
				showToast(codeEl.textContent.trim(), 'error');
			}
			resetSubmit();
		}
	});
})();
</script>

<!--{hook admin_setting_avatar_js.htm}-->
