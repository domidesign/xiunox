<?php
// 根据操作类型确定表单提交地址与按钮样式
$confirm_url = '';
$confirm_btn_class = 'btn-primary';
$confirm_btn_icon = 'ti-check';
switch($confirm_action) {
	case 'install':
		$confirm_url = admin_plugin_install_url($confirm_dir);
		$confirm_btn_class = 'btn-primary';
		$confirm_btn_icon = 'ti-download';
		break;
	case 'unstall':
		$confirm_url = admin_plugin_unstall_url($confirm_dir);
		$confirm_btn_class = 'btn-danger';
		$confirm_btn_icon = 'ti-trash';
		break;
	case 'enable':
		$confirm_url = admin_plugin_enable_url($confirm_dir);
		$confirm_btn_class = 'btn-primary';
		$confirm_btn_icon = 'ti-player-play';
		break;
	case 'disable':
		$confirm_url = admin_plugin_disable_url($confirm_dir);
		$confirm_btn_class = 'btn-warning';
		$confirm_btn_icon = 'ti-player-pause';
		break;
}
?>

<div class="row justify-content-center">
	<div class="col-12 col-md-8 col-lg-6">

						</span>
					<?php elseif($confirm_action == 'disable'):?>
						<span class="avatar-text rounded-2 bg-warning bg-opacity-10 text-warning" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
							<i class="ti ti-alert-circle ti-lg"></i>
						</span>
					<?php else:?>
						<span class="avatar-text rounded-2 bg-primary bg-opacity-10 text-primary" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
							<i class="ti ti-info-circle ti-lg"></i>
						</span>
					<?php endif;?>
					<div class="flex-grow-1">
						<h5 class="mb-1"><?php echo esc_html($confirm_name);?></h5>

						</a>
						<button type="submit" class="btn <?php echo $confirm_btn_class;?> rounded-pill" id="pluginConfirmBtn">
							<i class="ti <?php echo $confirm_btn_icon;?> me-1"></i> <?php echo lang('confirm');?>
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

<script>
// 提交时禁用按钮防止重复提交
document.getElementById('pluginConfirmForm').addEventListener('submit', function() {
	var btn = document.getElementById('pluginConfirmBtn');
	btn.disabled = true;
	btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>...';
});
</script>
