<script>
// 插件市场搜索：JS 拦截 submit 构建 URL（保留路由参数 plugin-official.htm）
// 不能依赖 GET 表单默认提交：浏览器会用表单字段替换 action URL 中的 query string，
// 丢失 ?plugin-official.htm 中的路由信息 plugin-official.htm，导致 404。
function officialSearch() {
	var form = document.getElementById('officialSearchForm');
	if (!form) return;
	var base = '<?php echo url('plugin-official');?>';  // ?plugin-official.htm
	var fd = new FormData(form);
	var query = [];
	var free = fd.get('free');
	var keyword = (fd.get('keyword') || '').trim();
	if (free) query.push('free=' + encodeURIComponent(free));
	if (keyword) query.push('keyword=' + encodeURIComponent(keyword));
	// base 已包含 ?（如 ?plugin-official.htm），附加参数用 & 拼接
	window.location.href = base + (query.length ? '&' + query.join('&') : '');
}
(function() {
	var form = document.getElementById('officialSearchForm');
	if (!form) return;
	form.addEventListener('submit', function(e) {
		e.preventDefault();
		officialSearch();
	});
})();

// 图标 onerror 兜底（与 plugin_list.htm 实现一致，本视图独立定义避免依赖）
function handlePluginIconError(img) {
	var dir = img.getAttribute('data-dir') || '?';
	var letter = dir.charAt(0).toUpperCase();
	var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'
		+ '<rect fill="#ddd" width="64" height="64"/>'
		+ '<text x="32" y="38" text-anchor="middle" font-size="24" fill="#999">' + letter + '</text>'
		+ '</svg>';
	img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
	img.onerror = null;
}

// 安装/升级前确认弹窗（XN.confirm 基于 Bootstrap 5 Modal）
// 拦截表单 submit → 弹窗确认 → 通过后用原生 form.submit() 提交（不再触发 submit 事件）
(function() {
	var langInstallTitle = <?php echo json_encode(lang('plugin_marketplace_install_confirm_title'));?>;
	var langInstallBody  = <?php echo json_encode(lang('plugin_marketplace_install_confirm_body'));?>;
	var langInstallBtn   = <?php echo json_encode(lang('plugin_marketplace_install_confirm_btn'));?>;
	var langUpgradeTitle = <?php echo json_encode(lang('plugin_marketplace_upgrade_confirm_title'));?>;
	var langUpgradeBody  = <?php echo json_encode(lang('plugin_marketplace_upgrade_confirm_body'));?>;
	var langUpgradeBtn   = <?php echo json_encode(lang('plugin_marketplace_upgrade_confirm_btn'));?>;

	function bindConfirm(selector, title, bodyTpl, okText) {
		document.addEventListener('submit', function(e) {
			var form = e.target.closest(selector);
			if (!form || form.dataset.confirmed === '1') return;
			e.preventDefault();
			var name = form.getAttribute('data-name') || '';
			var version = form.getAttribute('data-version') || '';
			var body = bodyTpl.replace('{name}', name).replace('{version}', version);
			XN.confirm(body, function() {
				// 标记已确认，避免重复弹窗
				form.dataset.confirmed = '1';
				// 禁用提交按钮，避免重复提交
				var btn = form.querySelector('button[type="submit"]');
				if (btn) {
					btn.disabled = true;
					btn.classList.add('disabled');
				}
				// 原生 submit 不触发 submit 事件，直接提交
				HTMLFormElement.prototype.submit.call(form);
			}, {
				title: title,
				type: 'warning',
				okText: okText,
				cancelText: (typeof lang !== 'undefined' && lang.close) || '取消'
			});
		}, true); // 捕获阶段，确保最先拦截
	}

	bindConfirm('form.js-confirm-install', langInstallTitle, langInstallBody, langInstallBtn);
	bindConfirm('form.js-confirm-upgrade', langUpgradeTitle, langUpgradeBody, langUpgradeBtn);
})();
</script>
