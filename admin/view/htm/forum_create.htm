<script>
var jform = $("#form");
var jsubmit = $("#submit");

// 表单提交（含文件上传，使用 FormData）
jform.on('submit', function() {
	var postdata = new FormData(this);
	jsubmit.prop('disabled', true).text('<?php echo lang('admin_submitting')?>');
	$.ajax({
		url: jform.attr('action'),
		type: 'POST',
		data: postdata,
		processData: false,
		contentType: false,
		success: function(r) {
			if(r.code == 0) {
				showToast(r.message, 'success');
				setTimeout(function() { window.location = xn.url('forum-list'); }, 1500);
			} else {
				showToast(r.message, 'error');
				jsubmit.prop('disabled', false).text('<?php echo lang('admin_confirm_create')?>');
			}
		}
	});
	return false;
});

// 版块类型切换：分区时隐藏上级分区
var jtype = $('#type_select');
var jfup_row = $('#fup_row');
function toggleFupRow() {
	if(jtype.val() == '1') {
		jfup_row.hide();
	} else {
		jfup_row.show();
	}
}
jtype.on('change', toggleFupRow);
toggleFupRow();

// 图标上传预览
$('#icon_input').on('change', function() {
	var file = this.files[0];
	if(file) {
		var reader = new FileReader();
		reader.onload = function(e) {
			$('#icon_preview').html('<img src="'+e.target.result+'" style="max-width:56px;max-height:56px" class="rounded" />');
		};
		reader.readAsDataURL(file);
	}
});
</script>
