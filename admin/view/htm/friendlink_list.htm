<script>
(function() {
	var linkList = document.getElementById('link-list');
	var addBtn = document.getElementById('addBtn');

	// 添加新链接行
	addBtn.addEventListener('click', function() {
		var row = document.createElement('div');
		row.className = 'link-row d-flex align-items-center gap-2 mb-2 py-2 border-bottom';
		row.setAttribute('data-linkid', '0');
		row.innerHTML = '<input type="hidden" name="linkid[]" value="0">' +
			'<div class="flex-grow-1 d-flex align-items-center gap-2 flex-wrap">' +
			'<input type="text" name="name[]" value="" class="form-control form-control-sm" style="max-width:180px" placeholder="<?php echo lang('admin_site_name_placeholder');?>">' +
			'<input type="url" name="url[]" value="" class="form-control form-control-sm" style="max-width:260px" placeholder="https://">' +
			'<input type="text" name="favicon[]" value="" class="form-control form-control-sm" style="max-width:200px" placeholder="<?php echo lang('admin_favicon_url_placeholder');?>">' +
			'<input type="number" name="rank[]" value="0" class="form-control form-control-sm text-center" style="max-width:70px" placeholder="<?php echo lang('admin_sort_placeholder');?>">' +
			'</div>' +
			'<button type="button" class="btn btn-outline-danger btn-sm px-2 py-1 remove-link-btn" title="<?php echo lang('delete');?>"><i class="ti ti-trash"></i></button>';
		linkList.appendChild(row);
	});

	// 删除链接行
	linkList.addEventListener('click', function(e) {
		var btn = e.target.closest('.remove-link-btn');
		if (btn) {
			var row = btn.closest('.link-row');
			if (row) {
				row.remove();
			}
		}
	});

	// 表单提交：用 $.ajax 直接提交序列化数据，避免 $.xpost 的 $.unparam 丢失数组参数
	var jform = $('#form');
	var jsubmit = $('#submit');
	jform.on('submit', function() {
		jsubmit.button('loading');
		$.ajax({
			type: 'POST',
			url: jform.attr('action'),
			data: jform.serialize(),
			dataType: 'text',
			success: function(r) {
				if(!r) { showToast('Server Response Empty!', 'error'); jsubmit.button('reset'); return; }
				var s = xn.json_decode(r);
				if(s && s.code == 0) {
					showToast(s.message, 'success');
					jsubmit.button('reset');
					setTimeout(function() { window.location.reload(); }, 800);
				} else {
					showToast(s ? s.message : 'Error', 'error');
					jsubmit.button('reset');
				}
			},
			error: function() {
				showToast('Request failed', 'error');
				jsubmit.button('reset');
			}
		});
		return false;
	});
})();
</script>

<!--{hook admin_friendlink_list_js.htm}-->
