<script>
// HTML 转义
function escHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// 标签页切换
function switchBlacklistTab(section) {
    var ipSection = document.getElementById('section-ip');
    var emailSection = document.getElementById('section-email');
    var tabIp = document.getElementById('tab-ip');
    var tabEmail = document.getElementById('tab-email');
    if (section === 'ip') {
        ipSection.classList.remove('d-none');
        emailSection.classList.add('d-none');
        tabIp.classList.add('active');
        tabEmail.classList.remove('active');
    } else {
        emailSection.classList.remove('d-none');
        ipSection.classList.add('d-none');
        tabEmail.classList.add('active');
        tabIp.classList.remove('active');
    }
}

// 日期格式化
function formatDate(ts) {
    var d = new Date(ts * 1000);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// 更新 IP 黑名单 UI
function updateIpBlacklistUI() {
    var list = document.getElementById('ip-blacklist-list');
    var empty = document.getElementById('ip-blacklist-empty');
    var count = document.getElementById('ip-blacklist-count');
    var items = list.querySelectorAll('[data-ip]');
    count.textContent = items.length;
    if (items.length === 0) {
        list.style.display = 'none';
        empty.classList.remove('d-none');
    } else {
        list.style.display = '';
        empty.classList.add('d-none');
    }
}

// 添加 IP 黑名单
function addIpBlacklist() {
    var ipInput = document.getElementById('newBlackIp');
    var remarkInput = document.getElementById('newBlackRemark');
    var ip = ipInput.value.trim();
    if (!ip) return;
    XN.post('<?php echo admin_security_url('blacklist');?>/ip_blacklist_add', { ip: ip, remark: remarkInput.value }, function(code, message) {
        if (code == 0) {
            var list = document.getElementById('ip-blacklist-list');
            var item = document.createElement('div');
            item.className = 'list-group-item d-flex justify-content-between align-items-center px-0';
            item.setAttribute('data-ip', ip);
            var remarkHtml = remarkInput.value ? ' <span class="text-body-secondary ms-2">(' + escHtml(remarkInput.value) + ')</span>' : '';
            item.innerHTML = '<div><span class="fw-medium">' + escHtml(ip) + '</span>' + remarkHtml + '<br><small class="text-body-secondary">' + formatDate(Math.floor(Date.now()/1000)) + '</small></div><button type="button" class="btn btn-outline-danger btn-sm rounded-pill" onclick="removeIpBlacklist(this)"><i class="ti ti-trash me-1"></i><?php echo lang('delete')?></button>';
            list.appendChild(item);
            ipInput.value = '';
            remarkInput.value = '';
            updateIpBlacklistUI();
            showToast(message, 'success');
        } else {
            showToast(message, 'error');
        }
    });
}

// 删除 IP 黑名单
function removeIpBlacklist(btn) {
    var el = btn.closest('[data-ip]');
    var ip = el.getAttribute('data-ip');
    XN.confirm('<?php echo lang('admin_confirm_remove_ip_blacklist')?>' + ip + '？', function() {
    XN.post('<?php echo admin_security_url('blacklist');?>/ip_blacklist_remove', { ip: ip }, function(code, message) {
        if (code == 0) {
            el.remove();
            updateIpBlacklistUI();
            showToast(message, 'success');
        } else {
            showToast(message, 'error');
        }
    });
    }, {type: 'danger'});
}

// 添加域名

// 批量导入
function batchImport() {
    var textarea = document.getElementById('importText');
    var text = textarea.value.trim();
    if (!text) return;
    XN.post('<?php echo admin_security_url('blacklist');?>/email_import', { words_text: text }, function(code, message) {
        if (code == 0) {
            showToast(message, 'success');
            textarea.value = '';
            setTimeout(function(){ location.reload(); }, 1000);
        } else {
            showToast(message, 'error');
        }
    });
}

// 文件上传
function uploadBlacklistFile(event) {
    var file = event.target.files[0];
    if (!file) return;
    var formData = new FormData();
    formData.append('email_file', file);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '<?php echo admin_security_url('blacklist');?>/email_import_file', true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            try {
                var res = JSON.parse(xhr.responseText);
                if (parseInt(res.code) === 0) {
                    showToast(res.message, 'success');
                    setTimeout(function(){ location.reload(); }, 1000);
                } else {
                    showToast(res.message, 'error');
                }
            } catch(e) {
                showToast('<?php echo lang('upload_failed')?>', 'error');
            }
        }
    };
    xhr.send(formData);
}
