<script>
(function() {
	// 页脚链接数据
	var footerLinks = <?php echo xn_json_encode($footer_links);?>;

	// 创建链接行
	function createLinkRow(item) {
		var tr = document.createElement('tr');
		var nameVal = (item && item.name) || '';
		var urlVal = (item && item.url) || '';

		tr.innerHTML =
			'<td><input type="text" class="form-control form-control-sm" name="link_name[]" value="' + nameVal + '" placeholder="<?php echo lang('admin_link_name_placeholder');?>"></td>' +
			'<td><input type="text" class="form-control form-control-sm" name="link_url[]" value="' + urlVal + '" placeholder="https://"></td>' +
			'<td class="text-center"><a role="button" class="text-danger" title="<?php echo lang('delete');?>"><i class="ti ti-trash"></i></a></td>';

		tr.querySelector('a[title="<?php echo lang('delete');?>"]').addEventListener('click', function(e) {
			e.preventDefault();
			tr.remove();
		});

		return tr;
	}

	// 渲染已有链接
	var tbody = document.getElementById('linksBody');
	footerLinks.forEach(function(item) {
		tbody.appendChild(createLinkRow(item));
	});

	// 添加链接
	document.getElementById('addLink').addEventListener('click', function(e) {
		e.preventDefault();
		tbody.appendChild(createLinkRow({}));
	});

	// 表单提交
	var form = document.getElementById('footerForm');
	var submitBtn = document.getElementById('submitBtn');
	form.addEventListener('submit', function(e) {
		e.preventDefault();

		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('admin_saving');?>';

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			body: formData,
			headers: {
				'X-Requested-With': 'XMLHttpRequest'
			}
		})
		.then(function(res) { return res.json(); })
		.then(function(data) {
			if (parseInt(data.code) === 0) {
				showToast(data.message, 'success');
				submitBtn.innerHTML = '<i class="ti ti-check me-1"></i>' + data.message;
				submitBtn.classList.remove('btn-primary');
				submitBtn.classList.add('btn-success');
				setTimeout(function(){ window.location.reload(); }, 1000);
			} else {
				showToast(data.message, 'error');
				submitBtn.disabled = false;
				submitBtn.innerHTML = '<i class="ti ti-device-floppy me-1"></i><?php echo lang("confirm");?>';
			}
		})
		.catch(function(err) {
			showToast('<?php echo lang('admin_request_failed');?>', 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<i class="ti ti-device-floppy me-1"></i><?php echo lang("confirm");?>';
		});
	});
})();
</script>
