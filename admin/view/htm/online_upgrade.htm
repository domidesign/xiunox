<script>
var steps = <?php echo json_encode($steps);?>;
var currentStep = 0;
var isUpgrading = false;
var csrfToken = <?php echo json_encode($csrfToken);?>;

// ponytail: 在线升级页面是用户修复网站问题的"最后手段"，必须独立于 xiuno-modern.js
// （旧版本站点可能没有 xiuno-modern.js，导致 $ is not defined 死循环），全程使用原生 JS
function buildQuery(data) {
	var parts = [];
	for (var k in data) {
		if (Object.prototype.hasOwnProperty.call(data, k)) {
			parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(data[k]));
		}
	}
	return parts.join('&');
}

function ajax(opts) {
	var url = opts.url;
	var type = (opts.type || 'GET').toUpperCase();
	var data = opts.data || null;
	var dataType = opts.dataType || 'json';

	var fetchOpts = {
		method: type,
		headers: {
			'X-Requested-With': 'XMLHttpRequest',
			'X-CSRF-Token': csrfToken
		},
		credentials: 'same-origin'
	};

	if (type === 'POST' && data) {
		fetchOpts.headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
		fetchOpts.body = typeof data === 'object' ? buildQuery(data) : data;
	} else if (data) {
		var sep = url.indexOf('?') === -1 ? '?' : '&';
		url += sep + buildQuery(data);
	}

	fetch(url, fetchOpts).then(function(response) {
		return response.text().then(function(text) {
			var xhrLike = { status: response.status, responseText: text };
			if (!response.ok) throw xhrLike;
			if (dataType === 'json') {
				try { return JSON.parse(text); }
				catch (e) { throw xhrLike; }
			}
			return text;
		});
	}).then(function(res) {
		if (opts.success) opts.success(res);
	}).catch(function(err) {
		var xhr = err && err.responseText !== undefined ? err : { responseText: (err && err.message) ? err.message : String(err || '') };
		if (opts.error) opts.error(xhr);
	});
}

// 检查更新频率限制：24 小时一次（前端 localStorage 拦截，后端 cache 兜底）
var CHECK_LIMIT_KEY = 'xiunox_upgrade_check_manual';
var CHECK_LIMIT_TTL = 24 * 60 * 60 * 1000; // 24 小时（毫秒）

// XSS 防护：escapeHtml 用于将服务端返回的 res.message / xhr.responseText 安全地插入 DOM
function escapeHtml(s) {
	if (s === null || s === undefined) return '';
	return String(s).replace(/[&<>"']/g, function(c) {
		return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
	});
}

// 读取本地存储的下次可检查时间戳；返回 0 表示无限制记录
function getLocalNextCheckAt() {
	try {
		var raw = localStorage.getItem(CHECK_LIMIT_KEY);
		if (!raw) return 0;
		var obj = JSON.parse(raw);
		return obj && obj.next_check_at ? obj.next_check_at : 0;
	} catch(e) { return 0; }
}

// 写入下次可检查时间戳
function setLocalNextCheckAt(nextAt) {
	try { localStorage.setItem(CHECK_LIMIT_KEY, JSON.stringify({next_check_at: nextAt})); } catch(e) {}
}

// 将剩余毫秒格式化为「N 小时 M 分钟」
function formatRemaining(ms) {
	if (ms <= 0) return '';
	var totalMin = Math.ceil(ms / 60000);
	var h = Math.floor(totalMin / 60);
	var m = totalMin % 60;
	if (h > 0 && m > 0) return h + ' <?php echo lang('admin_online_upgrade_check_limited_hour');?> ' + m + ' <?php echo lang('admin_online_upgrade_check_limited_minute');?>';
	if (h > 0) return h + ' <?php echo lang('admin_online_upgrade_check_limited_hour');?>';
	return m + ' <?php echo lang('admin_online_upgrade_check_limited_minute');?>';
}

// disable 检查按钮并改文案，提示用户已被 24h 限制
function disableCheckBtnLimited(remainingMs) {
	var btn = document.getElementById('checkBtn');
	btn.disabled = true;
	var remain = formatRemaining(remainingMs);
	btn.innerHTML = '<i class="ti ti-clock-pause"></i><?php echo lang('admin_online_upgrade_check_limited_btn');?>' + (remain ? ' (' + remain + ')' : '');
}

// 根据本地 localStorage 限制状态刷新检查按钮：24h 内 disabled + 限制文案，否则 enabled + 原始文案
function refreshCheckBtnState() {
	var btn = document.getElementById('checkBtn');
	if (!btn) return;
	var nextAt = getLocalNextCheckAt();
	var now = Date.now();
	if (nextAt && now < nextAt) {
		disableCheckBtnLimited(nextAt - now);
	} else {
		btn.disabled = false;
		btn.innerHTML = '<i class="ti ti-refresh-dot"></i><?php echo lang('admin_online_upgrade_check');?>';
	}
}

// 弹出 24h 限制提示 Modal
function showCheckLimitedModal(remainingMs) {
	var body = document.getElementById('checkLimitedModalBody');
	var remain = formatRemaining(remainingMs);
	body.textContent = '<?php echo lang('admin_online_upgrade_check_limited_msg');?>'.replace('%s', remain);
	var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('checkLimitedModal'));
	modal.show();
}

function checkUpdate() {
	var btn = document.getElementById('checkBtn');

	// 前端 localStorage 拦截：24 小时内已检查过，弹窗提示 + disable 按钮，不发请求
	var localNextAt = getLocalNextCheckAt();
	var nowMs = Date.now();
	if (localNextAt && nowMs < localNextAt) {
		var remainingMs = localNextAt - nowMs;
		disableCheckBtnLimited(remainingMs);
		showCheckLimitedModal(remainingMs);
		return;
	}

	btn.disabled = true;
	btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span><?php echo lang('admin_online_upgrade_checking');?>';

	ajax({
		url: '<?php echo url('online_upgrade-check');?>',
		type: 'POST',
		data: { csrf_token: csrfToken },
		dataType: 'json',
		success: function(res) {
			var latestCode = document.getElementById('latestVersionCode');
			var updateBadge = document.getElementById('updateBadge');
			var releaseNotes = document.getElementById('releaseNotes');
			var startBtn = document.getElementById('startBtn');
			var logArea = document.getElementById('logArea');

			if (res.ok) {
				latestCode.textContent = res.latest_version || '—';
				if (res.has_update) {
					updateBadge.className = 'badge bg-success';
					updateBadge.textContent = '<?php echo lang('admin_online_upgrade_has_update');?>';
					updateBadge.classList.remove('d-none');
					startBtn.disabled = false;
				} else {
					updateBadge.className = 'badge bg-secondary';
					updateBadge.textContent = '<?php echo lang('admin_online_upgrade_no_update');?>';
					updateBadge.classList.remove('d-none');
					startBtn.disabled = true;
				}
				if (res.release_notes) {
					releaseNotes.textContent = res.release_notes;
					releaseNotes.classList.remove('d-none');
				}

				// 24 小时频率限制：检查成功后 disable 按钮 + 写入 localStorage + 后端 cache 兜底
				// 后端返回 next_check_at（秒级时间戳），前端统一转毫秒；未返回时按当前时间 + 24h
				var nextAtSec = res.next_check_at || Math.floor(nowMs / 1000) + CHECK_LIMIT_TTL / 1000;
				var nextAtMs = nextAtSec * 1000;
				setLocalNextCheckAt(nextAtMs);
				var remainingMs = nextAtMs - Date.now();
				disableCheckBtnLimited(remainingMs);

				var cachedTip = res.cached ? '<?php echo lang('admin_online_upgrade_check_cached_tip');?>' : '';
				var limitTip = '<div class="alert alert-secondary py-2 mt-1"><i class="ti ti-clock-pause"></i><?php echo lang('admin_online_upgrade_check_done_limited');?>' + (cachedTip ? ' ' + escapeHtml(cachedTip) : '') + '</div>';
				logArea.innerHTML = '<div class="alert alert-info py-2"><i class="ti ti-info-circle"></i>' + escapeHtml(res.message || '') + '</div>' + limitTip;
			} else {
				// 检查失败：恢复按钮，不写限制缓存，允许用户立即重试
				btn.disabled = false;
				btn.innerHTML = '<i class="ti ti-refresh-dot"></i><?php echo lang('admin_online_upgrade_check');?>';
				logArea.innerHTML = '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle"></i>' + escapeHtml(res.message || '<?php echo lang('admin_online_upgrade_check_failed');?>') + '</div>';
			}
		},
		error: function(xhr) {
			btn.disabled = false;
			btn.innerHTML = '<i class="ti ti-refresh-dot"></i><?php echo lang('admin_online_upgrade_check');?>';
			var logArea = document.getElementById('logArea');
			logArea.innerHTML = '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle"></i><?php echo lang('admin_online_upgrade_request_failed');?>' + escapeHtml(xhr.responseText ? xhr.responseText.substring(0, 200) : '') + '</div>';
		}
	});
}

function preflight() {
	if (isUpgrading) return;
	// 弹出升级前确认 Modal，由用户勾选全部确认项后才能继续
	var modalEl = document.getElementById('upgradeConfirmModal');
	// 重置勾选状态（每次进入都强制重新确认，避免残留勾选直接放行）
	document.querySelectorAll('.upgrade-confirm-checkbox').forEach(function(cb){ cb.checked = false; });
	document.getElementById('confirmStartUpgradeBtn').disabled = true;
	var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
	modal.show();
}

// Modal 中「确认开始升级」按钮：所有勾选项都勾选后才会启用
function confirmStartUpgrade() {
	var btn = document.getElementById('startBtn');
	btn.disabled = true;
	btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span><?php echo lang('admin_online_upgrade_preflight_running');?>';
	document.getElementById('checkBtn').disabled = true;
	document.getElementById('reinstallBtn').disabled = true;
	document.getElementById('preflightAlert').classList.add('d-none');

	// 关闭 Modal
	var modalEl = document.getElementById('upgradeConfirmModal');
	var modal = bootstrap.Modal.getInstance(modalEl);
	if (modal) modal.hide();

	// 先执行前置检查，通过后再启动升级步骤
	runPreflight(function(passed) {
		if (!passed) {
			btn.disabled = false;
			btn.innerHTML = '<i class="ti ti-player-play-filled"></i><?php echo lang('admin_online_upgrade_start');?>';
			document.getElementById('reinstallBtn').disabled = false;
			// 前置检查失败恢复时，按 localStorage 限制状态恢复检查按钮
			refreshCheckBtnState();
			return;
		}
		// 前置检查通过，开始升级
		isUpgrading = true;
		btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span><?php echo lang('admin_online_upgrade_upgrading');?>';
		// 重置步骤状态
		currentStep = 0;
		document.querySelectorAll('.step-icon').forEach(function(el, idx){
			el.style.background = 'var(--bs-gray-300)';
			el.style.color = '';
			el.innerHTML = '<span class="step-number fw-bold" style="font-size:0.75rem">' + (idx + 1) + '</span>';
		});
		document.querySelectorAll('.step-status').forEach(function(el){ el.innerHTML = '<span class="text-secondary fs-6"><?php echo lang('admin_online_upgrade_waiting');?></span>'; });
		document.querySelectorAll('.step-result').forEach(function(el){ el.innerHTML = ''; });

		runNextStep();
	});
}

// 监听勾选变化：4 项全部勾选才启用「确认开始升级」按钮
(function() {
	var checkboxes = document.querySelectorAll('.upgrade-confirm-checkbox');
	var confirmBtn = document.getElementById('confirmStartUpgradeBtn');
	checkboxes.forEach(function(cb) {
		cb.addEventListener('change', function() {
			var allChecked = true;
			checkboxes.forEach(function(c) { if (!c.checked) allChecked = false; });
			confirmBtn.disabled = !allChecked;
		});
	});
})();

// 前置检查：调 ?online_upgrade-preflight.htm，未通过则展示问题清单
function runPreflight(callback) {
	var alertEl = document.getElementById('preflightAlert');
	ajax({
		url: '<?php echo url('online_upgrade-preflight');?>',
		type: 'POST',
		data: { csrf_token: csrfToken },
		dataType: 'json',
		success: function(res) {
			var warnings = res.warnings || [];
			if (res.ok) {
				// 通过：若仍有非阻断警告（如 APP_PATH 不可写），黄色提示但允许继续
				if (warnings.length > 0) {
					var html = '<strong><i class="ti ti-info-circle"></i> <?php echo lang('admin_online_upgrade_preflight_warning');?></strong>';
					html += '<ul class="mb-0 mt-1 ps-3">';
					for (var i = 0; i < warnings.length; i++) {
						html += '<li>' + escapeHtml(warnings[i]) + '</li>';
					}
					html += '</ul>';
					alertEl.className = 'alert alert-warning py-2';
					alertEl.innerHTML = html;
					alertEl.classList.remove('d-none');
				} else {
					alertEl.classList.add('d-none');
				}
				callback(true);
			} else {
				var html = '<strong><i class="ti ti-alert-triangle"></i> <?php echo lang('admin_online_upgrade_preflight_block');?></strong>';
				if (warnings.length > 0) {
					html += '<ul class="mb-0 mt-1 ps-3">';
					for (var i = 0; i < warnings.length; i++) {
						html += '<li>' + escapeHtml(warnings[i]) + '</li>';
					}
					html += '</ul>';
				}
				alertEl.className = 'alert alert-danger py-2';
				alertEl.innerHTML = html;
				alertEl.classList.remove('d-none');
				callback(false);
			}
		},
		error: function(xhr) {
			alertEl.className = 'alert alert-danger py-2';
			alertEl.innerHTML = '<strong><i class="ti ti-alert-triangle"></i> <?php echo lang('admin_online_upgrade_preflight_request_failed');?></strong>' + escapeHtml(xhr.responseText ? xhr.responseText.substring(0, 200) : '');
			alertEl.classList.remove('d-none');
			callback(false);
		}
	});
}

function runNextStep() {
	if (currentStep >= steps.length) {
		finishUpgrade();
		return;
	}

	var step = steps[currentStep];
	var stepEl = document.getElementById('step-' + step.id);
	var iconEl = stepEl.querySelector('.step-icon');
	var statusEl = stepEl.querySelector('.step-status');
	var resultEl = stepEl.querySelector('.step-result');

	iconEl.style.background = 'var(--bs-primary)';
	iconEl.style.color = '#fff';
	iconEl.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
	statusEl.innerHTML = '<span class="text-primary fs-6"><?php echo lang('admin_online_upgrade_executing');?></span>';
	resultEl.innerHTML = '';

	ajax({
		url: '<?php echo url('online_upgrade-run_step');?>',
		type: 'POST',
		data: { step: step.id, csrf_token: csrfToken },
		dataType: 'json',
		success: function(res) {
			iconEl.innerHTML = res.ok ? '<i class="ti ti-check text-white"></i>' : '<i class="ti ti-exclamation-circle text-white"></i>';
			iconEl.style.background = res.ok ? 'var(--bs-success, #198754)' : 'var(--bs-danger, #dc3545)';
			statusEl.innerHTML = res.ok ? '<span class="text-success fs-6"><?php echo lang('admin_online_upgrade_complete');?></span>' : '<span class="text-danger fs-6"><?php echo lang('admin_online_upgrade_failed');?></span>';

			var detailHtml = escapeHtml(res.message || '');
		if (res.results && res.results.length > 0) {
			detailHtml += '<div class="mt-1" style="font-size:0.75rem">';
			res.results.forEach(function(r, i) {
				var icon = r.ok ? '<i class="ti ti-check text-success"></i>' : '<i class="ti ti-x text-danger"></i>';
				detailHtml += '<div>' + icon + ' ' + escapeHtml(r.name || '') + ' — ' + escapeHtml(r.message) + '</div>';
			});
			detailHtml += '</div>';
		}
		resultEl.innerHTML = detailHtml;

			if (!res.ok) {
				showUpgradeError(res.message);
				return;
			}

			currentStep++;
			runNextStep();
		},
		error: function(xhr) {
			iconEl.innerHTML = '<i class="ti ti-x text-white"></i>';
			iconEl.style.background = 'var(--bs-danger, #dc3545)';
			statusEl.innerHTML = '<span class="text-danger fs-6"><?php echo lang('admin_online_upgrade_failed');?></span>';
			var errMsg = '<?php echo lang('admin_online_upgrade_request_failed');?>';
			if (xhr.responseText) {
				errMsg += xhr.responseText.substring(0, 200);
			}
			resultEl.innerHTML = escapeHtml(errMsg);
			showUpgradeError(errMsg);
		}
	});
}

function finishUpgrade() {
	isUpgrading = false;
	var btn = document.getElementById('startBtn');
	btn.disabled = true;
	btn.innerHTML = '<i class="ti ti-check"></i><?php echo lang('admin_online_upgrade_done');?>';
	btn.className = 'btn btn-success';

	document.getElementById('reinstallBtn').disabled = false;

	// 升级完成后清除版本检查缓存（仪表盘 + 手动检查的 24h 限制），允许用户立即重新检查新版本
	try { localStorage.removeItem('xiunox_upgrade_check'); } catch(e) {}
	try { localStorage.removeItem(CHECK_LIMIT_KEY); } catch(e) {}
	refreshCheckBtnState();

	var logArea = document.getElementById('logArea');
	var latestVersion = document.getElementById('latestVersionCode').textContent;
	logArea.innerHTML = '<div class="alert alert-success py-2"><i class="ti ti-circle-check"></i><?php echo lang('admin_online_upgrade_success_msg');?>' + (latestVersion && latestVersion !== '—' ? '<b>' + escapeHtml(latestVersion) + '</b>' : '') + '</div>';
}

function showUpgradeError(msg) {
	isUpgrading = false;
	var btn = document.getElementById('startBtn');
	btn.innerHTML = '<i class="ti ti-refresh"></i><?php echo lang('admin_online_upgrade_retry');?>';
	btn.className = 'btn btn-warning';
	btn.disabled = false;

	document.getElementById('reinstallBtn').disabled = false;
	// 升级失败不影响检查频率限制：按 localStorage 当前状态恢复检查按钮（24h 内仍 disabled）
	refreshCheckBtnState();

	var logArea = document.getElementById('logArea');
	logArea.innerHTML = '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle"></i>' + escapeHtml(msg) + '</div>';
}

function reinstall() {
	if (!confirm('<?php echo lang('admin_online_upgrade_reinstall_confirm');?>')) return;
	var btn = document.getElementById('reinstallBtn');
	btn.disabled = true;
	btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span><?php echo lang('admin_online_upgrade_reinstalling');?>';

	ajax({
		url: '<?php echo url('online_upgrade-reinstall');?>',
		type: 'POST',
		data: { csrf_token: csrfToken },
		dataType: 'json',
		success: function(res) {
			btn.disabled = false;
			btn.innerHTML = '<i class="ti ti-refresh"></i><?php echo lang('admin_online_upgrade_reinstall');?>';
			var logArea = document.getElementById('logArea');
			if (res.ok) {
				logArea.innerHTML = '<div class="alert alert-success py-2"><i class="ti ti-circle-check"></i>' + escapeHtml(res.message || '<?php echo lang('admin_online_upgrade_reinstall_success');?>') + '</div>';
			} else {
				logArea.innerHTML = '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle"></i>' + escapeHtml(res.message || '<?php echo lang('admin_online_upgrade_reinstall_failed');?>') + '</div>';
			}
		},
		error: function(xhr) {
			btn.disabled = false;
			btn.innerHTML = '<i class="ti ti-refresh"></i><?php echo lang('admin_online_upgrade_reinstall');?>';
			var logArea = document.getElementById('logArea');
			logArea.innerHTML = '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle"></i><?php echo lang('admin_online_upgrade_request_failed');?>' + escapeHtml(xhr.responseText ? xhr.responseText.substring(0, 200) : '') + '</div>';
		}
	});
}

// 页面加载初始化：若 24h 内已检查过，预 disable 检查按钮并改文案
refreshCheckBtnState();
</script>
