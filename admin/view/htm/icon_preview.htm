<script src="../view/js/tabler-icon-picker.js"></script>
<script>
var allIcons = [];
var filteredIcons = [];
var displayedCount = 0;
var PAGE_SIZE = 100;
var hasSearched = false;

var iconGrid = document.getElementById('iconGrid');
var searchInput = document.getElementById('iconSearch');
var iconCountEl = document.getElementById('iconCount');
var iconEmptyHint = document.getElementById('iconEmptyHint');
var iconLoadMore = document.getElementById('iconLoadMore');
var loadMoreBtn = document.getElementById('loadMoreBtn');
var loadMoreInfo = document.getElementById('loadMoreInfo');

// 渲染一批图标（追加到网格）
function renderIconPage(startIndex) {
    var endIndex = Math.min(startIndex + PAGE_SIZE, filteredIcons.length);
    var fragment = document.createDocumentFragment();

    for (var i = startIndex; i < endIndex; i++) {
        var name = filteredIcons[i];
        var col = document.createElement('div');
        col.className = 'col-6 col-sm-4 col-md-3 col-lg-2';
        col.innerHTML = '<div class="icon-item text-center p-3 border rounded-3 cursor-pointer" data-icon="' + name + '" title="' + name + '">' +
            '<i class="ti ' + name + '" style="font-size:1.5rem"></i>' +
            '<div class="small text-body-secondary mt-1 text-truncate">' + name.replace('ti-', '') + '</div>' +
            '</div>';
        fragment.appendChild(col);
    }

    iconGrid.appendChild(fragment);
    displayedCount = endIndex;
    updateLoadMoreUI();
}

// 更新加载更多按钮状态
function updateLoadMoreUI() {
    if (displayedCount >= filteredIcons.length) {
        iconLoadMore.style.display = 'none';
    } else {
        iconLoadMore.style.display = '';
        loadMoreInfo.textContent = ' (' + displayedCount + '/' + filteredIcons.length + ')';
    }
}

// 搜索并渲染
function doSearch(keyword) {
    iconGrid.innerHTML = '';
    displayedCount = 0;

    if (!keyword) {
        // 清空搜索时恢复显示全部图标的第一页
        filteredIcons = allIcons;
        if (allIcons.length > 0) {
            iconEmptyHint.style.display = 'none';
            renderIconPage(0);
        } else {
            iconEmptyHint.style.display = '';
            iconLoadMore.style.display = 'none';
        }
        hasSearched = false;
        return;
    }

    hasSearched = true;
    iconEmptyHint.style.display = 'none';

    var kw = keyword.toLowerCase();
    filteredIcons = allIcons.filter(function(name) {
        return name.toLowerCase().indexOf(kw) !== -1;
    });

    if (filteredIcons.length === 0) {
        iconEmptyHint.style.display = '';
        iconLoadMore.style.display = 'none';
        return;
    }

    iconEmptyHint.style.display = 'none';

    renderIconPage(0);
}

// 点击复制图标代码
iconGrid.addEventListener('click', function(e) {
    var item = e.target.closest('.icon-item');
    if (!item) return;
    var iconName = item.getAttribute('data-icon');
    var code = '<i class="ti ' + iconName + '"></i>';
    if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function() {
            showToast('<?php echo lang('admin_icon_copied');?>');
        });
    } else {
        var ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('<?php echo lang('admin_icon_copied');?>');
    }
});

// 搜索输入（防抖）
var searchTimer = null;
searchInput.addEventListener('input', function() {
    clearTimeout(searchTimer);
    var val = this.value.trim();
    searchTimer = setTimeout(function() {
        doSearch(val);
    }, 300);
});

// 加载更多
loadMoreBtn.addEventListener('click', function() {
    renderIconPage(displayedCount);
});

// 动态加载图标列表并默认展示一页
TablerIconPicker.getIconList().then(function(icons) {
    allIcons = icons;
    iconCountEl.innerText = allIcons.length;
    // 默认展示第一页（全部图标）
    filteredIcons = allIcons;
    iconEmptyHint.style.display = 'none';
    renderIconPage(0);
});
</script>
