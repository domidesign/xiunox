<script>
// 提交时禁用按钮 + loading，防重复提交
function pluginNoticeSubmitLock(form) {
	var btn = form.querySelector('button[type="submit"]');
	if(btn && !btn.disabled) {
		btn.disabled = true;
		var icon = btn.querySelector('i');
		if(icon) icon.className = 'ti ti-loader-2 me-1';
		btn.classList.add('btn-loading');
		return true;
	}
	return false;
}
</script>
