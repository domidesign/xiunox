<script>
// SMTP 管理器：切换密码可见性
function toggleSmtpPass(btn) {
    var row = btn.closest('tr');
    var passInput = row.querySelector('input[name="pass[]"]');
    var icon = btn.querySelector('i');
    if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'ti ti-eye-off';
    } else {
        passInput.type = 'password';
        icon.className = 'ti ti-eye';
    }
}

// SMTP 管理器：SSL 变更自动更新端口
function onSmtpSslChange(selectEl) {
    var row = selectEl.closest('tr');
    var portInput = row.querySelector('input[name="port[]"]');
    var ssl = parseInt(selectEl.value);
    if (ssl === 1) { portInput.value = 465; }
    else if (ssl === 2) { portInput.value = 587; }
    else { portInput.value = 25; }
}

// SMTP 管理器：添加行
function addSmtpRow() {
    var tbody = document.getElementById('smtp-tbody');
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><input type="text" class="form-control form-control-sm" name="email[]" value="" placeholder="<?php echo lang('email');?>"></td>' +
        '<td><input type="text" class="form-control form-control-sm" name="host[]" value="" placeholder="<?php echo lang('smtp_host');?>"></td>' +
        '<td><input type="text" class="form-control form-control-sm text-center" name="port[]" value="25" placeholder="<?php echo lang('port');?>"></td>' +
        '<td><input type="text" class="form-control form-control-sm" name="user[]" value="" placeholder="<?php echo lang('username');?>"></td>' +
        '<td><div class="input-group input-group-sm"><input type="password" class="form-control" name="pass[]" value="" placeholder="<?php echo lang('password');?>"><button type="button" class="btn btn-outline-secondary" onclick="toggleSmtpPass(this)"><i class="ti ti-eye"></i></button></div></td>' +
        '<td><select class="form-select form-select-sm" name="ssl[]" onchange="onSmtpSslChange(this)"><option value="0"><?php echo lang('smtp_encryption_none');?></option><option value="1">SSL</option><option value="2">TLS</option></select></td>' +
        '<td class="text-center"><button type="button" class="btn btn-outline-danger btn-sm" onclick="removeSmtpRow(this)"><i class="ti ti-trash"></i></button></td>';
    tbody.appendChild(tr);
    updateSmtpEmptyState();
    refreshSmtpSelect();
}

// SMTP 管理器：删除行
function removeSmtpRow(btn) {
    btn.closest('tr').remove();
    updateSmtpEmptyState();
    refreshSmtpSelect();
}

// SMTP 管理器：更新空状态
function updateSmtpEmptyState() {
    var tbody = document.getElementById('smtp-tbody');
    var empty = document.getElementById('smtp-empty');
    var rows = tbody.querySelectorAll('tr');
    if (rows.length === 0) {
        empty.classList.remove('d-none');
    } else {
        empty.classList.add('d-none');
    }
}

// SMTP 测试：刷新 SMTP 选择列表
function refreshSmtpSelect() {
    var select = document.getElementById('testSmtpSelect');
    var rows = document.querySelectorAll('#smtp-tbody tr');
    select.innerHTML = '';
    for (var i = 0; i < rows.length; i++) {
        var host = rows[i].querySelector('input[name="host[]"]').value || '<?php echo lang('smtp_not_configured');?>';
        var user = rows[i].querySelector('input[name="user[]"]').value;
        var option = document.createElement('option');
        option.value = i;
        option.textContent = host + (user ? ' (' + user + ')' : '');
        select.appendChild(option);
    }
}

// SMTP 测试：发送测试邮件
function sendTestEmail() {
    var testEmail = document.getElementById('testEmail').value.trim();
    if (!testEmail) return;
    var testSmtpIndex = document.getElementById('testSmtpSelect').value;
    var btn = document.getElementById('sendTestBtn');
    var resultDiv = document.getElementById('testResult');

    btn.disabled = true;
    btn.querySelector('i').className = 'ti me-1 ti-loader-2';
    btn.querySelector('span').textContent = '<?php echo lang('smtp_sending');?>';
    resultDiv.classList.add('d-none');

    var csrfToken = document.querySelector('input[name="csrf_token"]');
    var csrfValue = csrfToken ? csrfToken.value : '';

    fetch('<?php echo admin_setting_smtp_test_url();?>', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
        body: 'test_email=' + encodeURIComponent(testEmail) + '&smtp_index=' + encodeURIComponent(testSmtpIndex) + '&csrf_token=' + encodeURIComponent(csrfValue)
    }).then(function(res) { return res.json(); })
    .then(function(data) {
        var alertClass = data.code == 0 ? 'alert-success' : 'alert-danger';
        var iconClass = data.code == 0 ? 'ti-circle-check' : 'ti-alert-circle';
        resultDiv.classList.remove('d-none');
        resultDiv.innerHTML = '<div class="alert d-flex align-items-center ' + alertClass + '"><i class="ti me-2 ' + iconClass + '"></i><span>' + escHtml(data.message) + '</span></div>';
        btn.disabled = false;
        btn.querySelector('i').className = 'ti me-1 ti-send';
        btn.querySelector('span').textContent = '<?php echo lang('smtp_send_test_email');?>';
        if (!document.getElementById('testEmail').value.trim()) {
            btn.disabled = true;
        }
    })
    .catch(function(e) {
        resultDiv.classList.remove('d-none');
        resultDiv.innerHTML = '<div class="alert alert-danger d-flex align-items-center"><i class="ti me-2 ti-alert-circle"></i><span><?php echo lang('smtp_request_failed');?>' + escHtml(e.message) + '</span></div>';
        btn.disabled = false;
        btn.querySelector('i').className = 'ti me-1 ti-send';
        btn.querySelector('span').textContent = '<?php echo lang('smtp_send_test_email');?>';
        if (!document.getElementById('testEmail').value.trim()) {
            btn.disabled = true;
        }
    });
}

// HTML 转义
function escHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// 日志筛选：拦截按钮点击，用 AJAX 加载日志内容并切换到日志 tab
document.querySelectorAll('.log-filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        var status = btn.getAttribute('data-status');
        var url = '<?php echo admin_setting_url('email_log');?>' + (status !== null ? '&status=' + status : '');
        // 直接跳转到对应的独立页面（兼容）
        window.location = '<?php echo admin_setting_url('email_log');?>' + (status !== null ? '?status=' + status : '');
    });
});

// SMTP 设置表单提交
var jsmtpForm = $('#smtpForm');
var jsmtpSubmit = jsmtpForm.find('button[type="submit"]');
jsmtpForm.on('submit', function() {
    setBtnLoading(jsmtpSubmit, true);
    var postdata = jsmtpForm.serialize();
    $.xpost(jsmtpForm.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ window.location.reload(); }, 1000);
        } else if(xn.is_number(code)) {
            showToast(message, 'error');
            setBtnLoading(jsmtpSubmit, false);
        } else {
            jsmtpForm.find('[name="'+code+'"]').fieldError(message).focus();
            setBtnLoading(jsmtpSubmit, false);
        }
    });
    return false;
});

// 邮件模板表单提交
var jtplForm = $('#templateForm');
var jtplSubmit = jtplForm.find('button[type="submit"]');
jtplForm.on('submit', function() {
    setBtnLoading(jtplSubmit, true);
    var postdata = jtplForm.serialize();
    $.xpost(jtplForm.attr('action'), postdata, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ window.location.reload(); }, 1000);
        } else {
            showToast(message, 'error');
            setBtnLoading(jtplSubmit, false);
        }
    });
    return false;
});
</script>
