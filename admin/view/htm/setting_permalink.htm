<script>
// 选中状态高亮
function updateCardHighlight() {
	document.querySelectorAll('.permalink-option-card').forEach(function(card) {
		var radio = card.querySelector('input[type="radio"]');
		if(radio.checked) {
			card.classList.add('border-primary', 'bg-primary', 'bg-opacity-10');
			card.classList.remove('border-body-secondary');
		} else {
			card.classList.remove('border-primary', 'bg-primary', 'bg-opacity-10');
			card.classList.add('border-body-secondary');
		}
	});
}

// 切换 URL 风格时显示/隐藏 rewrite 规则
function toggleRewriteRules() {
	var val = document.querySelector('input[name="url_rewrite_on"]:checked').value;
	var section = document.getElementById('rewriteRulesSection');
	var skipSection = document.getElementById('skipDetectSection');
	section.style.display = (val == '0') ? 'none' : '';
	skipSection.style.display = (val == '0') ? 'none' : '';
	// 切到伪静态模式时滚动到规则区域，方便用户复制
	if(val != '0') {
		setTimeout(function() {
			section.scrollIntoView({behavior: 'smooth', block: 'nearest'});
		}, 100);
	}
	updateCardHighlight();
}

// 绑定 radio change 事件
document.querySelectorAll('input[name="url_rewrite_on"]').forEach(function(radio) {
	radio.addEventListener('change', toggleRewriteRules);
});
// 初始化高亮和规则面板状态
updateCardHighlight();
toggleRewriteRules();

// 复制 rewrite 规则
function copyRules(elementId) {
	var el = document.getElementById(elementId);
	var text = el.textContent || el.innerText;
	if (navigator.clipboard) {
		navigator.clipboard.writeText(text).then(function() {
			showCopyFeedback(elementId);
		});
	} else {
		var textarea = document.createElement('textarea');
		textarea.value = text;
		document.body.appendChild(textarea);
		textarea.select();
		document.execCommand('copy');
		document.body.removeChild(textarea);
		showCopyFeedback(elementId);
	}
}

function showCopyFeedback(elementId) {
	var btn = document.querySelector('#' + elementId).closest('.col-md-6').querySelector('button');
	var originalText = btn.innerHTML;
	btn.innerHTML = '<i class="ti ti-check me-1"></i><?php echo lang('admin_permalink_copied');?>';
	btn.classList.remove('btn-outline-secondary');
	btn.classList.add('btn-success');
	setTimeout(function() {
		btn.innerHTML = originalText;
		btn.classList.remove('btn-success');
		btn.classList.add('btn-outline-secondary');
	}, 2000);
}

// 表单提交
var jform = $('#form');
var jsubmit = $('#submit');
var current_rewrite_on = <?php echo intval($url_rewrite_on); ?>;

jform.on('submit', function(e) {
	e.preventDefault();

	var new_val = parseInt(document.querySelector('input[name="url_rewrite_on"]:checked').value);

	// 从默认模式(0)切到伪静态模式(1,3,4,5)时，提醒先配置 rewrite 规则
	if(current_rewrite_on === 0 && new_val > 0) {
		showRewriteConfirmModal(function() {
			doSubmitForm();
		});
		return false;
	}

	doSubmitForm();
	return false;
});

function doSubmitForm() {
	setBtnLoading(jsubmit, true);
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ window.location.reload(); }, 1000);
		} else if(xn.is_number(code)) {
			showToast(message, 'error');
			setBtnLoading(jsubmit, false);
		} else {
			jform.find('[name="'+code+'"]').alert(message).focus();
			setBtnLoading(jsubmit, false);
		}
	});
}

function showRewriteConfirmModal(onConfirm) {
	var modalHtml = '' +
	'<div class="modal fade" id="rewriteConfirmModal" tabindex="-1" aria-hidden="true">' +
	'  <div class="modal-dialog modal-dialog-centered">' +
	'    <div class="modal-content">' +
	'      <div class="modal-header">' +
	'        <h5 class="modal-title"><i class="ti ti-alert-triangle text-warning me-2"></i><?php echo lang('admin_permalink_confirm_rewrite_title');?></h5>' +
	'        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>' +
	'      </div>' +
	'      <div class="modal-body">' +
	'        <p class="mb-0" style="white-space:pre-line;"><?php echo lang('admin_permalink_confirm_rewrite_body');?></p>' +
	'      </div>' +
	'      <div class="modal-footer">' +
	'        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><?php echo lang('admin_permalink_confirm_rewrite_cancel');?></button>' +
	'        <button type="button" class="btn btn-primary" id="rewriteConfirmContinue"><?php echo lang('admin_permalink_confirm_rewrite_continue');?></button>' +
	'      </div>' +
	'    </div>' +
	'  </div>' +
	'</div>';

	// 移除已有 modal
	var existing = document.getElementById('rewriteConfirmModal');
	if(existing) existing.remove();

	document.body.insertAdjacentHTML('beforeend', modalHtml);
	var modalEl = document.getElementById('rewriteConfirmModal');
	var modal = new bootstrap.Modal(modalEl);

	document.getElementById('rewriteConfirmContinue').onclick = function() {
		modal.hide();
		onConfirm();
	};

	// 清理 DOM
	modalEl.addEventListener('hidden.bs.modal', function() {
		modalEl.remove();
	});

	modal.show();
}
</script>
