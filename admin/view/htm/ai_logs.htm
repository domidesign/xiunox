<script>
// AI 日志搜索:构建保留路由信息的 URL(./?ai-logs.htm?source=X&feature=X&status=X)
// 不能依赖 GET 表单默认提交:浏览器会用表单字段替换 action URL 中的 query string,
// 丢失 ./?ai-logs.htm 中的路由信息 ai-logs.htm,导致 404。
function aiLogsSearch() {
	var form = document.getElementById('aiLogsSearchForm');
	if (!form) return;
	var source = form.elements['source'].value;
	var feature = form.elements['feature'].value;
	var status = form.elements['status'].value;
	var url = '<?php echo url('ai-logs');?>?source=' + encodeURIComponent(source)
			+ '&feature=' + encodeURIComponent(feature)
			+ '&status=' + encodeURIComponent(status);
	window.location.href = url;
}
document.getElementById('aiLogsSearchForm').addEventListener('submit', function(e) {
	e.preventDefault();
	aiLogsSearch();
});
</script>
