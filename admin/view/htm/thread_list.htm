<script>
var jform = $('#form');
var jsubmit = $('#search');
var jsearch_result = $('#search_result_card');
var jfid = $('#fid');
var jcheckall = $('#checkall');
var jbatch_toolbar = $('#batch_toolbar');
var jbatch_btns = jbatch_toolbar.find('button[data-op]');
var jmove_forum = $('#move_forum');
var jpagesize = $('#pagesize_select');
var jorderby = $('#orderby_select');
var jresult_info = $('#result_info');
var jpagination = $('#pagination_area');

// 当前搜索条件（翻页时保留）
var currentSearch = {};
var currentFoundPage = 1;
var lastTotal = 0;

// 从 localStorage 恢复 pagesize
try {
	var savedPagesize = parseInt(localStorage.getItem('admin_thread_pagesize'));
	if(savedPagesize && [20, 50, 100, 200].indexOf(savedPagesize) !== -1) {
		jpagesize.val(savedPagesize);
	}
} catch(e) {}

// 收集表单搜索条件
function collectSearch() {
	return {
		fid: jfid.val(),
		keyword: $('#keyword').val(),
		create_date_start: $('#create_date_start').val(),
		create_date_end: $('#create_date_end').val(),
		userip: $('#userip').val(),
		uid: $('#uid').val(),
		status: $('#status_select').val(),
		orderby: jorderby.val(),
		pagesize: parseInt(jpagesize.val()) || 100
	};
}

// 加载搜索结果（直接 GET found 路由，搜索条件作为 query string 传递，后端 SELECT 查询+排序+分页）
function loadThreadResults(page, callback) {
	page = page || 1;
	currentFoundPage = page;
	currentSearch = collectSearch();
	var baseUrl = <?php echo json_encode(route_url('admin_thread_found', ['page' => '__PAGE__']));?>.replace('__PAGE__', page);
	var query = $.param(currentSearch);
	var url = baseUrl + '&' + query;
	$.get(url, function(html) {
		var $html = $('<div>').html(html.replace(/<script[\s\S]*?<\/script>/gi, ''));
		var $tbody = $html.find('tbody');
		if($tbody.length) {
			$('#thread_result_list').html($tbody.html());
		} else {
			$('#thread_result_list').html('<tr><td colspan="7" class="text-center py-4 text-secondary"><?php echo lang('no_search_result');?></td></tr>');
		}
		// 提取分页
		var $pagination = $html.find('.pagination');
		jpagination.html($pagination.length ? $pagination : '');
		// 提取总数（found 路由 db_count 的真实结果）
		var totalText = $html.find('[data-total]').data('total');
		if(typeof totalText !== 'undefined') {
			lastTotal = parseInt(totalText) || 0;
		}
		jresult_info.html('<?php echo lang('admin_thread_total_found');?>'.replace('{n}', '<b>' + lastTotal + '</b>'));
		jbatch_toolbar.show();
		updateBatchButtons();
		if(typeof callback === 'function') callback();
	});
}

// 拦截分页链接点击：AJAX 加载，保留当前搜索条件
jpagination.on('click', 'a.page-link', function(e) {
	e.preventDefault();
	var href = $(this).attr('href') || '';
	var match = href.match(/thread-found-(\d+)/);
	if(match) {
		loadThreadResults(parseInt(match[1], 10));
	}
});

// 搜索：直接加载 found 第1页（无需 scan 扫描入队列）
jsubmit.on('click', function() {
	setBtnLoading(jsubmit, true);
	jsearch_result.show();
	loadThreadResults(1, function() {
		setBtnLoading(jsubmit, false);
		if(lastTotal > 0) {
			showToast('<?php echo lang('search_complete');?>', 'success');
		} else {
			showToast('<?php echo lang('no_search_result');?>', 'warning');
		}
	});
});

// 每页条数切换：保存到 localStorage + 重新加载当前页
jpagesize.on('change', function() {
	try { localStorage.setItem('admin_thread_pagesize', $(this).val()); } catch(e) {}
	if(jsearch_result.is(':visible') && lastTotal > 0) {
		loadThreadResults(1);
	}
});

// 全选/取消全选
jcheckall.on('change', function() {
	var checked = $(this).prop('checked');
	$('#thread_result_list input[name="modtid"]').prop('checked', checked);
	updateBatchButtons();
});

// 委托监听复选框变化
$('#thread_result_list').on('change', 'input[name="modtid"]', function() {
	updateBatchButtons();
});

// 更新批量按钮状态
function updateBatchButtons() {
	var checked = $('#thread_result_list input[name="modtid"]:checked');
	var total = $('#thread_result_list input[name="modtid"]');
	var count = checked.length;
	jbatch_btns.prop('disabled', count === 0);
	// 置顶/精华/公告 dropdown 按钮单独控制
	$('#top_dropdown_btn').prop('disabled', count === 0);
	$('#digest_dropdown_btn').prop('disabled', count === 0);
	$('#announcement_dropdown_btn').prop('disabled', count === 0);
	jmove_forum.prop('disabled', count === 0);
	jcheckall.prop('checked', total.length > 0 && count === total.length);
}

// 获取选中的 tid
function getSelectedTids() {
	var tids = [];
	$('#thread_result_list input[name="modtid"]:checked').each(function() {
		tids.push($(this).val());
	});
	return tids;
}

// 批量操作（按钮 + 置顶 dropdown 项统一处理）
function doBatch(op, extra) {
	var tids = getSelectedTids();
	if(tids.length === 0) {
		showToast('<?php echo lang('admin_thread_no_selection');?>', 'warning');
		return;
	}

	if(op === 'move') {
		var targetFid = jmove_forum.val();
		if(!targetFid) {
			showToast('<?php echo lang('admin_thread_please_select_forum');?>', 'warning');
			return;
		}
	}

	var confirmMsg = '';
	if(op === 'close') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_close');?>';
	else if(op === 'open') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_open');?>';
	else if(op === 'delete') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_delete');?>';
	else if(op === 'announcement') {
		var annVal = extra && typeof extra.announcement !== 'undefined' ? parseInt(extra.announcement) : 1;
		if(annVal === 0) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_announcement_cancel');?>';
		else confirmMsg = '<?php echo lang('admin_thread_confirm_batch_announcement_set');?>';
	}
	else if(op === 'top') {
		var topVal = extra && typeof extra.top !== 'undefined' ? parseInt(extra.top) : 1;
		if(topVal === 0) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_top_cancel');?>';
		else if(topVal === 3) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_top_global');?>';
		else confirmMsg = '<?php echo lang('admin_thread_confirm_batch_top_forum');?>';
	}
	else if(op === 'digest') {
		var digestVal = extra && typeof extra.digest !== 'undefined' ? parseInt(extra.digest) : 1;
		if(digestVal === 0) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_digest_cancel');?>';
		else if(digestVal === 1) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_digest_1');?>';
		else if(digestVal === 2) confirmMsg = '<?php echo lang('admin_thread_confirm_batch_digest_2');?>';
		else confirmMsg = '<?php echo lang('admin_thread_confirm_batch_digest_3');?>';
	}
	else if(op === 'move') {
		// move 已通过 modal 弹窗确认，不再二次确认
	}
	else return;

	function doSubmit() {
	var url = '<?php echo admin_thread_batch_url();?>';
	var postdata = {
		tids: tids.join(','),
		op: op,
		csrf_token: $('input[name="csrf_token"]').val()
	};
	if(op === 'move') {
		postdata.target_fid = jmove_forum.val();
	}
	if(op === 'top') {
		postdata.top = extra.top;
	}
	if(op === 'digest') {
		postdata.digest = extra.digest;
	}
	if(op === 'announcement') {
		postdata.announcement = extra.announcement;
	}
	$.xpost(url, postdata, function(code, message) {
		if(parseInt(code) == 0) {
			if(op === 'delete') {
				lastTotal = Math.max(0, lastTotal - tids.length);
			}
			showToast('<?php echo lang('admin_thread_batch_success');?>', 'success');
			loadThreadResults(currentFoundPage);
			if(op === 'move' && moveThreadModal) {
				moveThreadModal.hide();
				jmove_forum.val('');
			}
		} else {
			showToast(message || '<?php echo lang('admin_thread_batch_failed');?>', 'error');
		}
	});
	}

	if(confirmMsg) {
		XN.confirm(confirmMsg, doSubmit);
	} else {
		doSubmit();
	}
}

// 按钮（除置顶/精华外）直接触发
jbatch_btns.on('click', function() {
	var op = $(this).data('op');
	if(op === 'move') {
		var tids = getSelectedTids();
		if(tids.length === 0) {
			showToast('<?php echo lang('admin_thread_no_selection');?>', 'warning');
			return;
		}
		jmove_forum.val('');
		if(moveThreadModal) moveThreadModal.show();
		return;
	}
	doBatch(op);
});

// 置顶/精华/公告 dropdown 项触发
$('#batch_toolbar').on('click', 'a.dropdown-item[data-op="top"], a.dropdown-item[data-op="digest"], a.dropdown-item[data-op="announcement"]', function(e) {
	e.preventDefault();
	var op = $(this).data('op');
	if(op === 'top') {
		doBatch('top', { top: $(this).data('top') });
	} else if(op === 'digest') {
		doBatch('digest', { digest: $(this).data('digest') });
	} else if(op === 'announcement') {
		doBatch('announcement', { announcement: $(this).data('announcement') });
	}
});

// 移动帖子弹窗：确认按钮触发提交（doBatch 内已选版块，跳过二次确认）
var moveThreadModalEl = document.getElementById('moveThreadModal');
var moveThreadModal = moveThreadModalEl ? new bootstrap.Modal(moveThreadModalEl) : null;
if(moveThreadModalEl) {
	document.getElementById('moveThreadConfirmBtn').addEventListener('click', function() {
		doBatch('move');
	});
}

</script>
