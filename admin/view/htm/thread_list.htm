<script>
var jform = $('#form');
var jsubmit = $('#search');
var jsearch_result = $('#search_result_card');
var jfid = $('#fid');
var jcheckall = $('#checkall');
var jbatch_toolbar = $('#batch_toolbar');
var jbatch_btns = jbatch_toolbar.find('button[data-op]');
var jmove_forum = $('#move_forum');
var jpagesize = $('#pagesize_select');
var jorderby = $('#orderby_select');
var jresult_info = $('#result_info');
var jpagination = $('#pagination_area');

var queueid = '<?php echo $time;?>';
var threads = 0;
// 全表总帖子数（fid=0 时用于按当前 pagesize 重算 totalpage，修复 pagesize 不生效问题）
var totalThreads = <?php echo isset($threads) ? intval($threads) : 0;?>;
var pagesize = <?php echo $pagesize;?>;
var totalpage = <?php echo $totalpage;?>;
var pagearr = [];
var forumlist = <?php echo xn_json_encode($forumlist_simple);?>;
var currentFoundPage = 1;

// 从 localStorage 恢复 pagesize（修复刷新后无记忆问题）
try {
	var savedPagesize = parseInt(localStorage.getItem('admin_thread_pagesize'));
	if(savedPagesize && [20, 50, 100, 200].indexOf(savedPagesize) !== -1) {
		jpagesize.val(savedPagesize);
		pagesize = savedPagesize;
	}
} catch(e) {}

// 根据当前 fid 和 pagesize 重新计算扫描页数
function rebuildPageArr() {
	var curPs = parseInt(jpagesize.val()) || pagesize;
	var fid = jfid.val();
	if(fid == 0) {
		// 修复：fid=0 时按当前 pagesize 重算 totalpage（原代码复用 totalpage_back 导致 pagesize 切换无效）
		totalpage = Math.max(1, Math.ceil(totalThreads / curPs));
	} else if(forumlist[fid]) {
		var n = forumlist[fid]['threads'];
		totalpage = Math.max(1, Math.ceil(n / curPs));
	} else {
		totalpage = 1;
	}
	pagearr = [];
	for(var i=1; i <= totalpage; i++) pagearr.push(i);
}
rebuildPageArr();

// 加载搜索结果（带翻页，AJAX 不跳转）
function loadThreadResults(page) {
	page = page || 1;
	currentFoundPage = page;
	var ps = parseInt(jpagesize.val()) || 100;
	var url = <?php echo json_encode(route_url('admin_thread_found', ['page' => '__PAGE__']));?>.replace('__PAGE__', page) + '&pagesize=' + ps;
	$.get(url, function(html) {
		var $html = $('<div>').html(html.replace(/<script[\s\S]*?<\/script>/gi, ''));
		var $tbody = $html.find('tbody');
		if($tbody.length) {
			$('#thread_result_list').html($tbody.html());
		} else {
			$('#thread_result_list').html('<tr><td colspan="7" class="text-center py-4 text-secondary"><?php echo lang('no_search_result');?></td></tr>');
		}
		// 提取分页
		var $pagination = $html.find('.pagination');
		if($pagination.length) {
			jpagination.html($pagination);
		} else {
			jpagination.html('');
		}
		// 提取总数：仅当 queue 总数比当前 threads 大时才采纳（首次加载或重新搜索场景）
		// 批量删除后 threads 已被扣减，queue_count 仍为旧值，不能覆盖回去
		var totalText = $html.find('[data-total]').data('total');
		if(totalText) {
			var queueTotal = parseInt(totalText);
			if(queueTotal > threads) {
				threads = queueTotal;
			}
		}
		jresult_info.html('<?php echo lang('admin_thread_total_found');?>'.replace('{n}', '<b>' + threads + '</b>'));
		jbatch_toolbar.show();
		updateBatchButtons();
	});
}

// 拦截分页链接点击：AJAX 加载，避免跳转到独立 found 页面（修复第2页无工具栏问题）
jpagination.on('click', 'a.page-link', function(e) {
	e.preventDefault();
	var href = $(this).attr('href') || '';
	var match = href.match(/thread-found-(\d+)/);
	if(match) {
		loadThreadResults(parseInt(match[1], 10));
	}
});

jfid.on('change', function() {
	rebuildPageArr();
});

// 搜索
jsubmit.on('click', function() {
	jsubmit.button('loading');
	var postdata = jform.serializeObject();
	var url = jform.attr('action');
	// scan 后端 pagesize 来自 param('pagesize')，前端必须同步传当前 pagesize
	// 否则 pagearr 基于新 pagesize 计算 totalpage，但 scan 用默认 100 查询，会漏掉数据
	var scanPagesize = parseInt(jpagesize.val()) || pagesize;
	postdata.pagesize = scanPagesize;
	// 同步传 orderby 给 scan，让扫描按指定顺序推入队列
	postdata.orderby = jorderby.val();
	threads = 0;
	var completedPages = 0;
	$.each_sync(pagearr, function(i, callback) {
		var currentPage = pagearr[i];
		var currentPostdata = $.extend({}, postdata, {page: currentPage});
		$.xpost(url, currentPostdata, function(code, message) {
			completedPages++;
			if(parseInt(code) == 0) {
				var tids = message;
				threads += tids.length;
			} else {
				showToast(message, 'error');
			}
			// 所有页面扫描完毕
			if(completedPages >= pagearr.length) {
				jsubmit.button('reset');
				jsearch_result.show();
				jresult_info.html('<?php echo lang('admin_thread_total_found');?>'.replace('{n}', '<b>' + threads + '</b>'));
				if(threads > 0) {
					loadThreadResults(1);
				} else {
					$('#thread_result_list').html('<tr><td colspan="7" class="text-center py-4 text-secondary"><?php echo lang('no_search_result');?></td></tr>');
					jpagination.html('');
				}
				showToast('<?php echo lang('search_complete');?>', 'success');
			}
			callback();
		});
	});
	return false;
});

// 每页条数切换：保存到 localStorage + 重新计算 + 重新加载当前页
jpagesize.on('change', function() {
	// 保存到 localStorage（修复刷新后无记忆问题）
	try { localStorage.setItem('admin_thread_pagesize', $(this).val()); } catch(e) {}
	// 切换 pagesize 后重新计算扫描页数，确保下次搜索用新 pagesize
	rebuildPageArr();
	if(jsearch_result.is(':visible') && threads > 0) {
		loadThreadResults(1);
	}
});

// 全选/取消全选
jcheckall.on('change', function() {
	var checked = $(this).prop('checked');
	$('#thread_result_list input[name="modtid"]').prop('checked', checked);
	updateBatchButtons();
});

// 委托监听复选框变化
$('#thread_result_list').on('change', 'input[name="modtid"]', function() {
	updateBatchButtons();
});

// 更新批量按钮状态
function updateBatchButtons() {
	var checked = $('#thread_result_list input[name="modtid"]:checked');
	var total = $('#thread_result_list input[name="modtid"]');
	var count = checked.length;
	$('#selected_count').text(count + ' <?php echo lang('admin_thread_col_posts');?>');
	jbatch_btns.prop('disabled', count === 0);
	jmove_forum.prop('disabled', count === 0);
	// 全选状态同步
	jcheckall.prop('checked', total.length > 0 && count === total.length);
}

// 获取选中的 tid
function getSelectedTids() {
	var tids = [];
	$('#thread_result_list input[name="modtid"]:checked').each(function() {
		tids.push($(this).val());
	});
	return tids;
}

// 批量操作
jbatch_btns.on('click', function() {
	var op = $(this).data('op');
	var tids = getSelectedTids();
	if(tids.length === 0) {
		showToast('<?php echo lang('admin_thread_no_selection');?>', 'warning');
		return;
	}

	// 移动操作需要选择目标版块
	if(op === 'move') {
		var targetFid = jmove_forum.val();
		if(!targetFid) {
			jmove_forum.removeClass('d-none');
			showToast('<?php echo lang('admin_thread_please_select_forum');?>', 'warning');
			return;
		}
	}

	// 确认对话框
	var confirmMsg = '';
	if(op === 'close') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_close');?>';
	else if(op === 'open') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_open');?>';
	else if(op === 'delete') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_delete');?>';
	else if(op === 'announcement') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_announcement');?>';
	else if(op === 'top') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_top');?>';
	else if(op === 'digest') confirmMsg = '<?php echo lang('admin_thread_confirm_batch_digest');?>';
	else if(op === 'move') confirmMsg = '<?php echo lang('admin_thread_move_to_forum');?>';
	else return;

	XN.confirm(confirmMsg, function() {

	// 执行批量操作
	var url = '<?php echo admin_thread_batch_url();?>';
	var postdata = {
		tids: tids.join(','),
		op: op,
		csrf_token: $('input[name="csrf_token"]').val()
	};
	if(op === 'move') {
		postdata.target_fid = jmove_forum.val();
	}
	$.xpost(url, postdata, function(code, message) {
		if(parseInt(code) == 0) {
			// 删除操作会减少可见帖子数，同步更新 threads 计数避免 result_info 显示陈旧总数
			if(op === 'delete') {
				threads = Math.max(0, threads - tids.length);
			}
			showToast('<?php echo lang('admin_thread_batch_success');?>', 'success');
			loadThreadResults(currentFoundPage);
		} else {
			showToast(message || '<?php echo lang('admin_thread_batch_failed');?>', 'error');
		}
	});
	});
});

// 移动按钮点击时显示版块选择
jbatch_toolbar.find('button[data-op="move"]').on('click', function() {
	jmove_forum.toggleClass('d-none');
});

</script>
