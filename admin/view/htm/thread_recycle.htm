<script>
var recycleUrl = '<?php echo admin_thread_recycle_url(array('type'=>$type));?>';
var recycleType = '<?php echo $type;?>';
var csrf_token = '<?php echo CsrfService::getToken();?>';

// 筛选跳转
function doFilter() {
	var fid = $('#filter_fid').val();
	var keyword = $('#filter_keyword').val();
	var url = recycleUrl;
	var params = [];
	if(fid && fid != '0') params.push('fid=' + encodeURIComponent(fid));
	if(keyword) params.push('keyword=' + encodeURIComponent(keyword));
	if(params.length > 0) url += '&' + params.join('&');
	window.location.href = url;
	return false;
}

// 全选/取消全选
$('#checkall').on('change', function() {
	var checked = $(this).prop('checked');
	$('#item_list input[type="checkbox"]').prop('checked', checked);
	updateBatchButtons();
});

// 复选框变化
$('#item_list').on('change', 'input[type="checkbox"]', function() {
	updateBatchButtons();
});

// 更新批量按钮状态
function updateBatchButtons() {
	var checked = $('#item_list input[type="checkbox"]:checked');
	var total = $('#item_list input[type="checkbox"]');
	var count = checked.length;
	var label = recycleType === 'post' ? '<?php echo lang("admin_thread_col_posts");?>' : '<?php echo lang("admin_thread_col_subjects");?>';
	$('#selected_count').text(count + ' ' + label);
	$('#btn_restore').prop('disabled', count === 0);
	$('#btn_hard_delete').prop('disabled', count === 0);
	$('#checkall').prop('checked', total.length > 0 && count === total.length);
}

// 获取选中的 id（thread 用 tid，post 用 pid）
function getSelectedIds() {
	var ids = [];
	$('#item_list input[type="checkbox"]:checked').each(function() {
		ids.push($(this).val());
	});
	return ids;
}

// 执行操作
function doRecycleOp(op, ids, confirmMsg) {
	if(!ids || ids.length === 0) {
		showToast('<?php echo lang("admin_thread_no_selection");?>', 'warning');
		return;
	}

	var doAction = function() {
		var idField = recycleType === 'post' ? 'pids' : 'tids';
		var postdata = {};
		postdata[idField] = ids.join(',');
		postdata.op = op;
		postdata.csrf_token = csrf_token;
		$.xpost(recycleUrl, postdata, function(code, message) {
			if(parseInt(code) == 0) {
				showToast(message, 'success');
				setTimeout(function() { window.location.reload(); }, 800);
			} else {
				showToast(message || '<?php echo lang("admin_thread_batch_failed");?>', 'error');
			}
		});
	};

	if(confirmMsg) {
		XN.confirm(confirmMsg, doAction);
	} else {
		doAction();
	}
}

// 批量恢复
$('#btn_restore').on('click', function() {
	var ids = getSelectedIds();
	doRecycleOp('restore', ids, '<?php echo lang("admin_thread_restore");?>？');
});

// 批量彻底删除
$('#btn_hard_delete').on('click', function() {
	var ids = getSelectedIds();
	doRecycleOp('hard_delete', ids, $(this).data('confirm-text'));
});

// 单条操作
$('#item_list').on('click', 'button[data-op]', function() {
	var op = $(this).data('op');
	var id = $(this).data('id');
	var confirmMsg = op === 'hard_delete' ? $(this).data('confirm-text') : '<?php echo lang("admin_thread_restore");?>？';
	doRecycleOp(op, [id], confirmMsg);
});
</script>
