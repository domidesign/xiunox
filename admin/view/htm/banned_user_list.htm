<script>
// 搜索表单：构造路径风格 URL 跳转，与 admin/route/user.php 风格一致
(function(){
	var jkw = document.getElementById('keyword');
	var jbtn = document.getElementById('searchBtn');
	function buildSearchUrl(){
		var kw = jkw.value.trim();
		// 空关键字回到第一页，避免 URL 出现空段
		return xn.url('banned_user-list-' + xn.urlencode(kw) + '-1');
	}
	jbtn.addEventListener('click', function(){ window.location = buildSearchUrl(); });
	jkw.addEventListener('keydown', function(e){ if(e.keyCode === 13){ e.preventDefault(); window.location = buildSearchUrl(); } });
})();
</script>
