<!-- 搜索表单JS：修复GET表单导致URL双问号问题 -->
<script>
function doSearch() {
    var base = '<?php echo admin_log_url('attach');?>';
    var params = [];
    var uid = document.querySelector('[name="uid"]').value;
    if(uid) params.push('uid=' + encodeURIComponent(uid));
    var log_action = document.querySelector('[name="log_action"]').value;
    if(log_action) params.push('log_action=' + encodeURIComponent(log_action));
    var date_start = document.querySelector('[name="date_start"]').value;
    if(date_start) params.push('date_start=' + encodeURIComponent(date_start));
    var date_end = document.querySelector('[name="date_end"]').value;
    if(date_end) params.push('date_end=' + encodeURIComponent(date_end));
    window.location.href = base + (params.length ? '&' + params.join('&') : '');
    return false;
}
</script>
