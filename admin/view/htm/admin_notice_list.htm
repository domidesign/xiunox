<script>
// ponytail: 原生 JS 改造，移除对 $/XN. 的依赖
var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
function xpost(url, data, callback) {
	var body = data;
	var headers = {'X-Requested-With': 'XMLHttpRequest', 'X-CSRF-Token': csrfToken};
	if (typeof data === 'object' && !(data instanceof FormData)) {
		var params = new URLSearchParams();
		for (var k in data) { if (Object.prototype.hasOwnProperty.call(data, k)) params.append(k, data[k]); }
		body = params.toString();
	}
	if (typeof body === 'string') headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
	fetch(url, {method: 'POST', headers: headers, body: body, credentials: 'same-origin'})
		.then(function(r) { return r.json(); })
		.then(function(json) { callback(json.code, json.message); })
		.catch(function(err) { callback(-1, err.message || 'Request failed'); });
}

var navItem = document.querySelector('#nav li.nav-item-notice');
if (navItem) navItem.classList.add('active');

// 删除
document.querySelectorAll('.confirm').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var nid = this.getAttribute('data-nid');
		var postdata = {nid: nid, csrf_token: '<?php echo $header["csrf_token"];?>'};
		if (confirm('<?php echo lang('admin_confirm_delete_question')?>')) {
			xpost(xn.url('notice-delete'), postdata, function(code, message) {
				if(code != 0) return showToast(message, 'error');
				window.location.reload();
			});
		}
	});
});

// 全局公告 tab：首次切换时加载公告列表
var announcementLoaded = false;
document.querySelector('button[data-bs-target="#tab-announcement-list"]').addEventListener('shown.bs.tab', function() {
    if(announcementLoaded) return;
    var container = document.getElementById('announcement-list-content');
    fetch('<?php echo admin_notice_list_url('announcement');?>', {
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    }).then(function(r) { return r.text(); }).then(function(html) {
        container.innerHTML = html;
        announcementLoaded = true;
        bindAnnouncementDelete();
    }).catch(function() {
        container.innerHTML = '<p class="text-body-secondary small"><?php echo lang('admin_load_failed');?></p>';
    });
});

// 公告列表中的删除按钮
function bindAnnouncementDelete() {
    document.querySelectorAll('#announcement-list-content .confirm').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var nid = this.getAttribute('data-nid');
            if(!nid) return;
            if (confirm('<?php echo lang('admin_confirm_delete_question');?>')) {
                var csrfTok = document.querySelector('meta[name="csrf-token"]');
                var data = {nid: nid, csrf_token: csrfTok ? csrfTok.getAttribute('content') : ''};
                fetch('<?php echo admin_notice_delete_url();?>', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest'},
                    body: Object.keys(data).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(data[k]); }).join('&')
                }).then(function(r) { return r.json(); }).then(function(json) {
                    if(parseInt(json.code) === 0) {
                        var item = document.getElementById('announcement-item-' + nid);
                        if(item) item.remove();
                        showToast('<?php echo lang('admin_delete_success');?>', 'success');
                    } else {
                        showToast(json.message || '<?php echo lang('admin_delete_failed');?>', 'error');
                    }
                }).catch(function() {
                    showToast('<?php echo lang('admin_request_failed');?>', 'error');
                });
            }
        });
    });
}

</script>
