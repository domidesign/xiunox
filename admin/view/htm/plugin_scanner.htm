<script>
var scanData = [];

function startScan() {
	var spinner = document.getElementById('scanSpinner');
	var statusEl = document.getElementById('scanStatus');
	var noRes = document.getElementById('noResults');
	var resultsDiv = document.getElementById('scanResults');
	var errorDiv = document.getElementById('scanError');
	var pluginDir = document.getElementById('pluginFilter').value;

	noRes.classList.add('d-none');
	resultsDiv.classList.add('d-none');
	errorDiv.classList.add('d-none');
	spinner.classList.remove('d-none');
	statusEl.textContent = '<?php echo lang('plugin_scanner_scanning');?>';

	var url = '<?php echo admin_plugin_scanner_do_url();?>';
	if (pluginDir) {
		url += '?dir=' + encodeURIComponent(pluginDir);
	}

	fetch(url)
		.then(function(res) { return res.json(); })
		.then(function(data) {
			spinner.classList.add('d-none');
			if (!data || (data.error)) {
				statusEl.textContent = '<?php echo lang('plugin_scanner_error');?>';
				document.getElementById('scanErrorMsg').textContent = data ? data.error : '<?php echo lang('plugin_scanner_server_empty');?>';
				errorDiv.classList.remove('d-none');
				noRes.classList.remove('d-none');
				return;
			}
			scanData = data;
			renderResults(data);
			resultsDiv.classList.remove('d-none');
			statusEl.textContent = '<?php echo lang('plugin_scanner_scan_done');?>';
		})
		.catch(function(err) {
			spinner.classList.add('d-none');
			statusEl.textContent = '<?php echo lang('plugin_scanner_scan_failed');?>';
			var msg = '<?php echo lang('plugin_scanner_request_failed');?>';
			msg += '<?php echo lang('plugin_scanner_server_abnormal');?>';
			document.getElementById('scanErrorMsg').textContent = msg;
			errorDiv.classList.remove('d-none');
			noRes.classList.remove('d-none');
		});
}

function renderResults(data) {
	var totalIssues = 0;
	var totalFatal = 0;
	var totalWarning = 0;
	var pluginsWithIssues = 0;
	data.forEach(function(p) {
		totalIssues += p.total;
		totalFatal += p.fatal;
		totalWarning += p.warning;
		if (p.total > 0) pluginsWithIssues++;
	});

	var isSinglePlugin = data.length === 1;
	var alertClass = totalFatal > 0 ? 'alert-danger' : (totalWarning > 0 ? 'alert-warning' : 'alert-success');
	var icon = totalFatal > 0 ? 'alert-triangle' : (totalWarning > 0 ? 'exclamation-circle' : 'circle-check');
	var summaryHtml = '<div class="alert ' + alertClass + ' py-2 fs-6">';
	summaryHtml += '<i class="ti ti-' + icon + '"></i> ';
	if (isSinglePlugin && data[0]) {
		summaryHtml += '<b>' + data[0].name + '</b> (' + data[0].dir + ') ';
		summaryHtml += '<?php echo lang('plugin_scanner_found');?> <b>' + totalIssues + '</b><?php echo lang('plugin_scanner_issues_unit');?>';
	} else {
		summaryHtml += '<?php echo lang('plugin_scanner_scanned');?> ' + data.length + '<?php echo lang('plugin_scanner_plugins_count');?>' + pluginsWithIssues + '<?php echo lang('plugin_scanner_issues_count');?> <b>' + totalIssues + '</b><?php echo lang('plugin_scanner_issues_unit');?>';
	}
	if(totalFatal > 0) summaryHtml += '（<span class="fw-bold text-danger">' + totalFatal + '<?php echo lang('plugin_scanner_fatal_count');?></span>';
	if(totalWarning > 0) summaryHtml += ' <span class="fw-bold text-warning">' + totalWarning + '<?php echo lang('plugin_scanner_warning_count');?></span>';
	if(totalFatal > 0 || totalWarning > 0) summaryHtml += '）';
	summaryHtml += '</div>';
	document.getElementById('scanSummary').innerHTML = summaryHtml;

	var bodyHtml = '';
	data.forEach(function(plugin) {
		if(plugin.total === 0) return;
		var issues = plugin.issues;
		issues.forEach(function(issue) {
			var sevClass = issue.severity === 'fatal' ? 'bg-danger' : (issue.severity === 'warning' ? 'bg-warning text-dark' : (issue.severity === 'medium' ? 'bg-primary' : 'bg-secondary'));
			var sevText = issue.severity === 'fatal' ? '<?php echo lang('plugin_scanner_fatal');?>' : (issue.severity === 'warning' ? '<?php echo lang('plugin_scanner_warning');?>' : (issue.severity === 'medium' ? '<?php echo lang('plugin_scanner_medium');?>' : '<?php echo lang('plugin_scanner_info');?>'));

			bodyHtml += '<tr data-severity="' + issue.severity + '">';
			bodyHtml += '<td><span class="fw-semibold">' + plugin.dir + '</span><br><small class="text-secondary">' + plugin.name + '</small></td>';
			bodyHtml += '<td class="fs-6">' + plugin.version + '</td>';
			bodyHtml += '<td class="fs-6"><code>' + issue.file + '</code></td>';
			bodyHtml += '<td class="fs-6 text-center">' + (issue.line || '-') + '</td>';
			bodyHtml += '<td><span class="badge ' + sevClass + ' ">' + sevText + '</span></td>';
			bodyHtml += '<td class="fs-6"><code class="break-all" style="font-size:0.75rem">' + escapeHtml(issue.context || issue.match) + '</code></td>';
			bodyHtml += '<td class="fs-6"><span class="text-body">' + escapeHtml(issue.suggestion) + '</span></td>';
			bodyHtml += '</tr>';
		});
	});

	if(bodyHtml === '') {
		bodyHtml = '<tr><td colspan="7" class="text-center text-success py-4"><i class="ti ti-circle-check fs-5"></i> <?php echo lang('plugin_scanner_all_pass');?></td></tr>';
	}

	document.getElementById('resultBody').innerHTML = bodyHtml;
	filterResults();
}

function filterResults() {
	var filter = document.getElementById('severityFilter').value;
	var rows = document.querySelectorAll('#resultBody tr');
	rows.forEach(function(row) {
		if(filter === 'all') {
			row.style.display = '';
		} else {
			var sev = row.getAttribute('data-severity');
			row.style.display = (sev === filter) ? '' : 'none';
		}
	});
}

function exportCSV() {
	var pluginDir = document.getElementById('pluginFilter').value;
	var url = '<?php echo admin_plugin_scanner_export_url();?>';
	if (pluginDir) {
		url += '?dir=' + encodeURIComponent(pluginDir);
	}
	window.location.href = url;
}

function escapeHtml(str) {
	if (!str) return '';
	return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
