<script>
// 表单提交（防重复点击 + toast 反馈）
var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
var seoForm = document.getElementById('seoForm');
var submitBtn = document.getElementById('submitBtn');

seoForm.addEventListener('submit', function(e) {
	e.preventDefault();
	if(submitBtn.disabled) return;
	submitBtn.disabled = true;
	submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' + '<?php echo lang('submiting');?>...';

	var formData = new FormData(seoForm);

	fetch(seoForm.action, {
		method: 'POST',
		body: formData,
		headers: {'X-Requested-With': 'XMLHttpRequest'},
		credentials: 'same-origin'
	})
	.then(function(res) { return res.json(); })
	.then(function(data) {
		if(parseInt(data.code) === 0) {
			showToast(data.message, 'success');
			setTimeout(function() { window.location.reload(); }, 1200);
		} else {
			showToast(data.message, 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<?php echo lang('confirm');?>';
		}
	})
	.catch(function(err) {
		showToast('<?php echo lang('admin_request_failed_retry');?>', 'error');
		submitBtn.disabled = false;
		submitBtn.innerHTML = '<?php echo lang('confirm');?>';
	});
});
</script>

<!--{hook admin_setting_seo_js.htm}-->
