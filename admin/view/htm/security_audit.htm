<script>
var csrf_token = '<?php echo $header["csrf_token"];?>';

// 标签页切换
$('#audit-tabs .nav-link').on('click', function() {
    $('#audit-tabs .nav-link').removeClass('active');
    $(this).addClass('active');
    $('.audit-tab-content').hide();
    $('#tab-' + $(this).data('tab')).show();
});

// 审核通过（帖子/回帖）
$('.audit-approve').on('click', function() {
    var type = $(this).data('type');
    var id = $(this).data('id');
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'approve', target_type: type, target_id: id}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 800);
        } else { showToast(message, 'error'); }
    });
});

// 审核驳回（帖子/回帖）
$('.audit-reject').on('click', function() {
    var type = $(this).data('type');
    var id = $(this).data('id');
    var reason = prompt('<?php echo lang('admin_reject_reason_prompt')?>');
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'reject', target_type: type, target_id: id, reason: reason || ''}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 800);
        } else { showToast(message, 'error'); }
    });
});

// 全选
$('#select-all-thread').on('change', function() {
    $('.thread-check').prop('checked', this.checked);
});
$('#select-all-post').on('change', function() {
    $('.post-check').prop('checked', this.checked);
});

// 批量通过 - 帖子
$('#batch-approve-thread').on('click', function() {
    var ids = [];
    $('.thread-check:checked').each(function(){ ids.push($(this).val()); });
    if(ids.length === 0) { showToast('<?php echo lang('admin_please_select_first')?>', 'warning'); return; }
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'batch_approve', target_type: 'thread', ids: ids}, function(code, message) {
        if(code == 0) { showToast(message, 'success'); setTimeout(function(){ location.reload(); }, 800); }
        else { showToast(message, 'error'); }
    });
});

// 批量通过 - 回帖
$('#batch-approve-post').on('click', function() {
    var ids = [];
    $('.post-check:checked').each(function(){ ids.push($(this).val()); });
    if(ids.length === 0) { showToast('<?php echo lang('admin_please_select_first')?>', 'warning'); return; }
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'batch_approve', target_type: 'post', ids: ids}, function(code, message) {
        if(code == 0) { showToast(message, 'success'); setTimeout(function(){ location.reload(); }, 800); }
        else { showToast(message, 'error'); }
    });
});

// 资料审核通过
$('.audit-profile-approve').on('click', function() {
    var id = $(this).data('id');
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'profile_approve', audit_id: id}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 800);
        } else { showToast(message, 'error'); }
    });
});

// 资料审核驳回
$('.audit-profile-reject').on('click', function() {
    var id = $(this).data('id');
    var reason = prompt('<?php echo lang('admin_reject_reason_prompt')?>');
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'profile_reject', audit_id: id, reason: reason || ''}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 800);
        } else { showToast(message, 'error'); }
    });
});

// 资料全选
$('#select-all-profile').on('change', function() {
    $('.profile-check').prop('checked', this.checked);
});

// 资料批量通过
$('#batch-approve-profile').on('click', function() {
    var ids = [];
    $('.profile-check:checked').each(function(){ ids.push($(this).val()); });
    if(ids.length === 0) { showToast('<?php echo lang('admin_please_select_first')?>', 'warning'); return; }
    $.xpost('<?php echo url('security-audit');?>', {csrf_token: csrf_token, audit_action: 'profile_batch_approve', ids: ids}, function(code, message) {
        if(code == 0) { showToast(message, 'success'); setTimeout(function(){ location.reload(); }, 800); }
        else { showToast(message, 'error'); }
    });
});
</script>
