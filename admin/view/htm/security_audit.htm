<script>
var csrf_token = <?php echo json_encode($header['csrf_token'] ?? '');?>;

// 标签页切换（使用 URL hash 保持刷新后状态）
function switchAuditTab(tabName) {
    $('#audit-tabs .nav-link').removeClass('active');
    $('#audit-tabs .nav-link[data-tab="' + tabName + '"]').addClass('active');
    $('.audit-tab-content').hide();
    $('#tab-' + tabName).show();
    if(history.replaceState) {
        history.replaceState(null, '', '#' + tabName);
    }
}

$('#audit-tabs .nav-link').on('click', function(e) {
    e.preventDefault();
    var tab = $(this).data('tab');
    if(tab) switchAuditTab(tab);
});

// 页面加载时根据 URL hash 恢复 tab
(function() {
    var hash = location.hash.replace('#', '');
    var validTabs = ['threads', 'comments', 'profiles'];
    if(hash && validTabs.indexOf(hash) !== -1) {
        switchAuditTab(hash);
    }
})();

// 审核通过（帖子/回帖）
$('.audit-approve').on('click', function() {
    var type = $(this).data('type');
    var id = $(this).data('id');
    $.xpost('<?php echo admin_security_url('audit');?>', {csrf_token: csrf_token, audit_action: 'approve', target_type: type, target_id: id}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 1000);
        } else { showToast(message, 'error'); }
    });
});

// 审核驳回（帖子/回帖）
$('.audit-reject').on('click', function() {
    var type = $(this).data('type');
    var id = $(this).data('id');
    var reason = prompt('<?php echo lang('admin_reject_reason_prompt')?>');
    $.xpost('<?php echo admin_security_url('audit');?>', {csrf_token: csrf_token, audit_action: 'reject', target_type: type, target_id: id, reason: reason || ''}, function(code, message) {
        if(code == 0) {
            showToast(message, 'success');
            setTimeout(function(){ location.reload(); }, 1000);
        } else { showToast(message, 'error'); }
    });
});

// 全选
$('#select-all-thread').on('change', function() {
    $('.thread-check').prop('checked', this.checked);
});
$('#select-all-post').on('change', function() {
    $('.post-check').prop('checked', this.checked);
});

// 批量通过 - 帖子
$('#batch-approve-thread').on('click', function() {
    var ids = [];
    $('.thread-check:checked').each(function(){ ids.push($(this).val()); });
    if(ids.length === 0) { showToast('<?php echo lang('admin_please_select_first')?>', 'warning'); return; }
    $.xpost('<?php echo admin_security_url('audit');?>', {csrf_token: csrf_token, audit_action: 'batch_approve', target_type: 'thread', ids: ids}, function(code, message) {
        if(code == 0) { showToast(message, 'success'); setTimeout(function(){ location.reload(); }, 1000); }
        else { showToast(message, 'error'); }
    });
});

// 批量通过 - 回帖
$('#batch-approve-post').on('click', function() {
    var ids = [];
    $('.post-check:checked').each(function(){ ids.push($(this).val()); });
    if(ids.length === 0) { showToast('<?php echo lang('admin_please_select_first')?>', 'warning'); return; }
    $.xpost('<?php echo admin_security_url('audit');?>', {csrf_token: csrf_token, audit_action: 'batch_approve', target_type: 'post', ids: ids}, function(code, message) {
        if(code == 0) { showToast(message, 'success'); setTimeout(function(){ location.reload(); }, 1000); }
        else { showToast(message, 'error'); }
    });
});

// 资料审核通过
$('.audit-profile-approve').on('click', function() {
    var id = $(this).data('id');
    $.xpost('<?php echo admin_security_url('audit');?>', {csrf_token: csrf_token, audit_action: 'profile_approve', audit_id: id}, function(code, message) {
