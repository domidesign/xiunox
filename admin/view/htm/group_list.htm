<script>

var maxgid = <?php echo $maxgid;?>;

var jform = document.getElementById('form');
var jsubmit = document.getElementById('submit');

jform.addEventListener('submit', function(e) {
	e.preventDefault();
	jsubmit.disabled = true;
	jsubmit.textContent = '<?php echo lang('submiting');?>...';
	var postdata = new FormData(jform);

	fetch(jform.action, {
		method: 'POST',
		body: postdata,
		headers: { 'X-Requested-With': 'XMLHttpRequest' }
	})
	.then(function(r) { return r.text(); })
	.then(function(text) {
		var res;
		try { res = JSON.parse(text); } catch(e) { return; }
		if (parseInt(res.code) == 0) {
			showToast(res.message, 'success');
			setTimeout(function() { window.location.href = window.location.href; }, 1500);
		} else {
			showToast(res.message, 'error');
			jsubmit.disabled = false;
			jsubmit.textContent = '<?php echo lang('confirm');?>';
		}
	})
	.catch(function(err) {
		showToast(<?php echo json_encode(lang('admin_request_failed'));?>, 'error');
		jsubmit.disabled = false;
		jsubmit.textContent = '<?php echo lang('confirm');?>';
	});
});

// 删除按钮
document.querySelector('.arrlist').addEventListener('click', function(e) {
	var deleteBtn = e.target.closest('a.row_delete');
	if (deleteBtn) {
		var row = deleteBtn.closest('.group-item');
		if (row) row.remove();
	}
});

// 添加行
document.querySelector('a.row_add').addEventListener('click', function(e) {
	e.preventDefault();
	var arrlist = document.querySelector('.arrlist');
	var lastItem = arrlist.querySelector('.group-item:last-child');
	var clone = lastItem.cloneNode(true);
	arrlist.appendChild(clone);
	var rowid = ++maxgid;

	// 更新 rowid
	clone.setAttribute('rowid', rowid);

	// 更新图标为默认图标
	var iconSpan = clone.querySelector('.icon-preview-span');
	if (iconSpan) iconSpan.innerHTML = '<i class="ti ti-circle-dot text-body-secondary"></i>';

	// 清空输入框（gid 输入框保持 readonly，由后端自动分配）
	var inputs = clone.querySelectorAll('input');
	inputs.forEach(function(inp) {
		if (inp.name && inp.name.indexOf('_gid') !== -1) {
			inp.value = rowid;
			inp.setAttribute('readonly', 'readonly');
			inp.classList.add('bg-light', 'text-body-secondary');
		} else {
			inp.value = '';
			inp.classList.remove('bg-light', 'text-body-secondary');
		}
		// 更新 name 属性中的索引
		var match = inp.name.match(/\[(\d+)\]/);
		if (match) {
			inp.name = inp.name.replace(/\[\d+\]/, '[' + rowid + ']');
		}
	});
});

</script>
