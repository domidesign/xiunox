<script>
// 驱动选择联动
document.querySelectorAll('.cache-driver-radio').forEach(function(radio) {
    radio.addEventListener('change', function() {
        document.querySelectorAll('.driver-config').forEach(function(el) {
            el.style.display = 'none';
        });
        var type = this.value;
        var configEl = document.getElementById(type + '-config');
        if(configEl) configEl.style.display = 'block';
    });
});

// 测试连接
document.getElementById('btn-test-conn').addEventListener('click', function() {
    var form = document.getElementById('cache-setting-form');
    var formData = new FormData(form);
    formData.append('act', 'test_connection');

    var selectedType = document.querySelector('.cache-driver-radio:checked');
    if(!selectedType) return;
    formData.set('type', selectedType.value);

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader me-1"></i><?php echo lang('submiting');?>...';

    fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        var type = parseInt(data.code) === 0 ? 'success' : 'error';
        if(typeof showToast === 'function') {
            showToast(data.message, type);
        } else {
            var msgEl = document.getElementById('cache-msg');
            var alertType = parseInt(data.code) === 0 ? 'success' : 'danger';
            msgEl.innerHTML = '<div class="alert alert-' + alertType + ' alert-dismissible fade show" role="alert">' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-plug me-1"></i><?php echo lang('admin_cache_test_conn');?>';
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-plug me-1"></i><?php echo lang('admin_cache_test_conn');?>';
    });
});

// 表单提交
document.getElementById('cache-setting-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = this;
    var formData = new FormData(form);
    var btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader me-1"></i><?php echo lang('submiting');?>...';

    fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        var type = parseInt(data.code) === 0 ? 'success' : 'error';
        if(typeof showToast === 'function') {
            showToast(data.message, type);
        } else {
            var msgEl = document.getElementById('cache-msg');
            var alertType = parseInt(data.code) === 0 ? 'success' : 'danger';
            msgEl.innerHTML = '<div class="alert alert-' + alertType + ' alert-dismissible fade show" role="alert">' + data.message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-device-floppy me-1"></i><?php echo lang('confirm');?>';
    })
    .catch(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-device-floppy me-1"></i><?php echo lang('confirm');?>';
    });
});
</script>
