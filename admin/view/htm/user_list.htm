<script>
// ponytail: 原生 JS 改造，移除对 $/XN. 的依赖
var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
function xpost(url, data, callback) {
	var body = data;
	var headers = {'X-Requested-With': 'XMLHttpRequest', 'X-CSRF-Token': csrfToken};
	if (typeof data === 'object' && !(data instanceof FormData)) {
		var params = new URLSearchParams();
		for (var k in data) { if (Object.prototype.hasOwnProperty.call(data, k)) params.append(k, data[k]); }
		body = params.toString();
	}
	if (typeof body === 'string') headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
	fetch(url, {method: 'POST', headers: headers, body: body, credentials: 'same-origin'})
		.then(function(r) { return r.json(); })
		.then(function(json) { callback(json.code, json.message); })
		.catch(function(err) { callback(-1, err.message || 'Request failed'); });
}
// 获取已勾选的用户行 checkbox 数组
function getCheckedUsers() {
	return Array.prototype.filter.call(document.querySelectorAll('#userlist input[name="delete"]'), function(cb) { return cb.checked; });
}

var userbody = document.getElementById('userbody');
var createBtn = document.getElementById('create');
var confirmBtn = document.getElementById('confirm');
var searchBtn = document.getElementById('search');
var srchtypeEl = document.getElementById('srchtype');
var keywordEl = document.getElementById('keyword');
var userlistEl = document.getElementById('userlist');
var banTypeFilterEl = document.getElementById('banTypeFilter');
if (srchtypeEl && srchtypeEl.getAttribute('value')) srchtypeEl.value = srchtypeEl.getAttribute('value');

// ponytail: createBtn 可能为 null（页面无创建用户按钮时），必须判空避免 TypeError 中断整个脚本
if (createBtn) {
	createBtn.addEventListener('click', function(event) {
		window.location = xn.url('user-create');
	});
}

function buildSearchUrl() {
	var srchtype = srchtypeEl.value;
	srchtype = srchtype ? srchtype : 'uid';
	var keyword = keywordEl.value;
	var banType = banTypeFilterEl.value;
	var url = xn.url('user-list-'+srchtype+'-'+xn.urlencode(keyword)+'-1');
	if(banType !== '') url += '?ban_type=' + banType;
	return url;
}

searchBtn.addEventListener('click', function(){
	window.location = buildSearchUrl();
});
keywordEl.addEventListener('keydown', function(e) {
	if(e.keyCode == 13) searchBtn.click();
});
banTypeFilterEl.addEventListener('change', function(){
	window.location = buildSearchUrl();
});

var deleteModalEl = document.getElementById('confirmDeleteModal');
var deleteModal = deleteModalEl ? new bootstrap.Modal(deleteModalEl) : null;
var pendingDeleteChecked = null;

confirmBtn.addEventListener('click', function(){
	var checkedArr = getCheckedUsers();
	if(checkedArr.length < 1) return showToast("<?php echo lang('please_check_delete_user');?>", 'error');
	pendingDeleteChecked = checkedArr;
	if(deleteModal) {
		deleteModal.show();
	} else {
		XN.confirm("<?php echo lang('user_delete_confirm');?>", function() { executeDelete(checkedArr); }, {type: 'danger'});
	}
});

function executeDelete(checkedArr, action) {
	// action: 'delete'（匿名化）或 'purge'（彻底删除）
	action = action || 'delete';
	var successCount = 0, failCount = 0, total = checkedArr.length;
	checkedArr.forEach(function(cb) {
		var tr = cb.closest('tr');
		var uid = tr.getAttribute('uid');
		if(uid == 1) { failCount++; showToast('<?php echo lang('user_admin_cant_be_deleted');?>', 'error'); return; }
		xpost(xn.url('user-' + action), {uid:uid, csrf_token: csrfToken}, function(code, message) {
			if(code == 0) { successCount++; tr.remove(); } else { failCount++; showToast(message, 'error'); }
			if(successCount + failCount >= total) {
				var msg = action === 'purge' ? '<?php echo lang('admin_user_batch_purge_done');?>' : '<?php echo lang('admin_user_batch_anonymize_done');?>';
				showToast(msg + successCount + '/' + total, successCount > 0 ? 'success' : 'error');
				if(successCount > 0) setTimeout(function(){ window.location.reload(); }, 1000);
			}
		});
	});
}

if(document.getElementById('confirmAnonymizeBtn')) {
	document.getElementById('confirmAnonymizeBtn').addEventListener('click', function() {
		if(pendingDeleteChecked) {
			executeDelete(pendingDeleteChecked, 'delete');
			pendingDeleteChecked = null;
		}
		if(deleteModal) deleteModal.hide();
	});
}
if(document.getElementById('confirmPurgeBtn')) {
	document.getElementById('confirmPurgeBtn').addEventListener('click', function() {
		if(pendingDeleteChecked) {
			executeDelete(pendingDeleteChecked, 'purge');
			pendingDeleteChecked = null;
		}
		if(deleteModal) deleteModal.hide();
	});
}

// 全选/取消全选
var checkAll = document.getElementById('checkAll');
if(checkAll) {
	checkAll.addEventListener('change', function() {
		var checkboxes = document.querySelectorAll('#userlist input[name="delete"]');
		checkboxes.forEach(function(cb) { cb.checked = checkAll.checked; });
	});
}

// 快速禁言 7 天
document.querySelectorAll('.quick-ban-btn').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var uid = this.getAttribute('data-uid');
		XN.confirm('<?php echo lang('admin_user_quick_silence_7d_confirm');?>', function() {
			xpost(xn.url('user-ban'), {
				uid: uid,
				ban_type: 1,
				duration: 604800,
				reason: '<?php echo lang('user_ban_quick_silence_reason');?>',
				csrf_token: csrfToken
			}, function(code, message) {
				if(code == 0) {
					showToast(message, 'success');
					setTimeout(function(){ window.location.reload(); }, 800);
				} else {
					showToast(message, 'error');
				}
			});
		}, {type: 'warning'});
	});
});

// 批量封禁
var batchBanModalEl = document.getElementById('batchBanModal');
var batchBanModal = batchBanModalEl ? new bootstrap.Modal(batchBanModalEl) : null;
document.getElementById('batchBanBtn').addEventListener('click', function() {
	var checkedArr = getCheckedUsers();
	if(checkedArr.length < 1) return showToast('<?php echo lang('admin_user_batch_select_users');?>', 'error');
	if(batchBanModal) batchBanModal.show();
});

document.getElementById('batchBanConfirmBtn').addEventListener('click', function() {
	var checkedArr = getCheckedUsers();
	var ban_type = document.querySelector('#batchBanForm [name="ban_type"]').value;
	var duration = document.querySelector('#batchBanForm [name="duration"]').value;
	var reason = document.querySelector('#batchBanForm [name="reason"]').value;
	var successCount = 0, failCount = 0, total = checkedArr.length;
	checkedArr.forEach(function(cb) {
		var tr = cb.closest('tr');
		var uid = tr.getAttribute('uid');
		xpost(xn.url('user-ban'), {
			uid: uid, ban_type: ban_type, duration: duration, reason: reason, csrf_token: csrfToken
		}, function(code, message) {
			if(code == 0) { successCount++; } else { failCount++; }
			if(successCount + failCount >= total) {
				if(batchBanModal) batchBanModal.hide();
				showToast('<?php echo lang('admin_user_batch_ban_done');?>' + successCount + '/' + total, successCount > 0 ? 'success' : 'error');
				setTimeout(function(){ window.location.reload(); }, 1000);
			}
		});
	});
});

// 批量解禁
document.getElementById('batchUnbanBtn').addEventListener('click', function() {
	var checkedArr = getCheckedUsers();
	if(checkedArr.length < 1) return showToast('<?php echo lang('admin_user_batch_select_users');?>', 'error');
	XN.confirm('<?php echo lang('admin_user_batch_unban_confirm');?>', function() {
			var successCount = 0, failCount = 0, total = checkedArr.length;
			checkedArr.forEach(function(cb) {
				var tr = cb.closest('tr');
				var uid = tr.getAttribute('uid');
				xpost(xn.url('user-unban'), {uid: uid, csrf_token: csrfToken}, function(code, message) {
					if(code == 0) { successCount++; } else { failCount++; }
					if(successCount + failCount >= total) {
						showToast('<?php echo lang('admin_user_batch_unban_done');?>' + successCount + '/' + total, successCount > 0 ? 'success' : 'error');
						setTimeout(function(){ window.location.reload(); }, 1000);
					}
				});
			});
		}, {type: 'warning'});
});

</script>
