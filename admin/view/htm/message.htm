<?php include _include(ADMIN_PATH.'view/htm/header.inc.htm');?>

<!--{hook admin_message_start.htm}-->

<?php
// 解析 jump() 生成的跳转 URL
$_redirect_url = '';
$_clean_msg = is_array($message) ? print_r($message, 1) : $message;
if(is_string($message) && preg_match('/window\.location=[\'"]([^\'"]+)[\'"]/', $message, $m)) {
	$_redirect_url = $m[1];
	$_clean_msg = strip_tags($message);
}
$_toast_type = ($code == 0) ? 'success' : 'error';
// PRG 模式下，成功无跳转已由 message() 函数 303 重定向处理
// 此处仅处理：有 jump() 跳转的成功消息 + 错误消息
$_need_redirect = !empty($_redirect_url);
?>

<?php if(!$_need_redirect): ?>
<!-- 错误提示（无跳转）：显示简洁错误信息，不自动跳转 -->
<div class="d-flex justify-content-center align-items-center" style="min-height:50vh;">
	<div class="text-center">
		<i class="ti ti-alert-circle fs-1 text-danger mb-3"></i>
		<div class="text-body-secondary"><?php echo htmlspecialchars($_clean_msg, ENT_QUOTES, 'UTF-8');?></div>
		<button class="btn btn-outline-secondary btn-sm mt-3" onclick="history.back()"><?php echo lang('back');?></button>
	</div>
</div>
<?php endif; ?>

<!--{hook admin_message_end.htm}-->

<?php include _include(ADMIN_PATH.'view/htm/footer.inc.htm');?>

<script>
(function() {
	var msg = <?php echo json_encode($_clean_msg);?>;
	var type = <?php echo json_encode($_toast_type);?>;
	var redirect = <?php echo json_encode($_redirect_url);?>;

	if(typeof showToast === 'function') {
		showToast(msg, type);
	}

	// 有跳转 URL → 立即跳转（无需 loading 中间页）
	// 无跳转（错误）→ 停留显示错误，用户手动返回
	if(redirect) {
		window.location.href = redirect;
	}
})();
</script>

<!--{hook admin_message_js.htm}-->
