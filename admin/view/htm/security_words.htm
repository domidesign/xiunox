<script>
// 删除敏感词
document.querySelectorAll('.word-delete').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var word = this.getAttribute('data-word');
		XN.confirm('<?php echo lang('admin_confirm_delete_word')?>' + word + '？', function() {
			XN.post('<?php echo admin_security_url('words');?>', { word_action: 'delete', word: word }, function(code, message) {
				if(code == 0) {
					showToast(message, 'success');
					setTimeout(function(){ location.reload(); }, 800);
				} else {
					showToast(message, 'error');
				}
			});
		});
	});
});

// 清空全部
var clearBtn = document.getElementById('clear-btn');
if(clearBtn) {
	clearBtn.addEventListener('click', function() {
		XN.confirm('<?php echo lang('admin_confirm_clear_all_words')?>', function() {
			XN.post('<?php echo admin_security_url('words');?>', { word_action: 'clear' }, function(code, message) {
				if(code == 0) {
					showToast(message, 'success');
					setTimeout(function(){ location.reload(); }, 800);
				} else {
					showToast(message, 'error');
				}
			});
		});
	});
};

// 测试过滤
document.getElementById('test-btn').addEventListener('click', function() {
	var text = document.getElementById('test-text').value.trim();
	if(!text) return;
	var resultDiv = document.getElementById('test-result');
	var words = JSON.parse('<?php echo addslashes(json_encode($sensitive_words, JSON_UNESCAPED_UNICODE));?>');
	var matched = [];
	words.forEach(function(w) {
		if(text.indexOf(w) !== -1) matched.push(w);
	});
	if(matched.length > 0) {
		resultDiv.innerHTML = '<div class="alert alert-warning py-2 mb-0"><i class="ti ti-alert-triangle me-1"></i><?php echo lang('admin_filter_hit')?><strong>' + matched.join('、') + '</strong></div>';
	} else {
		resultDiv.innerHTML = '<div class="alert alert-success py-2 mb-0"><i class="ti ti-circle-check me-1"></i><?php echo lang('admin_filter_no_hit')?></div>';
	}
});

document.getElementById('test-text').addEventListener('keyup', function(e) {
	if(e.key === 'Enter') document.getElementById('test-btn').click();
});

// 批量导入表单
var jimportForm = $('#import-form');
jimportForm.on('submit', function() {
	var postdata = jimportForm.serialize();
	$.xpost(jimportForm.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ location.reload(); }, 800);
		} else {
			showToast(message, 'error');
		}
	});
	return false;
});

// 文件导入表单
var jfileForm = $('#file-import-form');
jfileForm.on('submit', function() {
	var formData = new FormData(this);
	var jsubmit = jfileForm.find('button[type="submit"]');
	jsubmit.button('loading');
	$.ajax({
		url: jfileForm.attr('action'),
		type: 'POST',
		data: formData,
		processData: false,
		contentType: false,
		success: function(r) {
			var s = xn.json_decode(r);
			if(s && s.code == 0) {
				showToast(s.message, 'success');
				setTimeout(function(){ location.reload(); }, 800);
			} else {
				showToast(s && s.message ? s.message : '<?php echo lang('admin_import_failed');?>', 'error');
			}
			jsubmit.button('reset');
		},
		error: function() {
			showToast('<?php echo lang('admin_request_failed');?>', 'error');
			jsubmit.button('reset');
		}
	});
	return false;
});
</script>
