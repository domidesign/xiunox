<script>
// 当前词库类型
var currentType = '<?php echo $word_type;?>';
// 预生成的两种词库 URL（避免手动拼接 & 在不同伪静态模式下出错）
var wordTypeUrls = {
	'sensitive': '<?php echo addslashes(admin_security_url('words', array('word_type'=>'sensitive')));?>',
	'reserved':  '<?php echo addslashes(admin_security_url('words', array('word_type'=>'reserved')));?>'
};

// Tab 切换：跳转页面并带上 word_type 参数
document.querySelectorAll('#wordTypeTab .nav-link').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var type = this.getAttribute('data-word-type');
		if(type === currentType) return;
		window.location.href = wordTypeUrls[type];
	});
});

// ponytail: 原生 JS ajax POST（替代 XN.post/$.xpost，不依赖 jQuery/XN shim）
function ajaxPost(url, data, cb) {
	var body = new URLSearchParams();
	for (var k in data) {
		if (Object.prototype.hasOwnProperty.call(data, k)) body.append(k, data[k]);
	}
	fetch(url, {
		method: 'POST',
		body: body.toString(),
		credentials: 'same-origin',
		headers: {
			'X-Requested-With': 'XMLHttpRequest',
			'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
		}
	}).then(function(res) { return res.text(); }).then(function(text) {
		var s = null;
		try { s = text ? JSON.parse(text) : null; } catch(e) {}
		var code = s && s.code !== undefined ? s.code : -1;
		var message = s && s.message !== undefined ? s.message : (text || '');
		if(cb) cb(code, message);
	}).catch(function() {
		if(cb) cb(-1, '<?php echo lang('admin_request_failed');?>');
	});
}

// 删除词
document.querySelectorAll('.word-delete').forEach(function(btn) {
	btn.addEventListener('click', function() {
		var word = this.getAttribute('data-word');
		XN.confirm('<?php echo lang('admin_confirm_delete_word')?>' + word + '？', function() {
			ajaxPost('<?php echo admin_security_url('words');?>', { word_action: 'delete', word: word, word_type: currentType }, function(code, message) {
				if(code == 0) {
					showToast(message, 'success');
					setTimeout(function(){ location.reload(); }, 1000);
				} else {
					showToast(message, 'error');
				}
			});
		}, {type: 'danger'});
	});
});

// 清空全部
var clearBtn = document.getElementById('clear-btn');
if(clearBtn) {
	clearBtn.addEventListener('click', function() {
		XN.confirm('<?php echo lang('admin_confirm_clear_all_words')?>', function() {
			ajaxPost('<?php echo admin_security_url('words');?>', { word_action: 'clear', word_type: currentType }, function(code, message) {
				if(code == 0) {
					showToast(message, 'success');
					setTimeout(function(){ location.reload(); }, 1000);
				} else {
					showToast(message, 'error');
				}
			});
		}, {type: 'danger'});
	});
};

// 测试过滤（同时测试两类词库）
document.getElementById('test-btn').addEventListener('click', function() {
	var text = document.getElementById('test-text').value.trim();
	if(!text) return;
	var resultDiv = document.getElementById('test-result');
	var reservedWords = JSON.parse('<?php echo addslashes(json_encode($reserved_words, JSON_UNESCAPED_UNICODE));?>');
	var sensitiveWords = JSON.parse('<?php echo addslashes(json_encode($content_words, JSON_UNESCAPED_UNICODE));?>');
	var hitReserved = [];
	var hitSensitive = [];
	reservedWords.forEach(function(w) { if(text.indexOf(w) !== -1) hitReserved.push(w); });
	sensitiveWords.forEach(function(w) { if(text.indexOf(w) !== -1) hitSensitive.push(w); });
	var html = '';
	if(hitReserved.length > 0) {
		html += '<div class="alert alert-warning py-2 mb-1"><i class="ti ti-user-shield me-1"></i><?php echo lang('admin_reserved_words_hit')?><strong>' + hitReserved.join('、') + '</strong></div>';
	}
	if(hitSensitive.length > 0) {
		html += '<div class="alert alert-danger py-2 mb-1"><i class="ti ti-shield-exclamation me-1"></i><?php echo lang('admin_sensitive_words_hit')?><strong>' + hitSensitive.join('、') + '</strong></div>';
	}
	if(html === '') {
		html = '<div class="alert alert-success py-2 mb-0"><i class="ti ti-circle-check me-1"></i><?php echo lang('admin_filter_no_hit')?></div>';
	}
	resultDiv.innerHTML = html;
});

document.getElementById('test-text').addEventListener('keyup', function(e) {
	if(e.key === 'Enter') document.getElementById('test-btn').click();
});

// 批量导入表单
var importForm = document.querySelector('#import-form');
importForm.addEventListener('submit', function(e) {
	e.preventDefault();
	var formData = new FormData(importForm);
	fetch(importForm.getAttribute('action'), {
		method: 'POST',
		body: formData,
		credentials: 'same-origin',
		headers: {'X-Requested-With': 'XMLHttpRequest'}
	}).then(function(res) { return res.text(); }).then(function(text) {
		var s = null;
		try { s = text ? JSON.parse(text) : null; } catch(e) {}
		var code = s && s.code !== undefined ? s.code : -1;
		var message = s && s.message !== undefined ? s.message : (text || '');
		if(code == 0) {
			showToast(message, 'success');
			setTimeout(function(){ location.reload(); }, 1000);
		} else {
			showToast(message, 'error');
		}
	}).catch(function() {
		showToast('<?php echo lang('admin_request_failed');?>', 'error');
	});
});

// 文件导入表单
var fileForm = document.querySelector('#file-import-form');
fileForm.addEventListener('submit', function(e) {
	e.preventDefault();
	var formData = new FormData(fileForm);
	var submitBtn = fileForm.querySelector('button[type="submit"]');
	setBtnLoading(submitBtn, true);
	fetch(fileForm.getAttribute('action'), {
		method: 'POST',
		body: formData,
		credentials: 'same-origin',
		headers: {'X-Requested-With': 'XMLHttpRequest'}
	}).then(function(res) { return res.text(); }).then(function(text) {
		var s = null;
		try { s = text ? JSON.parse(text) : null; } catch(e) {}
		if(s && s.code == 0) {
			showToast(s.message, 'success');
			setTimeout(function(){ location.reload(); }, 1000);
		} else {
			showToast(s && s.message ? s.message : '<?php echo lang('admin_import_failed');?>', 'error');
		}
		setBtnLoading(submitBtn, false);
	}).catch(function() {
		showToast('<?php echo lang('admin_request_failed');?>', 'error');
		setBtnLoading(submitBtn, false);
	});
});
</script>
