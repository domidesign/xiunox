<script>
// 插件搜索:构建保留路由信息的 URL(./?plugin.htm?type=X&keyword=X&status=X)
// 不能依赖 GET 表单默认提交:浏览器会用表单字段替换 action URL 中的 query string,
// 丢失 ./?plugin.htm 中的路由信息 plugin.htm,导致 404。
function pluginSearch() {
    var form = document.getElementById('pluginSearchForm');
    if (!form) return;
    var type = form.elements['type'].value;
    var keyword = form.elements['keyword'].value;
    var status = form.elements['status'].value;
    var url = '<?php echo admin_plugin_url();?>?type=' + encodeURIComponent(type)
            + '&keyword=' + encodeURIComponent(keyword)
            + '&status=' + encodeURIComponent(status);
    window.location.href = url;
}
document.getElementById('pluginSearchForm').addEventListener('submit', function(e) {
    e.preventDefault();
    pluginSearch();
});

function handlePluginIconError(img) {
    var dir = img.getAttribute('data-dir') || '?';
    var letter = dir.charAt(0).toUpperCase();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'
        + '<rect fill="#ddd" width="64" height="64"/>'
        + '<text x="32" y="38" text-anchor="middle" font-size="24" fill="#999">' + letter + '</text>'
        + '</svg>';
    img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
    img.onerror = null;
}

// 安装前预扫描
var preinstallDir = '';
var preinstallName = '';
var preinstallUrl = '';

function preInstallScan(dir, name, btn) {
    preinstallDir = dir;
    preinstallName = name;
    preinstallUrl = btn ? btn.getAttribute('data-install-url') : '';

    var modal = new bootstrap.Modal(document.getElementById('preinstallModal'));
    document.getElementById('preinstallPluginName').textContent = name + ' (' + dir + ')';
    document.getElementById('preinstallScanResult').innerHTML = '<div class="text-center py-3"><span class="spinner-border spinner-border-sm"></span> <?php echo lang('plugin_preinstall_scanning');?></div>';
    document.getElementById('preinstallActions').classList.add('d-none');
    modal.show();

    fetch('<?php echo admin_plugin_scanner_preinstall_url();?>?dir=' + encodeURIComponent(dir))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            renderPreinstallResult(data);
        })
        .catch(function() {
            document.getElementById('preinstallScanResult').innerHTML = '<div class="alert alert-danger py-2"><?php echo lang('plugin_preinstall_scan_failed');?></div>';
            document.getElementById('preinstallActions').classList.add('d-none');
        });
}

function renderPreinstallResult(data) {
    var html = '';
    var actionsEl = document.getElementById('preinstallActions');

    // 确保 preinstallUrl 有效
    if (!preinstallUrl) {
        preinstallUrl = '?plugin-install-' + preinstallDir + '.htm';
    }

    // 同类插件冲突提示：渲染在最上方，让用户在安装前知晓哪些插件会被自动禁用
    var conflicts = data.conflicts || [];
    if (conflicts.length > 0) {
        html += '<div class="alert alert-warning py-2 mb-2">';
        html += '<i class="ti ti-alert-circle me-1"></i><b><?php echo lang('plugin_conflict_title');?></b><br>';
        html += '<span class="small"><?php echo lang('plugin_conflict_desc');?></span>';
        html += '<ul class="mb-0 mt-1 ps-3">';
        conflicts.forEach(function(c) {
            var statusText = c.enable
                ? '<span class="text-danger small"><?php echo lang('plugin_conflict_item_enabled');?></span>'
                : '<span class="text-secondary small"><?php echo lang('plugin_conflict_item_disabled');?></span>';
            html += '<li>' + escapeHtml(c.name) + ' <code class="small">' + escapeHtml(c.dir) + '</code> ' + statusText + '</li>';
        });
        html += '</ul>';
        html += '</div>';
    }

    if (data.can_install && data.total === 0) {
        // 无任何问题（冲突提示已在上方渲染，这里只显示扫描通过）
        if (conflicts.length === 0) {
            html = '<div class="alert alert-success py-2"><i class="ti ti-circle-check me-1"></i><?php echo lang('plugin_preinstall_pass');?></div>';
        } else {
            html += '<div class="alert alert-success py-2"><i class="ti ti-circle-check me-1"></i><?php echo lang('plugin_preinstall_pass');?></div>';
        }
        document.getElementById('preinstallScanResult').innerHTML = html;
        actionsEl.innerHTML = '<button type="button" class="btn btn-primary rounded-pill" onclick="submitPluginInstallFromPreinstall()"><i class="ti ti-download me-1"></i><?php echo lang('admin_btn_install');?></button>';
        actionsEl.classList.remove('d-none');
        return;
    }

    // 有问题
    if (!data.can_install) {
        html += '<div class="alert alert-danger py-2"><i class="ti ti-alert-triangle me-1"></i><b><?php echo lang('plugin_preinstall_blocked');?></b> ' + data.summary + '</div>';
    } else {
        html += '<div class="alert alert-warning py-2"><i class="ti ti-exclamation-circle me-1"></i><b><?php echo lang('plugin_preinstall_warning');?></b> ' + data.summary + '</div>';
    }

    // 问题列表
    html += '<div class="overflow-x-auto"><table class="table table-sm table-hover mb-0">';
    html += '<thead><tr><th><?php echo lang('plugin_scanner_severity');?></th><th><?php echo lang('plugin_scanner_file_col');?></th><th><?php echo lang('plugin_scanner_suggestion');?></th></tr></thead><tbody>';

    var issues = data.issues || [];
    issues.forEach(function(issue) {
        var sevClass = issue.severity === 'fatal' ? 'bg-danger' : (issue.severity === 'warning' ? 'bg-warning text-dark' : (issue.severity === 'medium' ? 'bg-primary' : 'bg-secondary'));
        var sevText = issue.severity === 'fatal' ? '<?php echo lang('plugin_scanner_fatal');?>' : (issue.severity === 'warning' ? '<?php echo lang('plugin_scanner_warning');?>' : (issue.severity === 'medium' ? '<?php echo lang('plugin_scanner_medium');?>' : '<?php echo lang('plugin_scanner_info');?>'));
        var fileCol = '<code style="font-size:0.75rem">' + escapeHtml(issue.file) + '</code>';
        // 合并后的 issue 显示首行号 + 徽章 ×N + hover tooltip
        if (issue.count && issue.count > 1 && issue.lines && issue.lines.length > 1) {
            var linesArr = issue.lines.slice(0, 20).map(function(n) { return 'L' + n; });
            if (issue.lines.length > 20) linesArr.push('...');
            var tooltip = linesArr.join(', ');
            fileCol += '<br><span class="text-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="' + escapeHtml(tooltip) + '" style="cursor:help">L' + issue.line + ' <span class="badge bg-secondary rounded-pill" style="font-size:0.7rem">×' + issue.count + '</span></span>';
        } else if (issue.line) {
            fileCol += '<br><small class="text-secondary">L' + issue.line + '</small>';
        }
        html += '<tr>';
        html += '<td><span class="badge ' + sevClass + '">' + sevText + '</span></td>';
        html += '<td>' + fileCol + '</td>';
        html += '<td class="fs-6">' + escapeHtml(issue.suggestion) + '</td>';
        html += '</tr>';
    });

    html += '</tbody></table></div>';

    document.getElementById('preinstallScanResult').innerHTML = html;
    // 初始化合并行号的 tooltip
    document.querySelectorAll('#preinstallScanResult [data-bs-toggle="tooltip"]').forEach(function(el) {
        new bootstrap.Tooltip(el);
    });

    // 操作按钮
    if (data.can_install) {
        // 无致命问题，可以安装
        actionsEl.innerHTML = '<button type="button" class="btn btn-primary rounded-pill" onclick="submitPluginInstallFromPreinstall()"><i class="ti ti-download me-1"></i><?php echo lang('admin_btn_install');?></button>';
    } else {
        // 有致命问题，只显示强制安装按钮
        actionsEl.innerHTML = '<button type="button" class="btn btn-outline-danger rounded-pill" onclick="submitPluginInstallFromPreinstall(1)"><i class="ti ti-alert-triangle me-1"></i><?php echo lang('plugin_preinstall_force_install');?></button>';
    }
    actionsEl.classList.remove('d-none');
}

// preinstall 扫描通过后直接 POST 安装
function submitPluginInstallFromPreinstall(force) {
    var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
    var url = preinstallUrl;
    if (force) {
        url += (url.indexOf('?') !== -1 ? '&' : '?') + 'force=1';
    }
    var formData = new FormData();
    formData.append('csrf_token', csrfToken);
    if (force) formData.append('force', '1');

    fetch(url, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (parseInt(data.code) === 0) {
            // 关闭 preinstall 弹窗
            var modalEl = document.getElementById('preinstallModal');
            var modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
            showToast(data.message, 'success');
            setTimeout(function() {
                window.location.href = data.redirect_url || window.location.href;
            }, 800);
        } else {
            showToast(data.message || <?php echo json_encode(lang('plugin_install_failed'));?>, 'error');
        }
    })
    .catch(function() {
        showToast(<?php echo json_encode(lang('plugin_install_failed'));?>, 'error');
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===== 插件上传安装/升级 =====
var selectedUploadFile = null;

function handlePluginUploadChange(input) {
    var btn = document.getElementById('pluginUploadBtn');
    var selectText = document.getElementById('pluginUploadSelectText');
    if (input.files && input.files[0]) {
        var file = input.files[0];
        if (!file.name.toLowerCase().endsWith('.zip')) {
            XN.alert('<?php echo lang('plugin_upload_invalid_zip');?>', {type:'danger'});
            input.value = '';
            btn.disabled = true;
            selectText.textContent = '<?php echo lang('plugin_upload_select');?>';
            selectedUploadFile = null;
            return;
        }
        selectedUploadFile = file;
        selectText.textContent = file.name.length > 20 ? file.name.substring(0, 17) + '...' : file.name;
        btn.disabled = false;
    } else {
        btn.disabled = true;
        selectText.textContent = '<?php echo lang('plugin_upload_select');?>';
        selectedUploadFile = null;
    }
}

function submitPluginUpload() {
    if (!selectedUploadFile) return;

    var btn = document.getElementById('pluginUploadBtn');
    var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('plugin_upload_uploading');?>';

    var formData = new FormData();
    formData.append('file', selectedUploadFile);
    formData.append('csrf_token', csrfToken);

    fetch('<?php echo url('plugin-upload');?>', {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (parseInt(data.code) === 0) {
            showToast(data.message, 'success');
            setTimeout(function() {
                window.location.href = data.redirect_url || window.location.href;
            }, 800);
        } else {
            showToast(data.message || '<?php echo lang('plugin_upload_failed');?>', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="ti ti-upload me-1"></i><?php echo lang('plugin_upload_btn');?>';
        }
    })
    .catch(function() {
        showToast('<?php echo lang('plugin_upload_failed');?>', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-upload me-1"></i><?php echo lang('plugin_upload_btn');?>';
    });
}

// ===== 插件禁用/启用/卸载/升级：弹窗确认 + fetch POST =====
function bindPluginActionButtons() {
    document.querySelectorAll('button[data-action="disable"], button[data-action="enable"], button[data-action="unstall"], button[data-action="upgrade"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var action = this.getAttribute('data-action');
            var dir = this.getAttribute('data-dir');
            var name = this.getAttribute('data-name');
            var url = this.getAttribute('data-url');

            // 确认文案（name 转义防 XSS）
            var safeName = XN.escapeHtml ? XN.escapeHtml(name) : name;
            var msg = '';
            var type = 'warning';
            var okText = '<?php echo lang("confirm");?>';
            if (action === 'disable') {
                msg = '<?php echo lang('plugin_disable_confirm', array('name'=>'__NAME__'));?>'.replace('__NAME__', safeName);
            } else if (action === 'enable') {
                msg = '<?php echo lang('plugin_enable_confirm', array('name'=>'__NAME__'));?>'.replace('__NAME__', safeName);
            } else if (action === 'unstall') {
                msg = '<?php echo lang('plugin_unstall_confirm', array('name'=>'__NAME__'));?>'.replace('__NAME__', safeName);
                type = 'danger';
                okText = '<?php echo lang('admin_btn_uninstall');?>';
            } else if (action === 'upgrade') {
                msg = '<?php echo lang('plugin_upgrade_confirm', array('name'=>'__NAME__'));?>'.replace('__NAME__', safeName);
                type = 'info';
                okText = '<?php echo lang('admin_btn_upgrade');?>';
            }

            var confirmOpts = {};
            if (action === 'unstall') {
                confirmOpts = {type: 'danger', okText: okText};
            } else if (action === 'upgrade') {
                confirmOpts = {type: 'danger', okText: okText};
            } else {
                confirmOpts = {type: 'warning', okText: okText};
            }
            XN.confirm(msg, function() {
                submitPluginAction(btn, url);
            }, confirmOpts);
        });
    });
}

function submitPluginAction(btn, url) {
    var csrfToken = document.querySelector('meta[name="csrf-token"]') ? document.querySelector('meta[name="csrf-token"]').content : '';
    var originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    var formData = new FormData();
    formData.append('csrf_token', csrfToken);

    fetch(url, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (parseInt(data.code) === 0) {
            showToast(data.message, 'success');
            setTimeout(function() {
                window.location.href = data.redirect_url || window.location.href;
            }, 800);
        } else {
            showToast(data.message || <?php echo json_encode(lang('plugin_action_failed'));?>, 'error');
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    })
    .catch(function() {
        showToast(<?php echo json_encode(lang('plugin_action_failed'));?>, 'error');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    });
}
