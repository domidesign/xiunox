<script>
// ponytail: 原生 JS 辅助函数，替代 $.ajax（避免依赖 xiuno-modern.js shim）
function buildQuery(data) {
	var parts = [];
	for (var k in data) {
		if (Object.prototype.hasOwnProperty.call(data, k)) {
			parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(data[k]));
		}
	}
	return parts.join('&');
}

function ajax(opts) {
	var url = opts.url;
	var type = (opts.type || 'GET').toUpperCase();
	var data = opts.data || null;
	var dataType = opts.dataType || 'json';
	var csrfToken = (document.querySelector('meta[name="csrf-token"]') || {}).getAttribute && document.querySelector('meta[name="csrf-token"]').getAttribute('content') || '';

	var fetchOpts = {
		method: type,
		headers: {
			'X-Requested-With': 'XMLHttpRequest',
			'X-CSRF-Token': csrfToken
		},
		credentials: 'same-origin'
	};

	if (type === 'POST' && data) {
		fetchOpts.headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
		fetchOpts.body = typeof data === 'object' ? buildQuery(data) : data;
	} else if (data) {
		var sep = url.indexOf('?') === -1 ? '?' : '&';
		url += sep + buildQuery(data);
	}

	fetch(url, fetchOpts).then(function(response) {
		return response.text().then(function(text) {
			var xhrLike = { status: response.status, responseText: text };
			if (!response.ok) throw xhrLike;
			if (dataType === 'json') {
				try { return JSON.parse(text); }
				catch (e) { throw xhrLike; }
			}
			return text;
		});
	}).then(function(res) {
		if (opts.success) opts.success(res);
	}).catch(function(err) {
		var xhr = err && err.responseText !== undefined ? err : { responseText: (err && err.message) ? err.message : String(err || '') };
		if (opts.error) opts.error(xhr);
	});
}

// 仪表盘版本检查：异步调用 ?online_upgrade-check.htm，localStorage 缓存 24 小时
(function() {
	var CACHE_KEY = 'xiunox_upgrade_check';
	var CACHE_TTL = 24 * 60 * 60 * 1000; // 24 小时
	var noticeEl = document.getElementById('upgradeNotice');
	if (!noticeEl) return;

	function showNotice(type, html) {
		noticeEl.className = 'alert alert-' + type + ' d-flex align-items-center mb-4';
		noticeEl.innerHTML = html;
		noticeEl.classList.remove('d-none');
	}

	function renderResult(data) {
		if (!data.ok) return; // 静默失败，不打扰站长
		if (data.has_update) {
			var ver = data.latest_version || '';
			var notes = data.release_notes ? '<div class="small text-muted mt-1">' + escapeHtml(data.release_notes.substring(0, 200)) + '</div>' : '';
			showNotice('info', '<i class="ti ti-cloud-download fs-4 me-2 d-none d-md-block"></i><div>'
				+ '<strong><?php echo lang('admin_online_upgrade_dashboard_has_update');?></strong>'
				+ (ver ? ' <span class="badge bg-success ms-1">v' + escapeHtml(ver) + '</span>' : '')
				+ '<div class="small text-muted mt-1"><?php echo lang('admin_online_upgrade_dashboard_current_tip');?></div>'
				+ notes
				+ '<a href="<?php echo url('online_upgrade');?>" class="btn btn-sm btn-primary mt-2"><i class="ti ti-arrow-right"></i> <?php echo lang('admin_online_upgrade_dashboard_go_upgrade');?></a>'
				+ '</div>');
		}
		// 无更新时不显示横幅，避免打扰
	}

	function escapeHtml(s) {
		return String(s).replace(/[&<>"']/g, function(c) {
			return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
		});
	}

	// 读缓存
	var cached = null;
	try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e) {}
	var now = Date.now();
	// 当前页面渲染时的代码版本（服务端 $conf['version']），用作缓存失效依据
	var currentVer = <?php echo json_encode(isset($conf['version']) ? $conf['version'] : ''); ?>;

	if (cached && cached.timestamp && (now - cached.timestamp < CACHE_TTL)) {
		// 缓存命中：校验缓存时的版本号与当前版本号是否一致，不一致说明已升级/回滚，作废重查
		var cachedVer = cached.data && cached.data.current_version ? cached.data.current_version : '';
		if (cachedVer && currentVer && cachedVer !== currentVer) {
			try { localStorage.removeItem(CACHE_KEY); } catch(e) {}
			cached = null;
		} else {
			renderResult(cached.data);
			return;
		}
	}

	// 异步检查（不阻塞页面渲染）
	setTimeout(function() {
		ajax({
			url: '<?php echo url('online_upgrade-check');?>',
			type: 'POST',
			data: { csrf_token: <?php echo json_encode(CsrfService::getToken());?> },
			dataType: 'json',
			success: function(res) {
				if (res && res.ok) {
					try { localStorage.setItem(CACHE_KEY, JSON.stringify({timestamp: now, data: res})); } catch(e) {}
					renderResult(res);
				}
			},
			error: function() { /* 静默失败 */ }
		});
	}, 800);
})();
</script>

<script>
if(typeof Chart !== 'undefined') {

	if(ctx) {
		var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
		var gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
		var textColor = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.45)';

		// 服务端提供的30天完整数据
		var allLabels = <?php echo json_encode($chart_labels);?>;
		var allThreads = <?php echo json_encode($chart_threads);?>;
		var allPosts = <?php echo json_encode($chart_posts);?>;
		var allUsers = <?php echo json_encode($chart_users);?>;
		var allAttachs = <?php echo json_encode($chart_attachs);?>;

		var chartInstance = null;

		function renderChart(days) {
			var offset = allLabels.length - days;
			var labels = allLabels.slice(offset);
			var threads = allThreads.slice(offset);
			var posts = allPosts.slice(offset);
			var users = allUsers.slice(offset);
			var attachs = allAttachs.slice(offset);

			if(chartInstance) chartInstance.destroy();

			chartInstance = new Chart(ctx, {
				type: 'line',
				data: {
					labels: labels,
					datasets: [{
						label: '<?php echo lang('chart_threads');?>',
						data: threads,
						borderColor: 'rgba(37, 99, 235, 1)',
						backgroundColor: 'rgba(37, 99, 235, 0.08)',
						fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2
					}, {
						label: '<?php echo lang('chart_posts');?>',
						data: posts,
						borderColor: 'rgba(25, 135, 84, 1)',
						backgroundColor: 'rgba(25, 135, 84, 0.08)',
						fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2
					}, {
						label: '<?php echo lang('chart_new_users');?>',
						data: users,
						borderColor: 'rgba(255, 153, 0, 1)',
						backgroundColor: 'rgba(255, 153, 0, 0.08)',
						fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2
					}, {
						label: '<?php echo lang('chart_attachs');?>',
						data: attachs,
						borderColor: 'rgba(13, 202, 240, 1)',
						backgroundColor: 'rgba(13, 202, 240, 0.08)',
						fill: true, tension: 0.4, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: true,
					interaction: { intersect: false, mode: 'index' },
					plugins: {
						legend: { position: 'top', labels: { usePointStyle: true, pointStyle: 'circle', padding: 20, font: { size: 12 }, color: textColor } },
						tooltip: { backgroundColor: isDark ? '#1e293b' : '#fff', titleColor: isDark ? '#fff' : '#333', bodyColor: isDark ? '#ccc' : '#666', borderColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)', borderWidth: 1, cornerRadius: 8, padding: 12 }
					},
					scales: {
						y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 }, precision: 0 } },
						x: { grid: { display: false }, ticks: { color: textColor, font: { size: 11 }, maxRotation: 45, minRotation: 0 } }
					}
				}
			});
		}

		// 默认显示7天
		renderChart(7);

		// 时间范围切换
		document.querySelectorAll('.btn-chart-range').forEach(function(btn) {
			btn.addEventListener('click', function() {
				document.querySelectorAll('.btn-chart-range').forEach(function(b) { b.classList.remove('active'); });
				this.classList.add('active');
				renderChart(parseInt(this.getAttribute('data-days')));
			});
		});
	}
}
</script>

<script>
(function() {
    // anime.js v4 数字从 0 计数到目标值
    var animate = anime.animate;
    document.querySelectorAll('.dash-count').forEach(function(el) {
        var target = parseInt(el.getAttribute('data-count')) || 0;
        var obj = { val: 0 };
        animate(obj, {
            val: target,
            duration: 1500,
            ease: 'outExpo',
            onUpdate: function() {
                el.textContent = Math.round(obj.val);
            }
        });
    });
})();
</script>
