<script>
(function(){
    var sidebar = document.getElementById('adminSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var closeBtn = document.getElementById('sidebarCloseBtn');
    var toggleBtn = document.getElementById('sidebarToggleBtn');
    var mainArea = document.querySelector('.admin-main');

    // 同步侧栏宽度到主区域 margin-left
    function syncSidebarWidth() {
        if (sidebar && mainArea && window.innerWidth >= 992) {
            mainArea.style.marginLeft = sidebar.offsetWidth + 'px';
        }
    }

    syncSidebarWidth();
    if (window.ResizeObserver && sidebar) {
        new ResizeObserver(syncSidebarWidth).observe(sidebar);
    }
    window.addEventListener('resize', function() {
        if (window.innerWidth < 992 && mainArea) {
            mainArea.style.marginLeft = '0';
        } else {
            syncSidebarWidth();
        }
    });

    function openMobileSidebar() {
        if (sidebar) sidebar.classList.add('show');
        if (overlay) overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileSidebar() {
        if (sidebar) sidebar.classList.remove('show');
        if (overlay) overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            if (sidebar && sidebar.classList.contains('show')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    if (overlay) {
        overlay.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }
})();

(function(){
	var current = localStorage.getItem('theme') || 'light';
	var iconLight = document.getElementById('theme-icon-light');
	var iconDark = document.getElementById('theme-icon-dark');
	if(iconLight && iconDark) {
		if(current === 'dark') {
			iconLight.classList.add('d-none');
			iconDark.classList.remove('d-none');
		} else {
			iconLight.classList.remove('d-none');
			iconDark.classList.add('d-none');
		}
	}
})();

document.getElementById('theme-toggle').addEventListener('click', function() {
	var current = document.documentElement.getAttribute('data-bs-theme') || 'light';
	var next = current === 'dark' ? 'light' : 'dark';
	document.documentElement.setAttribute('data-bs-theme', next);
	localStorage.setItem('theme', next);
	var iconLight = document.getElementById('theme-icon-light');
	var iconDark = document.getElementById('theme-icon-dark');
	if(iconLight && iconDark) {
		if(next === 'dark') {
			iconLight.classList.add('d-none');
			iconDark.classList.remove('d-none');
		} else {
			iconLight.classList.remove('d-none');
			iconDark.classList.add('d-none');
		}
	}
});
</script>
