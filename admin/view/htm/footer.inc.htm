	<!-- Flash toast：读取 PRG 重定向时设置的 flash cookie，显示 toast 后清除 -->
	<script>
	(function() {
		function getCookie(name) {
			var value = "; " + document.cookie;
			var parts = value.split("; " + name + "=");
			if (parts.length == 2) return parts.pop().split(";").shift();
			return '';
		}
		function deleteCookie(name) {
			document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
		}
		var flashMsg = getCookie('flash_msg');
		var flashType = getCookie('flash_type') || 'success';
		if (flashMsg) {
			try { flashMsg = decodeURIComponent(flashMsg); } catch(e) {}
			deleteCookie('flash_msg');
			deleteCookie('flash_type');
			if (typeof showToast === 'function') {
				showToast(flashMsg, flashType);
			} else if (typeof XN !== 'undefined' && typeof XN.toast === 'function') {
				XN.toast(flashMsg, flashType);
			}
		}
	})();
	</script>
	
<script>
(function(){
    var sidebar = document.getElementById('adminSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var closeBtn = document.getElementById('sidebarCloseBtn');
    var toggleBtn = document.getElementById('sidebarToggleBtn');
    var mainArea = document.querySelector('.admin-main');

    // 同步侧栏宽度到主区域 margin-left
    function syncSidebarWidth() {
        if (sidebar && mainArea && window.innerWidth >= 992) {
            mainArea.style.marginLeft = sidebar.offsetWidth + 'px';
        }
    }

    syncSidebarWidth();
    if (window.ResizeObserver && sidebar) {
        new ResizeObserver(syncSidebarWidth).observe(sidebar);
    }
    window.addEventListener('resize', function() {
        if (window.innerWidth < 992 && mainArea) {
            mainArea.style.marginLeft = '0';
        } else {
            syncSidebarWidth();
        }
    });

    function openMobileSidebar() {
        if (sidebar) sidebar.classList.add('show');
        if (overlay) overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeMobileSidebar() {
        if (sidebar) sidebar.classList.remove('show');
        if (overlay) overlay.classList.remove('show');
        document.body.style.overflow = '';
    }

    if (toggleBtn) {
        toggleBtn.addEventListener('click', function() {
            if (sidebar && sidebar.classList.contains('show')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }

    if (overlay) {
        overlay.addEventListener('click', function() {
            closeMobileSidebar();
        });
    }
})();

// ========== 主题切换（明亮/暗黑/跟随系统 + 主题色） ==========
(function () {
	var iconLight = document.getElementById('theme-icon-light');
	var iconDark = document.getElementById('theme-icon-dark');
	var iconAuto = document.getElementById('theme-icon-auto');
	var modeBtns = document.querySelectorAll('.theme-mode-btn');
	var colorBtns = document.querySelectorAll('.theme-color-btn');

	function safeGet(key) {
		try { return localStorage.getItem(key); } catch (e) { return null; }
	}
	function safeSet(key, val) {
		try { localStorage.setItem(key, val); } catch (e) {}
	}

	var darkMQ = window.matchMedia('(prefers-color-scheme: dark)');

	function getEffectiveTheme(mode) {
		if (mode === 'auto') {
			return darkMQ.matches ? 'dark' : 'light';
		}
		return mode;
	}

	function applyThemeMode(mode) {
		var effective = getEffectiveTheme(mode);
		document.documentElement.setAttribute('data-bs-theme', effective);
		if (iconLight) iconLight.classList.toggle('d-none', mode !== 'light');
		if (iconDark) iconDark.classList.toggle('d-none', mode !== 'dark');
		if (iconAuto) iconAuto.classList.toggle('d-none', mode !== 'auto');
		modeBtns.forEach(function(btn) {
			var isActive = btn.getAttribute('data-mode') === mode;
			btn.classList.toggle('btn-secondary', isActive);
			btn.classList.toggle('btn-outline-secondary', !isActive);
		});
		safeSet('theme', mode);
	}

	function applyThemeColor(color) {
		document.documentElement.setAttribute('data-theme', color);
		safeSet('theme-color', color);
		colorBtns.forEach(function(btn) {
			var isActive = btn.getAttribute('data-color') === color;
			btn.style.outline = isActive ? '2px solid var(--bs-body-color)' : 'none';
			btn.style.outlineOffset = '2px';
		});
	}

	// 初始化
	var storedMode = safeGet('theme') || (document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light');
	applyThemeMode(storedMode);

	var storedColor = safeGet('theme-color') || document.documentElement.getAttribute('data-theme') || 'blue';
	applyThemeColor(storedColor);

	modeBtns.forEach(function(btn) {
		btn.addEventListener('click', function() {
			applyThemeMode(this.getAttribute('data-mode'));
		});
	});

	colorBtns.forEach(function(btn) {
		btn.addEventListener('click', function() {
			applyThemeColor(this.getAttribute('data-color'));
		});
	});

	darkMQ.addEventListener('change', function() {
		if (safeGet('theme') === 'auto') {
			applyThemeMode('auto');
		}
	});
})();
</script>
