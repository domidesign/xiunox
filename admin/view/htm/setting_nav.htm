<script>
// ====== 子Tab切换（使用 URL hash 保持刷新后状态） ======
var navTabMap = {
    'topNav': 'topNavPane',
    'sideNav': 'sideNavPane',
    'mobileNav': 'mobileNavPane',
    'discover': 'discoverPane',
    'footer': 'footerPane'
};

function switchNavTab(tabName) {
    document.querySelectorAll('#navTab .nav-link').forEach(function(a) { a.classList.remove('active'); });
    document.querySelectorAll('.nav-tab-pane').forEach(function(p) { p.style.display = 'none'; });
    var activeLink = document.querySelector('#navTab .nav-link[data-nav-tab="' + tabName + '"]');
    var targetPane = document.getElementById(navTabMap[tabName]);
    if(activeLink) activeLink.classList.add('active');
    if(targetPane) targetPane.style.display = '';
    if(history.replaceState) {
        history.replaceState(null, '', '#' + tabName);
    }
}

document.querySelectorAll('#navTab .nav-link[data-nav-tab]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        e.preventDefault();
        var tab = this.getAttribute('data-nav-tab');
        if(tab) switchNavTab(tab);
    });
});

(function() {
    var hash = location.hash.replace('#', '');
    if(hash && navTabMap[hash]) {
        switchNavTab(hash);
    }
})();

(function() {
	// ====== 导航数据 ======
	var topNavItems = <?php echo xn_json_encode($nav_items);?>;
	var sideNavItems = <?php echo xn_json_encode($sidebar_nav_items);?>;
	var discoverItems = <?php echo xn_json_encode($discover_items);?>;
	var mobileNavItems = <?php echo xn_json_encode($mobile_nav_items);?>;

	// ====== 插件注册项（只读展示，不参与表单提交） ======
	var pluginItemsTop = <?php echo xn_json_encode($plugin_nav_registry_top ?? array());?>;
	var pluginItemsSide = <?php echo xn_json_encode($plugin_nav_registry_side ?? array());?>;
	var pluginItemsMobile = <?php echo xn_json_encode($plugin_nav_registry_mobile ?? array());?>;

	// URL 预设映射：value -> {url, placeholder, readOnly, icon, name}
	// icon/name：切换到该预设时自动填充（仅当用户未自定义时填充）
	var URL_PRESETS = {
		'none':            { url: '',  placeholder: '',            readOnly: true,  icon: '',                name: '' },
		'custom':          { url: '',  placeholder: 'URL',         readOnly: false, icon: '',                name: '' },
		'/':               { url: '/',                placeholder: '', readOnly: true,  icon: 'ti ti-home',           name: '<?php echo lang('admin_url_type_home');?>' },
		'/forums':         { url: '/forums',          placeholder: '', readOnly: true,  icon: 'ti ti-category',       name: '<?php echo lang('admin_url_type_forums');?>' },
		'/rank':           { url: '/rank',            placeholder: '', readOnly: true,  icon: 'ti ti-trophy',         name: '<?php echo lang('admin_url_type_rank');?>' },
		'/my':             { url: '/my',              placeholder: '', readOnly: true,  icon: 'ti ti-user',           name: '<?php echo lang('admin_url_type_user_center');?>' },
		'/search':         { url: '/search',          placeholder: '', readOnly: true,  icon: 'ti ti-search',         name: '<?php echo lang('admin_url_type_search');?>' },
		'/banned':         { url: '/banned',          placeholder: '', readOnly: true,  icon: 'ti ti-ban',            name: '<?php echo lang('admin_url_type_banned');?>' },
		'/notice':         { url: '/notice',          placeholder: '', readOnly: true,  icon: 'ti ti-bell',           name: '<?php echo lang('admin_url_type_notice');?>' },
		'/more':           { url: '/more',            placeholder: '', readOnly: true,  icon: 'ti ti-compass',        name: '<?php echo lang('admin_url_type_more');?>' },
		'/sitemap':        { url: '/sitemap',         placeholder: '', readOnly: true,  icon: 'ti ti-sitemap',        name: '<?php echo lang('admin_url_type_sitemap');?>' },
		'thread-create-0': { url: 'thread-create-0',  placeholder: '', readOnly: true,  icon: 'ti ti-edit',           name: '<?php echo lang('admin_url_type_thread_create');?>' },
		'my-thread':       { url: 'my-thread',        placeholder: '', readOnly: true,  icon: 'ti ti-message',        name: '<?php echo lang('admin_url_type_my_thread');?>' },
		'my-favorite':     { url: 'my-favorite',      placeholder: '', readOnly: true,  icon: 'ti ti-star',           name: '<?php echo lang('admin_url_type_my_favorite');?>' },
		'my-notify':       { url: 'my-notify',        placeholder: '', readOnly: true,  icon: 'ti ti-bell-ringing',   name: '<?php echo lang('admin_url_type_my_notify');?>' },
		'user-login':      { url: 'user-login',       placeholder: '', readOnly: true,  icon: 'ti ti-login',          name: '<?php echo lang('admin_url_type_login');?>' },
		'user-create':     { url: 'user-create',      placeholder: '', readOnly: true,  icon: 'ti ti-user-plus',      name: '<?php echo lang('admin_url_type_register');?>' },
		'user-logout':     { url: 'user-logout',      placeholder: '', readOnly: true,  icon: 'ti ti-logout',         name: '<?php echo lang('admin_url_type_logout');?>' },
		'external':        { url: '',  placeholder: 'https://',      readOnly: false, icon: '',                name: '' }
	};

	// 根据 URL 值反推 preset key
	function detectPreset(url) {
		if (!url) return 'custom';
		if (url.indexOf('http://') === 0 || url.indexOf('https://') === 0) return 'external';
		for (var k in URL_PRESETS) {
			if (k === 'custom' || k === 'external') continue;
			if (URL_PRESETS[k].url === url) return k;
		}
		return 'custom';
	}

	function escHtml(s) {
		if (s == null) return '';
		return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
	}

	// ====== URL 单元格（预设 + 自定义） ======
	function buildUrlCell(prefix, urlVal, inputName) {
		var preset = detectPreset(urlVal);
		var cfg = URL_PRESETS[preset] || URL_PRESETS.custom;
		var opts = '';
		var labels = {
			'none': '<?php echo lang('admin_url_type_none');?>',
			'custom': '<?php echo lang('admin_url_type_custom');?>',
			'/': '<?php echo lang('admin_url_type_home');?>',
			'/forums': '<?php echo lang('admin_url_type_forums');?>',
			'/rank': '<?php echo lang('admin_url_type_rank');?>',
			'/my': '<?php echo lang('admin_url_type_user_center');?>',
			'/search': '<?php echo lang('admin_url_type_search');?>',
			'/banned': '<?php echo lang('admin_url_type_banned');?>',
			'/notice': '<?php echo lang('admin_url_type_notice');?>',
			'/more': '<?php echo lang('admin_url_type_more');?>',
			'/sitemap': '<?php echo lang('admin_url_type_sitemap');?>',
			'thread-create-0': '<?php echo lang('admin_url_type_thread_create');?>',
			'my-thread': '<?php echo lang('admin_url_type_my_thread');?>',
			'my-favorite': '<?php echo lang('admin_url_type_my_favorite');?>',
			'my-notify': '<?php echo lang('admin_url_type_my_notify');?>',
			'user-login': '<?php echo lang('admin_url_type_login');?>',
			'user-create': '<?php echo lang('admin_url_type_register');?>',
			'user-logout': '<?php echo lang('admin_url_type_logout');?>',
			'external': '<?php echo lang('admin_url_type_external');?>'
		};
		for (var k in URL_PRESETS) {
			opts += '<option value="' + k + '"' + (k === preset ? ' selected' : '') + '>' + (labels[k] || k) + '</option>';
		}
		var html =
			'<div class="input-group input-group-sm">' +
				'<select class="form-select form-select-sm url-preset-select">' + opts + '</select>' +
				'<input type="text" class="form-control form-control-sm" name="' + inputName + '" value="' + escHtml(urlVal) + '" placeholder="' + (cfg.placeholder || 'URL') + '"' + (cfg.readOnly ? ' readonly' : '') + '>' +
			'</div>';
		return html;
	}

	// 切换预设时自动填充 icon/name（仅当当前行 icon/name 为空时填充）
	function applyPresetDefaults(tr, presetKey) {
		if (!tr) return;
		var cfg = URL_PRESETS[presetKey];
		if (!cfg) return;
		// 找到该行的 icon 和 name 输入框（兼容 nav/sidebar/discover 前缀）
		var iconInput = tr.querySelector('input[name$="_icon[]"]');
		var nameInput = tr.querySelector('input[name$="_name[]"]');
		if (iconInput && !iconInput.value && cfg.icon) {
			iconInput.value = cfg.icon;
			// 更新图标预览
			var preview = tr.querySelector('.icon-preview');
			if (preview) preview.innerHTML = '<i class="' + cfg.icon + '"></i>';
		}
		if (nameInput && !nameInput.value && cfg.name) {
			nameInput.value = cfg.name;
		}
	}

	function bindUrlCell(td, urlInput) {
		var sel = td.querySelector('.url-preset-select');
		var inp = td.querySelector('input[type="text"]');
		var tr = td.closest('tr');
		sel.addEventListener('change', function() {
			var cfg = URL_PRESETS[this.value] || URL_PRESETS.custom;
			if (this.value === 'custom') {
				// 保持原值不变，便于编辑
				inp.removeAttribute('readonly');
				inp.placeholder = 'URL';
			} else if (this.value === 'external') {
				inp.removeAttribute('readonly');
				inp.placeholder = 'https://';
				// 如果原值是内部预设路由，清空避免混淆
				if (URL_PRESETS[inp.value] && inp.value !== 'custom' && inp.value !== 'external') {
					inp.value = '';
				}
			} else {
				inp.value = cfg.url;
				inp.setAttribute('readonly', 'readonly');
				inp.placeholder = '';
				// 自动填充 icon/name（仅当为空时）
				applyPresetDefaults(tr, this.value);
			}
			refreshAllPreviews();
		});
		inp.addEventListener('input', refreshAllPreviews);
	}

	// ====== 拖拽排序（原生 HTML5，仅 handle 可拖） ======
	function bindDragSort(tbody) {
		var dragRow = null;
		tbody.addEventListener('dragstart', function(e) {
			// 只响应 .drag-handle 触发的拖拽
			var handle = e.target.closest('.drag-handle');
			if (!handle) { e.preventDefault(); return; }
			var tr = handle.closest('tr');
			if (!tr) return;
			dragRow = tr;
			tr.classList.add('nav-row-dragging');
			e.dataTransfer.effectAllowed = 'move';
			try { e.dataTransfer.setData('text/plain', ''); } catch(_) {}
			// 拖动虚影显示整行而非仅 handle
			if (e.dataTransfer.setDragImage) {
				try { e.dataTransfer.setDragImage(tr, 20, tr.offsetHeight / 2); } catch(_) {}
			}
		});
		tbody.addEventListener('dragover', function(e) {
			if (!dragRow) return;
			var tr = e.target.closest('tr');
			if (!tr || tr === dragRow) return;
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';
			// 清除所有标记
			tbody.querySelectorAll('.nav-row-drag-over-before, .nav-row-drag-over-after').forEach(function(r) {
				r.classList.remove('nav-row-drag-over-before', 'nav-row-drag-over-after');
			});
			// 按鼠标位置（上半/下半）显示对应边的指示线
			var rect = tr.getBoundingClientRect();
			var isAfter = (e.clientY - rect.top) > rect.height / 2;
			tr.classList.add(isAfter ? 'nav-row-drag-over-after' : 'nav-row-drag-over-before');
		});
		tbody.addEventListener('dragleave', function(e) {
			if (!tbody.contains(e.relatedTarget)) {
				tbody.querySelectorAll('.nav-row-drag-over-before, .nav-row-drag-over-after').forEach(function(r) {
					r.classList.remove('nav-row-drag-over-before', 'nav-row-drag-over-after');
				});
			}
		});
		tbody.addEventListener('drop', function(e) {
			if (!dragRow) return;
			e.preventDefault();
			var tr = e.target.closest('tr');
			if (!tr || tr === dragRow) { dragRow = null; return; }
			var rect = tr.getBoundingClientRect();
			var isAfter = (e.clientY - rect.top) > rect.height / 2;
			if (isAfter) {
				tr.parentNode.insertBefore(dragRow, tr.nextSibling);
			} else {
				tr.parentNode.insertBefore(dragRow, tr);
			}
			tbody.querySelectorAll('.nav-row-drag-over-before, .nav-row-drag-over-after').forEach(function(r) {
				r.classList.remove('nav-row-drag-over-before', 'nav-row-drag-over-after');
			});
		});
		tbody.addEventListener('dragend', function() {
			if (dragRow) dragRow.classList.remove('nav-row-dragging');
			dragRow = null;
			// 兜底清除所有残留指示
			tbody.querySelectorAll('.nav-row-drag-over-before, .nav-row-drag-over-after').forEach(function(r) {
				r.classList.remove('nav-row-drag-over-before', 'nav-row-drag-over-after');
			});
			refreshIndentAndRank(tbody);
			refreshAllPreviews();
		});
	}

	// ====== 刷新行层级缩进 + 重写 rank（数组顺序分组：title 后的 link 为其子项） ======
	function refreshIndentAndRank(tbody) {
		var rows = tbody.querySelectorAll('tr');
		var inGroup = false; // 是否处于某个 title 分组内
		rows.forEach(function(tr, i) {
			// 重写 rank（按 DOM 顺序）
			var rankInput = tr.querySelector('input[name$="_rank[]"]');
			if (rankInput) rankInput.value = i;

			var type = tr.getAttribute('data-nav-type') || 'link';
			if (type === 'title') {
				tr.classList.add('nav-row-title');
				tr.classList.remove('nav-row-child');
				inGroup = true;
			} else if (type === 'top_link') {
				// 一级链接：永远不缩进，且中断 title 分组（后续 link 不再归属前面的 title）
				tr.classList.remove('nav-row-title', 'nav-row-child');
				inGroup = false;
			} else {
				if (inGroup) {
					tr.classList.add('nav-row-child');
					tr.classList.remove('nav-row-title');
				} else {
					tr.classList.remove('nav-row-title', 'nav-row-child');
				}
			}
		});
	}

	// ====== 顶部导航预览（二级直接展示，不用 dropdown，缩进区分层级） ======
	function refreshTopNavPreview() {
		var preview = document.getElementById('topNavPreview');
		if (!preview) return;
		var tbody = document.getElementById('topNavBody');
		var rows = tbody.querySelectorAll('tr');
		var items = [];
		rows.forEach(function(tr) {
			var type = tr.getAttribute('data-nav-type') || 'link';
			var icon = (tr.querySelector('input[name="nav_icon[]"]') || {}).value || '';
			var name = (tr.querySelector('input[name="nav_name[]"]') || {}).value || '';
			var url  = (tr.querySelector('input[name="nav_url[]"]') || {}).value || '';
			if (!name && !icon) return;
			items.push({ type: type, icon: icon, name: name, url: url });
		});
		if (!items.length) {
			preview.innerHTML = '<span class="nav-preview-empty"><?php echo lang('admin_nav_preview_empty');?></span>';
			return;
		}
		// 预览：一级横向排列；title 的子项纵向缩进展示在 title 下方
		var html = '<ul class="navbar-nav flex-row gap-3 align-items-start flex-wrap">';
		var i = 0;
		while (i < items.length) {
			var it = items[i];
			if (it.type === 'title') {
				// 收集子项（到下一个 title 或 top_link 之前的 link）
				var children = [];
				var j = i + 1;
				while (j < items.length && items[j].type !== 'title' && items[j].type !== 'top_link') {
					children.push(items[j]);
					j++;
				}
				if (!children.length) {
					// 无子项：title 作为一级链接
					html += '<li class="nav-item"><a class="nav-link py-1 px-2" href="' + escHtml(it.url || '#') + '">';
					if (it.icon) html += '<i class="ti ' + escHtml(it.icon) + ' me-1"></i>';
					html += escHtml(it.name) + '</a></li>';
				} else {
					// 有子项：标题 + 子项直接展示（缩进，不用 dropdown）
					html += '<li class="nav-item">';
					html += '<div class="fw-semibold   py-1 px-2">';
					if (it.icon) html += '<i class="ti ' + escHtml(it.icon) + ' me-1"></i>';
					html += escHtml(it.name) + '</div>';
					html += '<ul class="list-unstyled ms-1">';
					children.forEach(function(c) {
						html += '<li><a class="nav-link py-1 px-2 d-inline-flex align-items-center"  style="font-size:12px;;"  href="' + escHtml(c.url || '#') + '">';
						if (c.icon) html += '<i class="ti ' + escHtml(c.icon) + ' me-1"></i>';
						html += escHtml(c.name) + '</a></li>';
					});
					html += '</ul></li>';
				}
				i = j;
			} else {
				// 一级 link 或 top_link
				html += '<li class="nav-item"><a class="nav-link py-1 px-2" href="' + escHtml(it.url || '#') + '">';
				if (it.icon) html += '<i class="ti ' + escHtml(it.icon) + ' me-1"></i>';
				html += escHtml(it.name) + '</a></li>';
				i++;
			}
		}
		html += '</ul>';
		preview.innerHTML = html;
	}

	function refreshAllPreviews() {
		refreshTopNavPreview();
		refreshMobileNavPreview();
	}

			' <span class="text-muted">(<?php echo lang('admin_plugin_nav_readonly');?>)</span></div>' +
			'<div class="d-flex flex-wrap gap-2">';
		items.forEach(function(it) {
			var icon = it.icon || '';
			var name = it.name || '';
			var url = it.url || '';
			html += '<div class="input-group input-group-sm" style="max-width:320px;">' +
				'<span class="input-group-text bg-transparent">' +
					(icon ? '<i class="ti ' + escHtml(icon) + '"></i>' : '<i class="ti ti-plug text-body-secondary"></i>') +
				'</span>' +
				'<input type="text" class="form-control" value="' + escHtml(name) + '" readonly>' +
				'<input type="text" class="form-control" value="' + escHtml(url) + '" readonly>' +
				'<button type="button" class="btn btn-outline-secondary copy-url-btn" title="<?php echo lang('admin_copy_url');?>"><i class="ti ti-copy"></i></button>' +
			'</div>';
		});
		html += '</div></div>';
		container.innerHTML = html;
		// 绑定复制按钮
		container.querySelectorAll('.copy-url-btn').forEach(function(btn) {
			btn.addEventListener('click', function() {
				var urlInput = this.parentElement.querySelectorAll('input')[1];
				urlInput.select();
				document.execCommand('copy');
				showToast('<?php echo lang('admin_url_copied');?>', 'success');
			});
		});
	}
	renderPluginList('topPluginList', pluginItemsTop);
	renderPluginList('sidePluginList', pluginItemsSide);
	renderPluginList('mobilePluginList', pluginItemsMobile);

	// ====== 手机导航行（custom 行可编辑；插件行纯展示+URL复制） ======
	function createMobileNavRow(item) {
		var tr = document.createElement('tr');

		var iconVal = item.icon || '';
		var iconActiveVal = item.icon_active || '';
		var nameVal = item.name || '';
		var urlVal = item.url || '';
		var classVal = item.class || '';
		var rankVal = item.rank || 0;
		var needLoginVal = item.need_login || 0;
		var sourceVal = item.source || 'custom';

		tr.setAttribute('data-nav-source', sourceVal);

		// custom 项：正常可编辑行
		tr.innerHTML =
			'<td class="drag-handle" draggable="true"><i class="ti ti-grip-vertical"></i></td>' +
			'<td>' +
				'<div class="input-group input-group-sm">' +
					'<span class="input-group-text p-0 px-2 icon-preview" style="min-width:32px;justify-content:center">' +
						(iconVal ? '<i class="ti ' + iconVal + '"></i>' : '<i class="ti ti-circle-dot text-body-secondary"></i>') +
					'</span>' +
					'<input type="text" class="form-control form-control-sm" name="mobile_icon[]" value="' + escHtml(iconVal) + '" placeholder="<?php echo lang('admin_click_to_select')?>" readonly style="cursor:pointer">' +
				'</div>' +
			'</td>' +
			'<td>' +
				'<div class="input-group input-group-sm">' +
					'<span class="input-group-text p-0 px-2 icon-preview" style="min-width:32px;justify-content:center">' +
						(iconActiveVal ? '<i class="ti ' + iconActiveVal + '"></i>' : '<i class="ti ti-circle-dot text-body-secondary"></i>') +
					'</span>' +
					'<input type="text" class="form-control form-control-sm" name="mobile_icon_active[]" value="' + escHtml(iconActiveVal) + '" placeholder="<?php echo lang('admin_click_to_select')?>" readonly style="cursor:pointer">' +
				'</div>' +
			'</td>' +
			'<td><input type="text" class="form-control form-control-sm" name="mobile_name[]" value="' + escHtml(nameVal) + '" placeholder="<?php echo lang('admin_col_name')?>"></td>' +
		'<td><input type="text" class="form-control form-control-sm" name="mobile_class[]" value="' + escHtml(classVal) + '" placeholder="<?php echo lang('admin_col_class')?>"></td>' +
		'<td>' + buildUrlCell('mobile', urlVal, 'mobile_url[]') + '</td>' +
			'<td class="text-center"><div class="form-check form-switch d-inline-block"><input type="hidden" name="mobile_need_login[]" value="' + (needLoginVal ? '1' : '0') + '"><input class="form-check-input" type="checkbox" value="1"' + (needLoginVal ? ' checked' : '') + ' onchange="this.previousElementSibling.value=this.checked?\'1\':\'0\'"></div></td>' +
			'<td class="text-center"><a role="button" class="text-danger" title="<?php echo lang('delete')?>"><i class="ti ti-trash"></i></a></td>' +
			'<input type="hidden" name="mobile_rank[]" value="' + rankVal + '">';

		var iconInput = tr.querySelector('input[name="mobile_icon[]"]');
		new TablerIconPicker({
			input: iconInput,
			preview: iconInput.closest('.input-group').querySelector('.icon-preview'),
			onSelect: refreshAllPreviews
		});

		var iconActiveInput = tr.querySelector('input[name="mobile_icon_active[]"]');
		new TablerIconPicker({
			input: iconActiveInput,
			preview: iconActiveInput.closest('.input-group').querySelector('.icon-preview'),
			onSelect: refreshAllPreviews
		});

		var urlTd = tr.querySelectorAll('td')[5];
		bindUrlCell(urlTd, tr.querySelector('input[name="mobile_url[]"]'));

		tr.querySelector('input[name="mobile_name[]"]').addEventListener('input', refreshAllPreviews);
		var loginChk = tr.querySelector('td input.form-check-input');
		if (loginChk) loginChk.addEventListener('change', refreshAllPreviews);

		var deleteBtn = tr.querySelector('a[title="<?php echo lang('delete')?>"]');
		deleteBtn.addEventListener('click', function(e) { e.preventDefault(); tr.remove(); refreshAllPreviews(); });

		return tr;
	}

	// ====== 手机导航预览（简洁横向 bar，和顶部导航类似） ======
	function refreshMobileNavPreview() {
		var preview = document.getElementById('mobileNavPreview');
		if (!preview) return;
		var tbody = document.getElementById('mobileNavBody');
		var rows = tbody.querySelectorAll('tr');
		var items = [];
		rows.forEach(function(tr) {
			var icon = (tr.querySelector('input[name="mobile_icon[]"]') || {}).value || '';
			var iconActive = (tr.querySelector('input[name="mobile_icon_active[]"]') || {}).value || '';
			var name = (tr.querySelector('input[name="mobile_name[]"]') || {}).value || '';
			var url  = (tr.querySelector('input[name="mobile_url[]"]') || {}).value || '';
			var needLoginHidden = tr.querySelector('input[name="mobile_need_login[]"]');
			var needLogin = needLoginHidden ? (needLoginHidden.value === '1') : false;
			if (!name && !icon) return;
			items.push({ icon: icon, iconActive: iconActive, name: name, url: url, needLogin: needLogin });
		});
		if (!items.length) {
			preview.innerHTML = '<span class="nav-preview-empty"><?php echo lang('admin_nav_preview_empty');?></span>';
			return;
		}
		// 横向 bar，每项显示图标+名称
		var html = '<div class="d-flex flex-wrap gap-3 align-items-center">';
		items.forEach(function(it) {
			var iconClass = it.iconActive || it.icon || 'ti-circle-dot';
			if (iconClass.indexOf('ti ') !== 0) iconClass = 'ti ' + iconClass;
			html += '<span class="d-inline-flex align-items-center gap-1" title="' + escHtml(it.url || '') + (it.needLogin ? ' (<?php echo lang('admin_mobile_nav_need_login');?>)' : '') + '">';
			html += '<i class="' + escHtml(iconClass) + '"></i>';
			html += '<span>' + escHtml(it.name || '') + '</span>';
			if (it.needLogin) html += '<i class="ti ti-lock text-body-secondary" style="font-size:0.7rem"></i>';
			html += '</span>';
		});
		html += '</div>';
		preview.innerHTML = html;
	}

	function renderMobileNavList(items) {
		var tbody = document.getElementById('mobileNavBody');
		tbody.innerHTML = '';
		items.forEach(function(item) { tbody.appendChild(createMobileNavRow(item)); });
	}

	renderMobileNavList(mobileNavItems);

	// 绑定拖拽
	bindDragSort(document.getElementById('topNavBody'));
	bindDragSort(document.getElementById('sideNavBody'));
	bindDragSort(document.getElementById('mobileNavBody'));
	bindDragSort(document.getElementById('discoverBody'));

	// 初始预览
	refreshAllPreviews();

	document.getElementById('addMobileNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('mobileNavBody').appendChild(createMobileNavRow({}));
		refreshAllPreviews();
	});
	document.getElementById('addTopNav').addEventListener('click', function(e) {
		e.preventDefault();
		var tbody = document.getElementById('topNavBody');
		tbody.appendChild(createTopNavRow({type: 'top_link'}));
		refreshIndentAndRank(tbody);
		refreshAllPreviews();
	});
	document.getElementById('addTopNavTitle').addEventListener('click', function(e) {
		e.preventDefault();
		var tbody = document.getElementById('topNavBody');
		tbody.appendChild(createTopNavRow({type: 'title'}));
		refreshIndentAndRank(tbody);
		refreshAllPreviews();
	});
	document.getElementById('addSideNav').addEventListener('click', function(e) {
		e.preventDefault();
		var tbody = document.getElementById('sideNavBody');
		tbody.appendChild(createSideNavRow({type: 'top_link'}));
		refreshIndentAndRank(tbody);
	});
	document.getElementById('addSideNavTitle').addEventListener('click', function(e) {
		e.preventDefault();
		var tbody = document.getElementById('sideNavBody');
		tbody.appendChild(createSideNavRow({type: 'title'}));
		refreshIndentAndRank(tbody);
	});
	document.getElementById('addDiscover').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('discoverBody').appendChild(createDiscoverNavRow({}));
	});

	// ====== 表单提交 ======
	var form = document.getElementById('navForm');
	var submitBtn = document.getElementById('submitBtn');
	form.addEventListener('submit', function(e) {
		e.preventDefault();

		// 提交前重排所有 rank，确保和 DOM 顺序一致
		['topNavBody','sideNavBody','mobileNavBody','discoverBody'].forEach(function(id) {
			var tbody = document.getElementById(id);
			if (tbody) refreshIndentAndRank(tbody);
		});

		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			body: formData,
			headers: {
				'X-Requested-With': 'XMLHttpRequest'
			}
		})
		.then(function(res) { return res.json(); })
		.then(function(data) {
			if (parseInt(data.code) === 0) {
				showToast(data.message, 'success');
				submitBtn.innerHTML = '<i class="ti ti-check me-1"></i>' + data.message;
				submitBtn.classList.remove('btn-primary');
				submitBtn.classList.add('btn-success');

				// 用服务器返回的最新数据直接重新渲染页面
				// 完全绕过浏览器/OPcache/反向代理缓存，保存不走任何缓存
				if (data.nav_items) {
					topNavItems = data.nav_items;
					renderTopNavList(topNavItems);
				}
				if (data.sidebar_nav_items) {
					sideNavItems = data.sidebar_nav_items;
					renderSideNavList(sideNavItems);
				}
				if (data.discover_items) {
					discoverItems = data.discover_items;
					renderDiscoverNavList(discoverItems);
				}
				if (data.mobile_nav_items) {
					mobileNavItems = data.mobile_nav_items;
					renderMobileNavList(mobileNavItems);
				}
				if (data.mobile_nav_enable !== undefined) {
					document.getElementById('mobileNavEnable').checked = !!data.mobile_nav_enable;
				}

				// 重新渲染所有预览
				refreshAllPreviews();

				// 恢复提交按钮
				setTimeout(function() {
					submitBtn.disabled = false;
					submitBtn.innerHTML = '<?php echo lang('confirm');?>';
					submitBtn.classList.remove('btn-success');
					submitBtn.classList.add('btn-primary');
				}, 1500);
			} else {
				showToast(data.message, 'error');
				submitBtn.disabled = false;
				submitBtn.innerHTML = '<?php echo lang('confirm');?>';
			}
		})
		.catch(function(err) {
			showToast('<?php echo lang('admin_request_failed_retry')?>', 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<?php echo lang('confirm');?>';
		});
	});
})();
</script>
