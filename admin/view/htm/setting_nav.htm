<script src="../view/js/tabler-icon-picker.js"></script>
<script>
(function() {
	// ====== 导航数据 ======
	var topNavItems = <?php echo xn_json_encode($nav_items);?>;
	var sideNavItems = <?php echo xn_json_encode($sidebar_nav_items);?>;
	var discoverItems = <?php echo xn_json_encode($discover_items);?>;

	// ====== 导航行创建 ======
	function createNavRow(prefix, item) {
		var tr = document.createElement('tr');
		var iconVal = item.icon || '';
		var nameVal = item.name || '';
		var slugVal = item.slug || '';
		var urlVal = item.url || '';
		var rankVal = item.rank || 0;

		tr.innerHTML =
			'<td>' +
				'<div class="input-group input-group-sm">' +
					'<span class="input-group-text p-0 px-2 icon-preview" style="min-width:32px;justify-content:center">' +
						(iconVal ? '<i class="ti ' + iconVal + '"></i>' : '<i class="ti ti-circle-dot text-body-secondary"></i>') +
					'</span>' +
					'<input type="text" class="form-control form-control-sm" name="' + prefix + '_icon[]" value="' + iconVal + '" placeholder="<?php echo lang('admin_click_to_select')?>" readonly style="cursor:pointer">' +
				'</div>' +
			'</td>' +
			'<td><input type="text" class="form-control form-control-sm" name="' + prefix + '_name[]" value="' + nameVal + '" placeholder="<?php echo lang('admin_col_name')?>"></td>' +
			'<td><input type="text" class="form-control form-control-sm" name="' + prefix + '_slug[]" value="' + slugVal + '" placeholder="slug"></td>' +
			'<td><input type="text" class="form-control form-control-sm" name="' + prefix + '_url[]" value="' + urlVal + '" placeholder="URL"></td>' +
			'<td><input type="number" class="form-control form-control-sm text-center" name="' + prefix + '_rank[]" value="' + rankVal + '"></td>' +
			'<td class="text-center"><a role="button" class="text-danger" title="<?php echo lang('delete')?>"><i class="ti ti-trash"></i></a></td>';

		var iconInput = tr.querySelector('input[name="' + prefix + '_icon[]"]');
		var iconPreview = tr.querySelector('.icon-preview');
		new TablerIconPicker({
			input: iconInput,
			preview: iconPreview
		});

		var deleteBtn = tr.querySelector('a[title="<?php echo lang('delete')?>"]');
		deleteBtn.addEventListener('click', function(e) {
			e.preventDefault();
			tr.remove();
		});

		return tr;
	}

	function renderNavList(prefix, items, tbodyId) {
		var tbody = document.getElementById(tbodyId);
		tbody.innerHTML = '';
		items.forEach(function(item) {
			tbody.appendChild(createNavRow(prefix, item));
		});
	}

	// ====== 侧边栏导航行（支持类型：link/title） ======
	function createSideNavRow(item) {
		var tr = document.createElement('tr');
		var typeVal = item.type || 'link';
		var iconVal = item.icon || '';
		var nameVal = item.name || '';
		var slugVal = item.slug || '';
		var urlVal = item.url || '';
		var rankVal = item.rank || 0;
		var isTitle = typeVal === 'title';

		tr.setAttribute('data-nav-type', typeVal);
		tr.innerHTML =
			'<td>' +
				'<select class="form-select form-select-sm sidebar-type-select" name="sidebar_type[]">' +
					'<option value="link"' + (typeVal === 'link' ? ' selected' : '') + '><?php echo lang('admin_type_link');?></option>' +
					'<option value="title"' + (typeVal === 'title' ? ' selected' : '') + '><?php echo lang('admin_type_title');?></option>' +
				'</select>' +
			'</td>' +
			'<td class="sidebar-icon-cell' + (isTitle ? ' d-none' : '') + '">' +
				'<div class="input-group input-group-sm">' +
					'<span class="input-group-text p-0 px-2 icon-preview" style="min-width:32px;justify-content:center">' +
						(iconVal ? '<i class="ti ' + iconVal + '"></i>' : '<i class="ti ti-circle-dot text-body-secondary"></i>') +
					'</span>' +
					'<input type="text" class="form-control form-control-sm" name="sidebar_icon[]" value="' + iconVal + '" placeholder="<?php echo lang('admin_click_to_select')?>" readonly style="cursor:pointer">' +
				'</div>' +
			'</td>' +
			'<td><input type="text" class="form-control form-control-sm" name="sidebar_name[]" value="' + nameVal + '" placeholder="<?php echo lang('admin_col_name')?>"></td>' +
			'<td class="sidebar-slug-cell' + (isTitle ? ' d-none' : '') + '"><input type="text" class="form-control form-control-sm" name="sidebar_slug[]" value="' + slugVal + '" placeholder="slug"></td>' +
			'<td class="sidebar-url-cell' + (isTitle ? ' d-none' : '') + '"><input type="text" class="form-control form-control-sm" name="sidebar_url[]" value="' + urlVal + '" placeholder="URL"></td>' +
			'<td><input type="number" class="form-control form-control-sm text-center" name="sidebar_rank[]" value="' + rankVal + '"></td>' +
			'<td class="text-center"><a role="button" class="text-danger" title="<?php echo lang('delete')?>"><i class="ti ti-trash"></i></a></td>';

		// 类型切换：标题时隐藏图标/Slug/URL
		var typeSelect = tr.querySelector('.sidebar-type-select');
		typeSelect.addEventListener('change', function() {
			var isTitle = this.value === 'title';
			var iconCell = tr.querySelector('.sidebar-icon-cell');
			var slugCell = tr.querySelector('.sidebar-slug-cell');
			var urlCell = tr.querySelector('.sidebar-url-cell');
			if (isTitle) {
				iconCell.classList.add('d-none');
				slugCell.classList.add('d-none');
				urlCell.classList.add('d-none');
			} else {
				iconCell.classList.remove('d-none');
				slugCell.classList.remove('d-none');
				urlCell.classList.remove('d-none');
			}
		});

		// 图标选择器
		var iconInput = tr.querySelector('input[name="sidebar_icon[]"]');
		var iconPreview = tr.querySelector('.icon-preview');
		new TablerIconPicker({
			input: iconInput,
			preview: iconPreview
		});

		// 删除
		var deleteBtn = tr.querySelector('a[title="<?php echo lang('delete')?>"]');
		deleteBtn.addEventListener('click', function(e) {
			e.preventDefault();
			tr.remove();
		});

		return tr;
	}

	function renderSideNavList(items) {
		var tbody = document.getElementById('sideNavBody');
		tbody.innerHTML = '';
		items.forEach(function(item) {
			tbody.appendChild(createSideNavRow(item));
		});
	}

	renderNavList('nav', topNavItems, 'topNavBody');
	renderSideNavList(sideNavItems);
	renderNavList('discover', discoverItems, 'discoverBody');

	document.getElementById('addTopNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('topNavBody').appendChild(createNavRow('nav', {}));
	});
	document.getElementById('addSideNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('sideNavBody').appendChild(createSideNavRow({type: 'link'}));
	});
	document.getElementById('addSideNavTitle').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('sideNavBody').appendChild(createSideNavRow({type: 'title'}));
	});
	document.getElementById('addDiscover').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('discoverBody').appendChild(createNavRow('discover', {}));
	});

	// ====== 表单提交 ======
	var form = document.getElementById('navForm');
	var submitBtn = document.getElementById('submitBtn');
	form.addEventListener('submit', function(e) {
		e.preventDefault();

		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			body: formData,
			headers: {
				'X-Requested-With': 'XMLHttpRequest'
			}
		})
		.then(function(res) { return res.json(); })
		.then(function(data) {
			if (parseInt(data.code) === 0) {
				showToast(data.message, 'success');
				submitBtn.innerHTML = '<i class="ti ti-check me-1"></i>' + data.message;
				submitBtn.classList.remove('btn-primary');
				submitBtn.classList.add('btn-success');
				setTimeout(function() {
					submitBtn.disabled = false;
					submitBtn.innerHTML = '<?php echo lang('confirm');?>';
					submitBtn.classList.remove('btn-success');
					submitBtn.classList.add('btn-primary');
				}, 1500);
			} else {
				showToast(data.message, 'error');
				submitBtn.disabled = false;
				submitBtn.innerHTML = '<?php echo lang('confirm');?>';
			}
		})
		.catch(function(err) {
			showToast('<?php echo lang('admin_request_failed_retry')?>', 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<?php echo lang('confirm');?>';
		});
	});
})();
</script>
