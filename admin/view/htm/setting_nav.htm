<script>
// ====== 子Tab切换（使用 URL hash 保持刷新后状态） ======
var navTabMap = {
    'topNav': 'topNavPane',
    'sideNav': 'sideNavPane',
    'mobileNav': 'mobileNavPane',
    'discover': 'discoverPane',
    'footer': 'footerPane'
};

function switchNavTab(tabName) {
    document.querySelectorAll('#navTab .nav-link').forEach(function(a) { a.classList.remove('active'); });
    document.querySelectorAll('.nav-tab-pane').forEach(function(p) { p.style.display = 'none'; });
    var activeLink = document.querySelector('#navTab .nav-link[data-nav-tab="' + tabName + '"]');
    var targetPane = document.getElementById(navTabMap[tabName]);
    if(activeLink) activeLink.classList.add('active');
    if(targetPane) targetPane.style.display = '';
    if(history.replaceState) {
        history.replaceState(null, '', '#' + tabName);
    }
}

document.querySelectorAll('#navTab .nav-link[data-nav-tab]').forEach(function(a) {
    a.addEventListener('click', function(e) {
        e.preventDefault();
        var tab = this.getAttribute('data-nav-tab');
        if(tab) switchNavTab(tab);
    });
});

// 页面加载时根据 URL hash 恢复 tab
(function() {
    var hash = location.hash.replace('#', '');
    if(hash && navTabMap[hash]) {
        switchNavTab(hash);
    }
})();

			preview: iconActivePreview
		});

		var deleteBtn = tr.querySelector('a[title="<?php echo lang('delete')?>"]');
		deleteBtn.addEventListener('click', function(e) {
			e.preventDefault();
			tr.remove();
		});

		return tr;
	}

	function renderMobileNavList(items) {
		var tbody = document.getElementById('mobileNavBody');
		tbody.innerHTML = '';
		items.forEach(function(item) {
			tbody.appendChild(createMobileNavRow(item));
		});
	}

	renderMobileNavList(mobileNavItems);

	document.getElementById('addMobileNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('mobileNavBody').appendChild(createMobileNavRow({}));
	});

	document.getElementById('addTopNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('topNavBody').appendChild(createTopNavRow({type: 'link'}));
	});
	document.getElementById('addTopNavTitle').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('topNavBody').appendChild(createTopNavRow({type: 'title'}));
	});
	document.getElementById('addSideNav').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('sideNavBody').appendChild(createSideNavRow({type: 'link'}));
	});
	document.getElementById('addSideNavTitle').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('sideNavBody').appendChild(createSideNavRow({type: 'title'}));
	});
	document.getElementById('addDiscover').addEventListener('click', function(e) {
		e.preventDefault();
		document.getElementById('discoverBody').appendChild(createNavRow('discover', {}));
	});

	// ====== 表单提交 ======
	var form = document.getElementById('navForm');
	var submitBtn = document.getElementById('submitBtn');
	form.addEventListener('submit', function(e) {
		e.preventDefault();

		submitBtn.disabled = true;
		submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span><?php echo lang('submiting');?>...';

		var formData = new FormData(form);

		fetch(form.action, {
			method: 'POST',
			body: formData,
			headers: {
				'X-Requested-With': 'XMLHttpRequest'
			}
		})
		.then(function(res) { return res.json(); })
		.then(function(data) {
			if (parseInt(data.code) === 0) {
				showToast(data.message, 'success');
				submitBtn.innerHTML = '<i class="ti ti-check me-1"></i>' + data.message;
				submitBtn.classList.remove('btn-primary');
				submitBtn.classList.add('btn-success');
				setTimeout(function() {
					submitBtn.disabled = false;
					submitBtn.innerHTML = '<?php echo lang('confirm');?>';
					submitBtn.classList.remove('btn-success');
					submitBtn.classList.add('btn-primary');
				}, 1500);
			} else {
				showToast(data.message, 'error');
				submitBtn.disabled = false;
				submitBtn.innerHTML = '<?php echo lang('confirm');?>';
			}
		})
		.catch(function(err) {
			showToast('<?php echo lang('admin_request_failed_retry')?>', 'error');
			submitBtn.disabled = false;
			submitBtn.innerHTML = '<?php echo lang('confirm');?>';
		});
	});
})();
</script>
