<script>
var jform = document.getElementById('form');
var jsubmit = document.getElementById('submit');
jform.addEventListener('submit', function(e) {
	e.preventDefault();
	var postdata = new FormData(jform);
	jsubmit.disabled = true;
	jsubmit.textContent = jsubmit.dataset.loadingText || 'Installing...';

	fetch(jform.action, {
		method: 'POST',
		body: postdata
	}).then(function(response) {
		return response.json();
	}).then(function(data) {
		if(data.code == 0) {
			if(data.redirect) {
				window.location = data.redirect;
			} else {
				window.location = '../';
			}
		} else if(data.code == 1) {
			// 二次确认：数据库已有表
			if(confirm(data.message)) {
				var forceInput = document.createElement('input');
				forceInput.type = 'hidden';
				forceInput.name = 'force';
				forceInput.value = '1';
				jform.appendChild(forceInput);
				jsubmit.disabled = false;
				jsubmit.textContent = jsubmit.dataset.originalText || 'Submit';
				jform.dispatchEvent(new Event('submit'));
			} else {
				jsubmit.disabled = false;
				jsubmit.textContent = jsubmit.dataset.originalText || 'Submit';
			}
		} else if(data.code < 0) {
			alert(data.message);
			jsubmit.disabled = false;
			jsubmit.textContent = jsubmit.dataset.originalText || 'Submit';
		} else {
			var field = jform.querySelector('[name="'+data.code+'"]');
			if(field) {
				field.focus();
				alert(data.message);
			}
			jsubmit.disabled = false;
			jsubmit.textContent = jsubmit.dataset.originalText || 'Submit';
		}
	}).catch(function(err) {
		alert('Request failed: ' + err.message);
		jsubmit.disabled = false;
		jsubmit.textContent = jsubmit.dataset.originalText || 'Submit';
	});
});
</script>
