<script>
(function() {
	var box = document.getElementById('license-box');
	var check = document.getElementById('agree_check');
	var label = document.getElementById('agree_label');
	var noIllegalCheck = document.getElementById('no_illegal_check');
	var btn = document.getElementById('btn_continue');

	var hintEl = document.getElementById('scroll-hint');
	var statusWaiting = document.getElementById('status-waiting');
	var statusCountdown = document.getElementById('status-countdown');
	var statusReady = document.getElementById('status-ready');
	var countdownNum = document.getElementById('countdown-num');
	var countdownRing = document.getElementById('countdown-ring');

	var triggered = false;
	var totalSeconds = 10;
	var circumference = 2 * Math.PI * 28; // ~175.93

	// 防抖：确保滚动到底部后稳定停留才触发
	var debounceTimer = null;

	function showStatus(which) {
		statusWaiting.classList.add('d-none');
		statusCountdown.classList.add('d-none');
		statusReady.classList.add('d-none');
		which.classList.remove('d-none');
	}

	function startCountdown() {
		if (triggered) return;
		triggered = true;

		// 隐藏阅读提示
		hintEl.style.display = 'none';

		// 显示倒计时
		showStatus(statusCountdown);
		countdownNum.textContent = totalSeconds;
		countdownRing.style.strokeDashoffset = '0';

		var elapsed = 0;
		var timer = setInterval(function() {
			elapsed++;
			var remaining = totalSeconds - elapsed;
			countdownNum.textContent = remaining > 0 ? remaining : '';

			// 环形进度
			var progress = elapsed / totalSeconds;
			countdownRing.style.strokeDashoffset = (circumference * progress).toFixed(2);

			if (elapsed >= totalSeconds) {
			clearInterval(timer);
			// 显示就绪
			showStatus(statusReady);
			check.disabled = false;
			noIllegalCheck.disabled = false;
		}
		}, 1000);
	}

	box.addEventListener('scroll', function() {
		if (triggered) return;

		var atBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 20;

		if (atBottom) {
			// 每次到达底部都重置防抖，确保用户确实在底部停留
			clearTimeout(debounceTimer);
			debounceTimer = setTimeout(startCountdown, 300);
		} else {
			// 离开底部时清除等待中的防抖
			clearTimeout(debounceTimer);
			debounceTimer = null;
		}
	});

	// 两个勾选都满足后启用按钮
	function updateButton() {
		btn.disabled = !(check.checked && noIllegalCheck.checked);
	}
	check.addEventListener('change', updateButton);
	noIllegalCheck.addEventListener('change', updateButton);
})();
</script>
